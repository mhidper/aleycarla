<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Los hidruros</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
/* Los hidruros: misma familia que el Laboratorio de Física y Química (cuaderno cuadriculado, sellos B/M, estrellas). */
:root{
  --bg:#eeecf6; --paper:#fdfdfb; --grid:#e6e3f1; --ink:#1f1d3a; --muted:#5d5a7a; --line:#d6d2e6;
  --marker:#c0127e; --marker-soft:#fbe4f1; --ok:#17734a; --ok-soft:#ddf2e6; --btn:#1f1d3a; --btn-fg:#fdfdfb; --chip:#ffffff;
  --star:#d9a400; --lit:#0b7a75;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12101f; --paper:#1b1830; --grid:#25213d; --ink:#ebe8f7; --muted:#a6a1c4; --line:#332e52;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#ebe8f7; --btn-fg:#12101f; --chip:#1f1b36;
  --star:#ffd23f; --lit:#5fd3c9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12101f; --paper:#1b1830; --grid:#25213d; --ink:#ebe8f7; --muted:#a6a1c4; --line:#332e52;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#ebe8f7; --btn-fg:#12101f; --chip:#1f1b36;
  --star:#ffd23f; --lit:#5fd3c9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.back{font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:700}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.1;margin:0;letter-spacing:-.01em}
header h1 span{color:var(--marker);font-family:var(--f-hand);font-size:1.15em;margin-left:.15em}
header p{margin:.35em 0 0;color:var(--muted);max-width:56ch}
.score{display:flex;align-items:center;gap:6px;font:800 1.4rem var(--f-display);font-variant-numeric:tabular-nums}.score svg{width:28px;height:28px}
.tabs{display:flex;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 .95rem var(--f-body);padding:10px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:400 .9rem var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.sheet{position:relative;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:6px;padding:20px 18px 22px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(30,20,60,.45);display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-right:56px}
h2{font:800 1.35rem var(--f-display);margin:0;text-wrap:balance}
h3{font:800 1.05rem var(--f-display);margin:0}
.primary{background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;font:700 1rem var(--f-body);padding:12px 20px;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:700 1rem var(--f-body);padding:11px 16px;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:.9rem;color:var(--muted);margin:0}
.theme-head{display:flex;align-items:baseline;gap:10px;margin:6px 0 -4px;flex-wrap:wrap}.theme-head h2{font-size:1.2rem;color:var(--lit)}.theme-head span{font-size:.85rem;color:var(--muted);font-weight:700}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.path li{position:relative;padding-left:58px;padding-block:6px}
.path li::before{content:"";position:absolute;left:21px;top:0;bottom:0;border-left:3px dotted var(--line)}
.path li:first-child::before{top:50%}.path li:last-child::before{bottom:50%}
.stop{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.stop:hover{border-color:var(--muted)}.stop b{font:800 1.05rem var(--f-display);display:block}.stop small{color:var(--muted);font-size:.88rem;display:block}
.dot{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 .95rem var(--f-display);background:var(--paper);border:3px solid var(--lit);color:var(--lit)}
.dot.done{background:var(--lit);color:var(--paper)}
.stars{display:flex;gap:2px;flex:none}.stars svg{width:20px;height:20px}
.st-on{fill:var(--star)}.st-off{fill:none;stroke:var(--line);stroke-width:2}
/* Chuleta */
.chuleta{border:2px solid var(--lit)}
.chuleta summary{cursor:pointer;font:800 1.15rem var(--f-display);color:var(--lit);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.chuleta summary::-webkit-details-marker{display:none}
.chuleta summary::after{content:"Abrir";font:700 .85rem var(--f-body);color:var(--muted);border:1.5px solid var(--line);border-radius:8px;padding:3px 10px}
.chuleta[open] summary::after{content:"Cerrar"}
.chuleta[open] summary{margin-bottom:10px}
/* Fichas en cajas */
.idea{margin:0;background:var(--paper);border:2px solid var(--lit);border-radius:12px;padding:12px 14px;font-size:1.08rem;line-height:1.45}
.idea span{display:block;font:700 1.35rem var(--f-hand);color:var(--lit);line-height:1;margin-bottom:4px}
.blk{display:flex;flex-direction:column;gap:8px}
.bh{font:800 1rem var(--f-display);margin:2px 0 0}
.bxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.bx{background:var(--chip);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:3px;font-size:.96rem;line-height:1.42}
.bx>b{font:800 1.02rem var(--f-display)}.bx i{color:var(--muted)}
.ej{border:2px dashed var(--marker);border-radius:12px;padding:10px 14px;background:var(--marker-soft)}
.ejl{font:700 1.35rem var(--f-hand);color:var(--marker);line-height:1}.ej p{margin:4px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{background:var(--chip);border:1.5px solid var(--lit);border-radius:999px;padding:4px 12px;font-size:.92rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--lit);color:var(--paper);font:800 .9rem var(--f-display);display:grid;place-items:center}
.truco{background:var(--marker-soft);border-radius:10px;padding:10px 12px;margin:0}.truco>b:first-child{font-family:var(--f-hand);font-size:1.4rem;color:var(--marker);margin-right:6px}
.ill{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.ill svg{width:100%;max-width:520px;height:auto;display:block;border-radius:12px}
.ill figcaption{font-size:.86rem;color:var(--muted);text-align:center}
/* Textos de ejemplo */
.txt{background:var(--chip);border:1px solid var(--line);border-left:5px solid var(--lit);border-radius:10px;padding:12px 14px;font-size:1.05rem;line-height:1.7;margin:0;width:100%}
.txt .hl{border-radius:4px;padding:1px 3px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.88rem;color:var(--muted);justify-content:center}.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.poem{font-size:1.1rem;line-height:1.8}.poem .r{font-weight:700;border-bottom:3px solid var(--c)}.poem small{color:var(--muted);font-size:.8rem;margin-left:8px;font-weight:700}
.stage .pn{font-weight:800;letter-spacing:.04em}.stage .ac{font-style:italic;color:var(--muted)}
/* Preguntas */
.q{font-size:1.12rem;font-weight:700;margin:0;line-height:1.45}
.prompt{font:800 1.22rem var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.prompt small{display:block;font:400 .95rem var(--f-body);color:var(--muted);margin-top:2px}
.opts{display:flex;flex-direction:column;gap:8px}.opts.two{flex-direction:row}.opts.two .opt{flex:1;text-align:center;font-weight:700}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}.opts.three{display:grid;grid-template-columns:repeat(3,1fr)}.opts.three .opt{text-align:center;font-weight:700}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 1rem var(--f-body);padding:10px 14px;border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--muted)}.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}.opt.wrong{border-color:var(--marker);background:var(--marker-soft)}.opt:disabled{cursor:default}
.exp{border-top:2px solid var(--ink);padding-top:10px;margin:0}
.verdict{font-weight:700;margin:0}.verdict.b{color:var(--ok)}.verdict.mm{color:var(--marker)}
.stamp{position:absolute;top:10px;right:14px;font-family:var(--f-hand);font-size:3.4rem;line-height:1;transform:rotate(-8deg);pointer-events:none}.stamp.b{color:var(--ok)}.stamp.mm{color:var(--marker)}
.pbar{display:flex;gap:5px}.pbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}.pbar i.okk{background:var(--ok)}.pbar i.ko{background:var(--marker)}.pbar i.on{background:var(--ink)}
.bigstars{display:flex;gap:8px;justify-content:center}.bigstars svg{width:56px;height:56px}
@media (prefers-reduced-motion:no-preference){.bigstars svg.anim{animation:pop .45s ease-out both}.bigstars svg:nth-child(2){animation-delay:.15s}.bigstars svg:nth-child(3){animation-delay:.3s}}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}}
.grade{font-family:var(--f-hand);color:var(--marker);font-size:4.4rem;line-height:1;border:3px solid var(--marker);border-radius:50%;width:140px;height:110px;display:grid;place-items:center;transform:rotate(-6deg);margin:6px 0 10px}
.fb{min-height:1.5em;margin:0;font-weight:700}.fb.okk{color:var(--ok)}.fb.ko{color:var(--marker)}
.end{border-top:2px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:8px}.end p{margin:0}
/* Juegos */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.gcard:hover{border-color:var(--muted)}.gcard .ico{font:800 1.5rem var(--f-hand);color:var(--marker);line-height:1}
.gcard b{font:800 1.08rem var(--f-display)}.gcard small{color:var(--muted)}.gcard .best{font-size:.82rem;color:var(--ok);font-weight:700}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.timer{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}.timer i{display:block;height:100%;background:var(--marker);transition:width .2s linear}
.bigq{font:800 1.3rem var(--f-display);text-align:center;min-height:3.4em;display:grid;place-items:center;margin:0;text-wrap:balance;border-radius:10px;padding:4px}
.flash-ok{animation:fok .4s}.flash-ko{animation:fko .4s}@keyframes fok{from{background:var(--ok-soft)}}@keyframes fko{from{background:var(--marker-soft)}}
.quote{font:400 1.12rem var(--f-body);background:var(--chip);border:1px solid var(--line);border-left:5px solid var(--lit);border-radius:10px;padding:12px 14px;margin:0;font-style:italic}
.pool{display:flex;flex-direction:column;gap:8px}
.ev{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 1rem var(--f-body);padding:10px 12px;border-radius:10px;cursor:pointer}
.ev.shake{border-color:var(--marker);animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.ladder li{background:var(--ok-soft);border-radius:8px;padding:6px 10px}.ladder li b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ok)}
.scene{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:12px 14px;line-height:2;font-size:1.05rem}
.scene [data-k]{cursor:pointer;border-radius:5px;padding:1px 2px}.scene [data-k]:hover{background:var(--grid)}
.scene .pn{font-weight:800;letter-spacing:.04em}.scene .ac{font-style:italic;color:var(--muted)}
.scene .okk{background:var(--ok-soft)!important;outline:2px solid var(--ok)}.scene .ko{background:var(--marker-soft)!important}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.clues li{background:var(--chip);border:1px solid var(--line);border-left:5px solid var(--lit);border-radius:8px;padding:8px 12px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match .col{display:flex;flex-direction:column;gap:8px}
.mt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 .95rem var(--f-body);padding:9px 10px;border-radius:10px;cursor:pointer;min-height:48px}
.mt.shake{border-color:var(--marker);animation:shake .35s}
.mt.sel{border-color:var(--lit);background:var(--grid);font-weight:700}.mt.done{border-color:var(--ok);background:var(--ok-soft);cursor:default;opacity:.75}
/* Física y Química */
.pt{display:grid;grid-template-columns:22px repeat(6,minmax(0,1fr));gap:4px;width:100%;max-width:560px}
.pth{font-size:.72rem;color:var(--muted);font-weight:700;display:grid;place-items:center}
.pe{border:2px solid var(--c);background:var(--paper);background:color-mix(in srgb,var(--c) 14%,var(--paper));color:var(--ink);border-radius:8px;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;font:inherit;min-height:52px;cursor:default;min-width:0}
.pe small{font-size:.66rem;color:var(--muted);line-height:1;align-self:flex-start;padding-left:3px}.pe b{font:800 1.12rem var(--f-display);line-height:1.1}.pe i{font-style:normal;font-size:.6rem;color:var(--muted);line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pe.empty{border:1px dashed var(--line);background:transparent}
#tb .pe:not(.empty){cursor:pointer}.pe.okk{background:var(--ok-soft);border-color:var(--ok);outline:3px solid var(--ok)}.pe.ko{background:var(--marker-soft);border-color:var(--marker)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.25}.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}.frac>span:last-child{padding:0 4px}
.frac.fx{color:var(--lit);font-weight:700}
.calc .row{font-size:1.08rem;display:flex;align-items:center;flex-wrap:wrap;gap:4px 2px;line-height:1.3}.calc s{text-decoration-color:var(--marker);text-decoration-thickness:2px}
.fopt{text-align:center;font-size:1.05rem}
.fields{display:flex;flex-direction:column;gap:8px}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.numrow .lab{min-width:6.5em;font-weight:700}
.numrow input{font:400 1.15rem var(--f-body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:9px 12px;width:8em;max-width:100%;font-variant-numeric:tabular-nums}
.numrow .unit{font-weight:700;color:var(--muted)}.numrow input.ok{border-color:var(--ok);background:var(--ok-soft)}.numrow input.ko{border-color:var(--marker);background:var(--marker-soft)}
.nota{display:inline-flex;align-items:center;gap:2px;font:800 1.6rem var(--f-display);vertical-align:middle}.nota .na{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.55em;line-height:1.05}.nota sup{color:var(--marker)}.nota sub{color:#1e6fd9}.nota sup,.nota sub{vertical-align:baseline;font-size:1em}
.atomview svg{width:100%;max-width:360px;display:block;margin:0 auto;border-radius:12px}
.ctr{display:flex;flex-direction:column;gap:8px}.cnt{display:grid;grid-template-columns:28px 1fr 44px 40px 44px;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.dotc{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}.cnt output{font:800 1.2rem var(--f-display);text-align:center;font-variant-numeric:tabular-nums}
.ghost.sm{padding:6px 0;font-size:1.2rem;line-height:1}
.mt.sym{font:800 1.15rem var(--f-display);text-align:center}
/* Progreso */
.progress{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:16px}.progress h2{font-size:1.15rem;margin:0 0 10px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:.85rem;font-weight:700;color:var(--muted)}.badge.got{color:var(--ink);border-color:var(--star)}.badge svg{width:22px;height:22px}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.9rem;color:var(--muted)}
.rbtn{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;font:700 .9rem var(--f-body);padding:7px 12px;cursor:pointer;margin-left:6px}
.rbtn:disabled{opacity:.45;cursor:default}.rbtn.danger{background:var(--marker);border-color:var(--marker);color:var(--paper)}
.rconf{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px;color:var(--ink);font-weight:700}
.qlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}.qlist li{display:flex;gap:10px;align-items:baseline}.qlist b{font-family:var(--f-hand);font-size:1.5rem;width:1.2em;flex:none}
svg text{font-family:var(--f-body)}
@media (max-width:460px){header h1{font-size:1.65rem}.opts.grid,.opts.three{grid-template-columns:1fr}.stamp{font-size:2.8rem}.match{gap:6px}.mt{font-size:.88rem;padding:8px}}
body{margin:0}[hidden]{display:none!important}
/* Hidruros */
.fml{font:800 2.1rem var(--f-display);text-align:center;margin:0;min-height:1.3em;letter-spacing:.02em}
.brow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.brow .lab{font-weight:700;min-width:7.5em}
.chipb{border:2px solid var(--line);background:var(--paper);color:var(--ink);font:800 1.25rem var(--f-display);padding:8px 14px;border-radius:10px;cursor:pointer;min-width:56px}
.chipb:hover:not(:disabled){border-color:var(--muted)}.chipb[aria-pressed="true"]{border-color:var(--lit);background:var(--grid);outline:2px solid var(--lit)}
.chipb.right{border-color:var(--ok);background:var(--ok-soft)}.chipb.wrong{border-color:var(--marker);background:var(--marker-soft)}.chipb:disabled{cursor:default}
.chipb.shake{border-color:var(--marker);animation:shake .35s}
.anat .row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:1.12rem;margin:6px 0}
.seg{background:var(--chip);background:color-mix(in srgb,var(--c) 16%,var(--chip));border-bottom:3px solid var(--c);border-radius:6px;padding:2px 7px;font-weight:700}
.pe small.v{color:var(--marker);font-weight:800;font-size:.72rem}
.pt.nmg{grid-template-columns:repeat(5,minmax(0,1fr));max-width:330px}
.demo{display:flex;flex-direction:column;gap:10px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.dchips button{font-weight:700}
.dfig svg,.cfig svg{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:10px}
.dcap,.ccap{margin:0;text-align:center;font-weight:700;min-height:1.5em}
.gtag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.85rem;color:#fff;background:var(--c);margin-left:6px;vertical-align:1px}
.nrows{display:flex;flex-direction:column;gap:8px}
.nrow{display:grid;grid-template-columns:9.5em 1fr;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:8px 12px}
.nk{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.nv{font-weight:700;font-size:1.05rem}
mark{background:var(--marker-soft);color:var(--marker);border-radius:4px;padding:0 2px;font-weight:800}
@media (prefers-reduced-motion:no-preference){.pop{animation:popin .45s ease-out both;animation-delay:var(--d,0s)}.hin{animation:hin .6s cubic-bezier(.3,1.45,.6,1) both;animation-delay:var(--d,0s)}}
@keyframes popin{from{opacity:0;transform:translateY(8px)}}
@keyframes hin{from{opacity:0;transform:translate(var(--dx),var(--dy))}}
@media (max-width:460px){.nrow{grid-template-columns:1fr;gap:2px}.chipb{min-width:48px;padding:8px 10px}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../../#ale/fisica-quimica">← Física y Química de Ale</a>
  <header>
    <div><h1>Los hidruros <span>Ale</span></h1>
    <p>Tema 3 · Formulación: los tres grupos de hidruros, el intercambio de valencias y los tres nombres, con ejemplos que se mueven y juegos.</p></div>
    <div class="score" id="score" aria-label="Estrellas"></div>
  </header>
  <div class="tabs" role="group" aria-label="Sección">
    <button id="tEst" aria-pressed="true">Estudiar</button>
    <button id="tJue" aria-pressed="false">Juegos</button>
    <button id="tPru" aria-pressed="false">Prueba</button>
  </div>
  <main id="main"></main>
  <section class="progress" id="progress"></section>
</div>

<script>
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STARP='<path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/>';
const star=(on,cls='')=>`<svg viewBox="0 0 24 24" class="${on?'st-on':'st-off'} ${cls}" aria-hidden="true">${STARP}</svg>`;
const C={mo:'#6a2fa0',ro:'#c0127e',az:'#1e6fd9',ve:'#2f9e5c',na:'#d9822b',gr:'#5d5a7a',li:'#0b7a75',rj:'#d43c3c'};
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,RM?0:ms));

/* =================== QUÍMICA ===================
   [símbolo, nombre, valencias, grupo de la tabla, periodo, familia, nombre especial]
   Metales: los de la tabla de clase que forman hidruro (fuera Fr, Ra y Tl). No metales: B, C, N (grupo 2 de hidruros) y O, F (grupo 3). */
const EL=[['Li','Litio',[1],1,2,'g1'],['Na','Sodio',[1],1,3,'g1'],['K','Potasio',[1],1,4,'g1'],['Rb','Rubidio',[1],1,5,'g1'],['Cs','Cesio',[1],1,6,'g1'],
 ['Be','Berilio',[2],2,2,'g2'],['Mg','Magnesio',[2],2,3,'g2'],['Ca','Calcio',[2],2,4,'g2'],['Sr','Estroncio',[2],2,5,'g2'],['Ba','Bario',[2],2,6,'g2'],
 ['Fe','Hierro',[2,3],8,4,'fe'],['Co','Cobalto',[2,3],9,4,'fe'],['Ni','Níquel',[2,3],10,4,'fe'],
 ['Al','Aluminio',[3],13,3,'g13'],['Ga','Galio',[3],13,4,'g13'],['In','Indio',[3],13,5,'g13']];
const NM=[['B','Boro',[3],13,2,'h2','borano'],['C','Carbono',[4],14,2,'h2','metano'],['N','Nitrógeno',[3],15,2,'h2','amoniaco'],['O','Oxígeno',[2],16,2,'h3','agua'],['F','Flúor',[1],17,2,'h3','fluoruro de hidrógeno']];
const FAM={g1:['Grupo 1 de la tabla · valencia 1','#1e6fd9'],g2:['Grupo 2 de la tabla · valencia 2','#b3264f'],fe:['Fe, Co y Ni · valencias 2 y 3','#6a2fa0'],g13:['Grupo 13 de la tabla · valencia 3','#2f9e5c'],h2:['B, C, N','#d9822b'],h3:['O, F','#d43c3c']};
const HG={1:['Grupo 1','metal + H','#0b7a75'],2:['Grupo 2','B, C, N','#d9822b'],3:['Grupo 3','O, F','#d43c3c']};
const SUB={1:'',2:'₂',3:'₃',4:'₄'},SUBV={1:'₁',2:'₂',3:'₃',4:'₄'},ROM={1:'I',2:'II',3:'III'},PRE={1:'',2:'di',3:'tri',4:'tetra'};
const ALLEL=[...EL,...NM];
const elOf=s=>ALLEL.find(e=>e[0]===s);
const low=e=>e[1].toLowerCase();
const cap=s=>s[0].toUpperCase()+s.slice(1);
const lf=s=>s[0].toLowerCase()+s.slice(1);
const vtxt=e=>e[2].join(' y ');
const hgOf=e=>e[5]==='h2'?2:e[5]==='h3'?3:1;
const fml=(sym,n)=>sym+'H'+SUB[n];
const estN=(e,v)=>cap(PRE[v]+'hidruro de '+low(e));
const oxiN=(e,v)=>cap('hidruro de '+low(e)+(e[2].length>1?'('+ROM[v]+')':''));
const carN=(e,v)=>cap('hidruro de '+low(e)+(e[2].length>1?'('+v+'+)':''));
const COMP=[];EL.forEach(e=>e[2].forEach(v=>COMP.push({e,v,g:1,f:fml(e[0],v),est:estN(e,v),oxi:oxiN(e,v),car:carN(e,v)})));
const HNM=NM.map(e=>{const v=e[2][0],g=hgOf(e);return{e,v,g,f:g===3?'H'+SUB[v]+e[0]:fml(e[0],v),esp:cap(e[6])}});
const ALLH=[...COMP,...HNM];
const NOMS={est:['Estequiométrica',C.ro],oxi:['Nº de oxidación',C.az],car:['Nº de carga',C.ve]};
const namesOf=c=>c.g===1?[...new Set([c.est,c.oxi,c.car])]:[c.esp];
const nameLine=c=>namesOf(c).join(' · ');
const compOf=(s,v)=>ALLH.find(c=>c.e[0]===s&&(v==null||c.v===v));
/* Datos del intercambio de valencias: el primer símbolo es el elemento, salvo en el grupo 3 (H delante) */
const crossOf=c=>c.g===3?{A:'H',va:1,B:c.e[0],vb:c.v,f:c.f}:{A:c.e[0],va:c.v,B:'H',vb:1,f:c.f};

/* =================== DIBUJOS =================== */
const T=(x,y,t,o='')=>`<text x="${x}" y="${y}" text-anchor="middle" ${o}>${t}</text>`;
const ANG={1:[0],2:[-40,40],3:[-60,0,60],4:[-90,-30,30,90]};
/* Átomo con tantas «manos» como valencia (v) y nH hidrógenos. hooks:false oculta las manos (juego); anim:true hace que los H lleguen volando. */
function molG(cx,cy,sym,v,nH,col,o={}){const s=o.s||1,R=30*s,L=52*s,D=68*s,rh=15*s;let g='';
 const pos=(a,d)=>[cx+d*Math.cos(a*Math.PI/180),cy+d*Math.sin(a*Math.PI/180)];
 const angs=n=>n<=4?(ANG[n]||[]):Array.from({length:n},(_,i)=>-90+i*360/n);
 const H=(x,y,bad)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rh}" fill="#ffffff" stroke="${bad?'#c0127e':'#5d6b7a'}" stroke-width="${bad?2.5:1.5}"/>${T(x.toFixed(1),(y+5*s).toFixed(1),'H',`font-size="${14*s}" font-weight="800" fill="#1f2d3a"`)}`;
 const wrap=(a,i,inner)=>o.anim?`<g class="hin" style="--dx:${(Math.cos(a*Math.PI/180)*60).toFixed(0)}px;--dy:${(Math.sin(a*Math.PI/180)*60).toFixed(0)}px;--d:${(.35+i*.3).toFixed(2)}s">${inner}</g>`:inner;
 if(o.hooks===false)angs(nH).forEach(a=>{const[x,y]=pos(a,D);g+=H(x,y)});
 else{ANG[v].forEach((a,i)=>{const[x1,y1]=pos(a,R),[x2,y2]=pos(a,L);const full=i<nH;
   if(full){const[x,y]=pos(a,D);g+=wrap(a,i,`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="#1f2d3a" stroke-width="${3*s}"/>`+H(x,y))}
   else g+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="#c0127e" stroke-width="${3*s}" stroke-dasharray="${4*s} ${3*s}"/><circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="${4*s}" fill="#eef7f6" stroke="#c0127e" stroke-width="2"/>`});
  const extra=Math.max(0,nH-v);for(let i=0;i<extra;i++)g+=H(cx-(extra-1)*18*s+i*36*s,cy+(o.ey||100)*s,true)}
 g+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${col}" stroke="#1f2d3a" stroke-width="1.5"/>${T(cx,cy+7*s,sym,`font-size="${20*s}" font-weight="800" fill="#fff"`)}`;
 return g}
const Hsolo=(x,y)=>`<circle cx="${x}" cy="${y}" r="15" fill="#fff" stroke="#5d6b7a" stroke-width="1.5"/>${T(x,y+5,'H','font-size="14" font-weight="800" fill="#1f2d3a"')}`;
const colOf=e=>FAM[e[5]][1];
const DR={
manos:()=>({vb:'0 0 380 230',s:`<rect width="380" height="230" fill="#eef7f6"/>
 ${molG(55,60,'Na',1,0,FAM.g1[1])}${T(55,110,'1 mano','font-size="12" font-weight="700" fill="#5d6b7a"')}
 ${T(128,66,'+','font-size="22" font-weight="800" fill="#1f2d3a"')}${Hsolo(158,60)}${T(200,67,'→','font-size="24" font-weight="800" fill="#0b7a75"')}
 ${molG(245,60,'Na',1,1,FAM.g1[1])}${T(352,67,'NaH','font-size="19" font-weight="800" fill="#c0127e"')}
 ${molG(55,160,'Ca',2,0,FAM.g2[1])}${T(55,214,'2 manos','font-size="12" font-weight="700" fill="#5d6b7a"')}
 ${T(128,166,'+','font-size="22" font-weight="800" fill="#1f2d3a"')}${Hsolo(158,143)}${Hsolo(158,178)}${T(200,167,'→','font-size="24" font-weight="800" fill="#0b7a75"')}
 ${molG(245,160,'Ca',2,2,FAM.g2[1])}${T(352,167,'CaH₂','font-size="19" font-weight="800" fill="#c0127e"')}`}),
};
function svgOf(key,label){const d=DR[key]();return`<figure class="ill"><svg viewBox="${d.vb}" role="img" aria-label="${esc(label)}">${d.s}</svg><figcaption>${label}</figcaption></figure>`}
function valTable(){const cols=[1,2,8,9,10,13];let h='<div class="pt" role="group" aria-label="Las valencias de los metales">';
 h+=`<div class="pth"></div>${cols.map(c=>`<div class="pth">${c}</div>`).join('')}`;
 for(let p=2;p<=6;p++){h+=`<div class="pth">${p}</div>`;cols.forEach(c=>{const e=EL.find(x=>x[3]===c&&x[4]===p);
  if(!e){h+='<div class="pe empty"></div>';return}
  h+=`<div class="pe" style="--c:${colOf(e)}"><small class="v">${e[2].join('·')}</small><b>${e[0]}</b><i>${e[1]}</i></div>`})}
 h+='</div><div class="pt nmg" role="group" aria-label="Las valencias de los no metales">'+NM.map(e=>`<div class="pe" style="--c:${colOf(e)}"><small class="v">${e[2][0]}</small><b>${e[0]}</b><i>${e[1]}</i></div>`).join('')+'</div>';
 return h}
const FIG_VAL=()=>`<figure class="ill" style="width:100%">${valTable()}<figcaption>Arriba, los metales en su sitio de la tabla; abajo, los no metales. El número rosa es la valencia.</figcaption></figure>`;

/* ---------- Animación: intercambio de valencias ---------- */
function crossSVG(o,hideA,hideB){const w=s=>s.length>1?58:32,xa=100,xb=205,y=112;
 const ta=[xb+w(o.B)/2+14,134],tb=[xa+w(o.A)/2+14,134];
 return{xa,xb,ta,tb,svg:`<svg viewBox="0 0 320 185" role="img" aria-label="Intercambio de valencias de ${o.A} y ${o.B}"><rect width="320" height="185" fill="#eef7f6"/>
 ${T(xa,y,o.A,'font-size="50" font-weight="800" fill="#1f2d3a"')}${T(xb,y,o.B,'font-size="50" font-weight="800" fill="#1f2d3a"')}
 <line class="xl" pathLength="1" x1="${xa}" y1="56" x2="${ta[0]}" y2="${ta[1]-18}" stroke="#c0127e" stroke-width="2.5" stroke-dasharray="1" stroke-dashoffset="1" stroke-linecap="round"/>
 <line class="xl" pathLength="1" x1="${xb}" y1="56" x2="${tb[0]}" y2="${tb[1]-18}" stroke="#1e6fd9" stroke-width="2.5" stroke-dasharray="1" stroke-dashoffset="1" stroke-linecap="round"/>
 <g class="cv" transform="translate(${xa},46)"><text text-anchor="middle" font-size="30" font-weight="800" fill="#c0127e">${hideA?'?':o.va}</text></g>
 <g class="cv" transform="translate(${xb},46)"><text text-anchor="middle" font-size="30" font-weight="800" fill="#1e6fd9">${hideB?'?':o.vb}</text></g>
 <text class="cres" x="160" y="176" text-anchor="middle" font-size="22" font-weight="800" fill="#0b7a75" opacity="0"></text></svg>`}}
function tween(el,[x0,y0,s0],[x1,y1,s1],ms){const set=p=>el.setAttribute('transform',`translate(${(x0+(x1-x0)*p).toFixed(1)},${(y0+(y1-y0)*p).toFixed(1)}) scale(${(s0+(s1-s0)*p).toFixed(3)})`);
 return new Promise(res=>{if(RM||!ms){set(1);return res()}const t0=performance.now();const f=now=>{let p=Math.min(1,(now-t0)/ms);p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;set(p);if(p<1)requestAnimationFrame(f);else res()};requestAnimationFrame(f)})}
const fade=(el,a,b,ms)=>el.animate([{opacity:a},{opacity:b}],{duration:RM?0:ms,fill:'forwards'});
/* Pinta y anima el intercambio en box (.cfig + .ccap). Devuelve false si se interrumpió. */
async function runCross(box,o,opt={}){const tok=(box._t=(box._t||0)+1);const alive=()=>box._t===tok&&box.isConnected;
 const G=crossSVG(o);box.querySelector('.cfig').innerHTML=G.svg;const cap=box.querySelector('.ccap');const say=t=>{cap.innerHTML=t};
 const q=s=>[...box.querySelectorAll(s)];
 if(!opt.skipIntro){say('1. Escribimos los símbolos y, encima, sus valencias.');await wait(1100);if(!alive())return false}
 say('2. Intercambiamos las valencias: cada una baja junto al otro símbolo.');
 q('.xl').forEach(l=>l.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:RM?0:700,fill:'forwards'}));await wait(800);if(!alive())return false;
 const [ga,gb]=q('.cv');await Promise.all([tween(ga,[G.xa,46,1],[G.ta[0]+7,G.ta[1],.72],1100),tween(gb,[G.xb,46,1],[G.tb[0]+7,G.tb[1],.72],1100)]);if(!alive())return false;
 q('.xl').forEach(l=>fade(l,1,.15,400));
 const ones=[];if(o.va===1)ones.push(ga);if(o.vb===1)ones.push(gb);
 say(`Queda <b>${o.A}${SUBV[o.vb]}${o.B}${SUBV[o.va]}</b>.`);await wait(900);if(!alive())return false;
 say('3. La valencia «1» no se pone.');ones.forEach(g=>{g.querySelector('text').setAttribute('fill','#8a94a3');fade(g,1,0,700)});await wait(900);if(!alive())return false;
 if(opt.stop)return true;
 const r=box.querySelector('.cres');r.textContent='= '+o.f;fade(r,0,1,400);say(`Resultado: <b>${o.f}</b>${o.name?' · '+o.name:''}`);return true}

/* ---------- Ejemplos interactivos dentro de las fichas ---------- */
const DEM={};let demN=0;
function demo(type,items,h,note=''){const id='dm'+(++demN);DEM[id]={type,items};
 return{k:'html',t:()=>`<section class="blk">${h?`<h3 class="bh">${h}</h3>`:''}${note?`<p class="note">${note}</p>`:''}<div class="demo" id="${id}"><div class="chips dchips" role="group" aria-label="Elige un ejemplo">${items.map((it,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===0}">${it.lab}</button>`).join('')}</div><div class="${type==='cross'?'cfig':'dfig'}"></div><p class="${type==='cross'?'ccap':'dcap'}" aria-live="polite"></p>${type==='cross'?'<div class="actions"><button type="button" class="ghost drep">Repetir</button></div>':''}</div></section>`}}
const DRUN={
 mol:(d,it)=>{const c=it.c,e=c.e,hg=HG[c.g];
  d.querySelector('.dfig').innerHTML=`<svg viewBox="0 0 300 220" role="img" aria-label="${esc(c.f)}: ${esc(e[1])} con ${c.v} hidrógenos"><rect width="300" height="220" fill="#eef7f6"/>${molG(120,105,e[0],c.v,c.v,colOf(e),{anim:true})}</svg>`;
  d.querySelector('.dcap').innerHTML=`<span class="fml pop" style="display:block;--d:${(.35+c.v*.3).toFixed(2)}s">${c.f}</span><span class="pop" style="display:block;--d:${(.55+c.v*.3).toFixed(2)}s">${esc(nameLine(c))}<span class="gtag" style="--c:${hg[2]}">${hg[0]}</span></span>`},
 cross:(d,it)=>runCross(d,Object.assign(crossOf(it.c),{name:nameLine(it.c)})),
 names:(d,it)=>{const c=it.c,L=low(c.e),m=c.e[2].length>1;
  const rows=[['est',c.v>1?`<mark>${PRE[c.v]}</mark>hidruro de ${L}`:`hidruro de ${L}`,c.v>1?`${PRE[c.v]} = ${c.v} hidrógenos`:'un solo H: sin prefijo'],
   ['oxi',m?`hidruro de ${L}<mark>(${ROM[c.v]})</mark>`:`hidruro de ${L}`,m?`valencia ${c.v} en número romano`:'una sola valencia: no se pone'],
   ['car',m?`hidruro de ${L}<mark>(${c.v}+)</mark>`:`hidruro de ${L}`,m?`carga ${c.v}+`:'una sola valencia: no se pone']];
  d.querySelector('.dfig').innerHTML=`<p class="fml pop">${c.f}</p><div class="nrows">${rows.map(([k,n,why],i)=>`<div class="nrow pop" style="--c:${NOMS[k][1]};--d:${(.25+i*.35).toFixed(2)}s"><span class="nk">${NOMS[k][0]}</span><span><span class="nv">${n}</span><br><small class="note">${why}</small></span></div>`).join('')}</div>`;
  d.querySelector('.dcap').innerHTML=m?`El ${L} tiene dos valencias (2 y 3): hay que decir cuál usa.`:c.v>1?`El ${L} solo tiene una valencia: solo cambia el estequiométrico.`:`El ${L} tiene valencia 1: los tres nombres son iguales.`}};
function wireDemos(root){root.querySelectorAll('.demo').forEach(d=>{const D=DEM[d.id];let cur=0;const run=()=>DRUN[D.type](d,D.items[cur]);
 d.querySelectorAll('.dchips button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;d.querySelectorAll('.dchips button').forEach(x=>x.setAttribute('aria-pressed',x===b));run()});
 const r=d.querySelector('.drep');if(r)r.onclick=run;run()})}
const it=(s,v,lab)=>{const c=compOf(s,v);return{c,lab:lab||c.f}};

/* =================== FICHAS =================== */
const ST=[
{id:'f1',t:1,n:'¿Qué es un hidruro?',s:'Hidrógeno + otro elemento de la tabla',
 idea:'Un <b>hidruro</b> es un compuesto formado por el <b>hidrógeno</b> y <b>otro elemento</b> de la tabla periódica. El agua (H₂O) y el metano (CH₄) también son hidruros.',
 fig:()=>svgOf('manos','Cada átomo tiene tantas «manos» como su valencia. El hidrógeno tiene una.'),
 b:[{k:'cards',h:'Las piezas',it:[['Hidrógeno (H)','Valencia <b>1</b>: tiene una sola «mano», así que solo se engancha a un átomo.',C.gr],['El otro elemento','Un <b>metal</b> (sodio, calcio, hierro…) o un <b>no metal</b> (carbono, nitrógeno, oxígeno…).',C.az],['La valencia','El número de uniones que puede hacer un átomo: sus «manos».',C.ro]]},
 demo('mol',[it('Na'),it('Ca'),it('Al'),it('Fe',3),it('C'),it('O')],'Míralo moverse','Toca un elemento y mira cómo se le enganchan los hidrógenos.'),
 {k:'ej',h:'¿Para qué sirven?',t:'El metano (CH₄) es casi todo el gas natural de las cocinas. El hidruro de magnesio (MgH₂) se estudia para <b>guardar hidrógeno</b> dentro de un sólido y usarlo como combustible.'}],
 truco:'Regla de oro: <b>no puede quedar ninguna mano libre</b>. Por eso el número de H depende de la valencia del otro elemento.'},
{id:'f2',t:1,n:'Las valencias que necesitas',s:'Metales de la tabla y B, C, N, O, F',

function weight(q){const s=S.q[q.id];if(!s)return 3;return Math.max(.4,1+2*(s.n-s.ok)-.6*s.ok)}
function wpick(list,n){const out=[],pool=[...list];while(out.length<n&&pool.length){let r=Math.random()*pool.reduce((a,q)=>a+weight(q),0);let k=0;for(;k<pool.length;k++){r-=weight(pool[k]);if(r<=0)break}out.push(pool.splice(Math.min(k,pool.length-1),1)[0])}return out}
function setBest(id,v,lower){const p=S.games[id];if(p==null||(lower?v<p:v>p)){S.games[id]=v;save();renderProgress();return true}return false}

 $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerQ(+b.dataset.i));window.scrollTo({top:0})}
function answerQ(i){if(V.ans)return;V.ans=true;const q=V.list[V.idx];const okIdx=q.t==='test'?V.opts.indexOf(q.ok):(q.ok?0:1);const ok=i===okIdx;

 V.res.push(ok);const s=S.q[q.id]||(S.q[q.id]={ok:0,n:0});s.n++;if(ok)s.ok++;save();const sp=$('#stamp');sp.hidden=false;sp.className='stamp '+(ok?'b':'mm');sp.textContent=ok?'B':'M';
 const last=V.idx===V.list.length-1;$('#after').innerHTML=`<p class="verdict ${ok?'b':'mm'}">${ok?pick(['¡Bien!','¡Exacto!','¡Muy bien!']):'No es correcto.'}</p><p class="exp">${q.exp}</p><div class="actions" style="margin-top:12px"><button class="primary" id="nx" type="button">${last?'Ver resultado':'Siguiente'}</button></div>`;

   if(b.dataset.s==='L'){$('#mt').querySelectorAll('.mt[data-s="L"]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;$('#fb').textContent='';return}
   if(!sel){$('#fb').className='fb ko';$('#fb').textContent='Primero toca una fórmula de la izquierda.';return}
   if(b.dataset.i===sel.dataset.i){[b,sel].forEach(x=>{x.classList.remove('sel');x.classList.add('done');x.disabled=true});sel=null;left--;$('#fb').className='fb okk';$('#fb').textContent='¡Pareja!';if(!left){round++;setTimeout(play,800)}}
   else{err++;$('#hud').textContent='Errores: '+err;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);$('#fb').className='fb ko';$('#fb').textContent='Esa no es su pareja.'}})};play()}

/* 6. Contra reloj */
const VOPT=['1','2','3','4','2 y 3'];
const DECKS={
val:{n:'Valencias',c:VOPT,gen:()=>{const e=pick(ALLEL);return[`${e[1]} (${e[0]})`,VOPT.indexOf(vtxt(e))]}},
gru:{n:'¿Qué grupo?',c:['Grupo 1','Grupo 2','Grupo 3'],gen:()=>{const c=Math.random()<.5?pick(COMP):pick(HNM);return[c.f,c.g-1]}},
nom:{n:'¿Qué nomenclatura?',c:['Estequiométrica','Nº de oxidación','Nº de carga'],gen:()=>{const md=pick(['est','oxi','car']);const c=md==='est'?pick(COMP.filter(x=>x.v>1)):pick(COMP.filter(x=>x.e[2].length>1));return[lf(c[md]),['est','oxi','car'].indexOf(md)]}},
bm:{n:'¿Bien o mal?',c:['Bien','Mal'],gen:()=>{if(Math.random()<.3){const c=pick(HNM),nm=lf(c.esp);if(Math.random()<.5)return[`${c.f} = ${nm}`,0];
   const wrong=c.g===3?c.e[0]+'H'+SUB[c.v]:'H'+SUB[c.v]+c.e[0];return[`${wrong} = ${nm}`,1]}
  const c=pick(COMP),nm=lf(pick(namesOf(c)));if(Math.random()<.5)return[`${c.f} = ${nm}`,0];
  if(Math.random()<.25)return[`H${SUB[c.v]}${c.e[0]} = ${nm}`,1];const kk=pick([1,2,3].filter(x=>x!==c.v));return[`${fml(c.e[0],kk)} = ${nm}`,1]}}};
function gCla(){let dk='val';
 const setup=()=>{const D=DECKS[dk];let pts=0,streak=0,left=60,cur=null,miss=[],last='';
  $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Contra reloj</span><span>60 segundos</span></div>
  <div class="chips" id="decks">${Object.entries(DECKS).map(([k2,d])=>`<button type="button" data-d="${k2}" aria-pressed="${k2===dk}">${d.n}</button>`).join('')}</div>
  <div class="hud"><span id="pts">0 puntos</span><span id="stk"></span><span id="sec">60 s</span></div><div class="timer"><i id="bar" style="width:100%"></i></div>
  <p class="bigq" id="item">Pulsa «Empezar»</p><div class="opts ${D.c.length===3?'three':D.c.length===2?'two':'grid'}" id="opts" hidden>${D.c.map((c,i)=>`<button class="opt" type="button" data-i="${i}" style="text-align:center;font-weight:700">${c}</button>`).join('')}</div>
  <div id="gend"><div class="actions"><button class="primary" id="start" type="button">Empezar</button>${backB()}</div></div></div>`;wireBack();
  $('#decks').querySelectorAll('button').forEach(b=>b.onclick=()=>{stopTimers();dk=b.dataset.d;setup()});
  const next=()=>{let x,g=0;do{x=D.gen();g++}while(x[0]===last&&g<10);last=x[0];cur=x;$('#item').textContent=cur[0]};
  $('#start').onclick=()=>{$('#opts').hidden=false;$('#gend').innerHTML='';next();st.timer=setInterval(()=>{left--;$('#sec').textContent=left+' s';$('#bar').style.width=(left/60*100)+'%';if(left<=0){stopTimers();end()}},1000)};
  $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!cur||left<=0)return;const ok=+b.dataset.i===cur[1];const el=$('#item');el.classList.remove('flash-ok','flash-ko');void el.offsetWidth;if(ok){streak++;pts+=streak>=5?2:1}else{streak=0;miss.push(cur)}el.classList.add(ok?'flash-ok':'flash-ko');$('#pts').textContent=pts+' puntos';$('#stk').textContent=streak>=5?'¡Racha ×2!':streak>=2?'Racha '+streak:'';next()});
  function end(){$('#opts').hidden=true;$('#item').textContent='¡Tiempo!';const better=setBest('cla',pts,false);const u=[...new Map(miss.map(m=>[m[0],m])).values()];endG(`${pts} puntos`,`${better?'¡Nueva mejor marca! ':''}${u.length?'Para repasar: '+u.slice(0,6).map(m=>`<b>${esc(m[0])}</b> → ${D.c[m[1]]}`).join('; ')+'.':'¡Sin fallos!'} Con 5 aciertos seguidos, cada uno vale doble.`,setup)}};setup()}

/* =================== PROGRESO =================== */
const BADGES=[['Primera estrella',()=>totalStars()>=1],['Experta en hidruros',()=>CORE.every(id=>S.stars[id]===3)],['Intercambiadora',()=>(S.games.cru||0)>=5],['Ninguna mano libre',()=>(S.games.eng||0)>=5],['Formuladora',()=>(S.games.for||0)>=7],['Tres nombres',()=>(S.games.nom||0)>=8],['Parejas perfectas',()=>S.games.par!=null&&S.games.par<=1],['Rápida como el hidrógeno',()=>(S.games.cla||0)>=25],['Sobresaliente',()=>(S.games.prueba||0)>=9]];
function renderProgress(){const any=totalStars()||Object.keys(S.games).length||Object.keys(S.q).length;
 $('#progress').innerHTML=`<h2>Medallas</h2><div class="badges">${BADGES.map(([n,f])=>{const g=f();return`<span class="badge ${g?'got':''}">${star(g)}${n}</span>`}).join('')}</div>
 <div class="pfoot"><span>${any?'Las medallas se ganan con las estrellas, los juegos y la prueba.':'Todavía no has empezado en este dispositivo.'}</span>${st.confirm?`<span class="rconf">¿Seguro? <button class="rbtn danger" id="rYes" type="button">Sí, borrar</button><button class="rbtn" id="rNo" type="button">Cancelar</button></span>`:`<button class="rbtn" id="rst" type="button"${any?'':' disabled'}>Borrar progreso</button>`}</div>`;
 if($('#rst'))$('#rst').onclick=()=>{st.confirm=true;renderProgress()};if($('#rNo'))$('#rNo').onclick=()=>{st.confirm=false;renderProgress()};
 if($('#rYes'))$('#rYes').onclick=()=>{S={stars:{},q:{},games:{}};save();st.confirm=false;renderProgress();renderScore();setTab(st.tab)}}
function setTab(t){stopTimers();st.tab=t;[['tEst','est'],['tJue','jue'],['tPru','pru']].forEach(([id,k])=>$('#'+id).setAttribute('aria-pressed',k===t));({est:renderEst,jue:renderJue,pru:renderPru})[t]();window.scrollTo({top:0})}
$('#tEst').onclick=()=>setTab('est');$('#tJue').onclick=()=>setTab('jue');$('#tPru').onclick=()=>setTab('pru');
renderScore();renderProgress();setTab('est');
</script>
