<!doctype html>
<html lang="es">
<head>

<title>Primeras civilizaciones</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
:root{
  --bg:#f1ebe2; --paper:#fdfbf7; --grid:#e6dccd; --ink:#2a1d12; --muted:#76624f; --line:#dccfbd;

  --star:#d9a400; --geo:#9a5a1a;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15100b; --paper:#1f1812; --grid:#2c231a; --ink:#f0e6da; --muted:#b9a690; --line:#3a2f24;
  --marker:#e0645a; --marker-soft:#3d1a16; --ok:#4fc68c; --ok-soft:#17332a; --btn:#f0e6da; --btn-fg:#15100b; --chip:#261d15;
  --star:#ffd23f; --geo:#e0a060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15100b; --paper:#1f1812; --grid:#2c231a; --ink:#f0e6da; --muted:#b9a690; --line:#3a2f24;
  --marker:#e0645a; --marker-soft:#3d1a16; --ok:#4fc68c; --ok-soft:#17332a; --btn:#f0e6da; --btn-fg:#15100b; --chip:#261d15;
  --star:#ffd23f; --geo:#e0a060; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.back{font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:700}
.nav-links{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.link-app{font-size:.88rem;color:var(--geo);text-decoration:none;font-weight:700;border:1.5px solid var(--line);background:var(--chip);padding:4px 10px;border-radius:8px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.1;margin:0;letter-spacing:-.01em}
header h1 span{color:var(--marker);font-family:var(--f-hand);font-size:1.15em;margin-left:.15em}
header p{margin:.35em 0 0;color:var(--muted);max-width:56ch}
.score{display:flex;align-items:center;gap:6px;font:800 1.4rem var(--f-display);font-variant-numeric:tabular-nums}.score svg{width:28px;height:28px}
.tabs{display:flex;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 .95rem var(--f-body);padding:10px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:400 .9rem var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--geo);color:var(--paper);border-color:var(--geo)}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.sheet{position:relative;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:6px;padding:20px 18px 22px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(30,20,10,.45);display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-right:56px}
h2{font:800 1.35rem var(--f-display);margin:0;text-wrap:balance}
h3{font:800 1.05rem var(--f-display);margin:0}
.primary{background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;font:700 1rem var(--f-body);padding:12px 20px;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:700 1rem var(--f-body);padding:11px 16px;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:.9rem;color:var(--muted);margin:0}
.theme-head{display:flex;align-items:baseline;gap:10px;margin:6px 0 -4px;flex-wrap:wrap}.theme-head h2{font-size:1.2rem;color:var(--geo)}.theme-head span{font-size:.85rem;color:var(--muted);font-weight:700}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.path li{position:relative;padding-left:58px;padding-block:6px}
.path li::before{content:"";position:absolute;left:21px;top:0;bottom:0;border-left:3px dotted var(--line)}
.path li:first-child::before{top:50%}.path li:last-child::before{bottom:50%}
.stop{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.stop:hover{border-color:var(--muted)}.stop b{font:800 1.05rem var(--f-display);display:block}.stop small{color:var(--muted);font-size:.88rem;display:block}
.dot{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 .95rem var(--f-display);background:var(--paper);border:3px solid var(--geo);color:var(--geo)}
.dot.done{background:var(--geo);color:var(--paper)}
.stars{display:flex;gap:2px;flex:none}.stars svg{width:20px;height:20px}
.st-on{fill:var(--star)}.st-off{fill:none;stroke:var(--line);stroke-width:2}
.chuleta{border:2px solid var(--geo)}
.chuleta summary{cursor:pointer;font:800 1.15rem var(--f-display);color:var(--geo);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.chuleta summary::-webkit-details-marker{display:none}
.chuleta summary::after{content:"Abrir";font:700 .85rem var(--f-body);color:var(--muted);border:1.5px solid var(--line);border-radius:8px;padding:3px 10px}
.chuleta[open] summary::after{content:"Cerrar"}
.chuleta[open] summary{margin-bottom:10px}
.idea{margin:0;background:var(--paper);border:2px solid var(--geo);border-radius:12px;padding:12px 14px;font-size:1.08rem;line-height:1.45}
.idea span{display:block;font:700 1.35rem var(--f-hand);color:var(--geo);line-height:1;margin-bottom:4px}
.blk{display:flex;flex-direction:column;gap:8px}
.bh{font:800 1rem var(--f-display);margin:2px 0 0}
.bxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.bx{background:var(--chip);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:3px;font-size:.96rem;line-height:1.42}
.bx>b{font:800 1.02rem var(--f-display)}.bx i{color:var(--muted)}
.nums{display:flex;flex-wrap:wrap;gap:8px}.num{flex:1 1 150px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}
.num b{font:800 1.5rem var(--f-display);color:var(--geo);font-variant-numeric:tabular-nums}.num span{font-size:.9rem;color:var(--muted)}
.ej{border:2px dashed var(--marker);border-radius:12px;padding:10px 14px;background:var(--marker-soft)}
.ejl{font:700 1.35rem var(--f-hand);color:var(--marker);line-height:1}.ej p{margin:4px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{background:var(--chip);border:1.5px solid var(--geo);border-radius:999px;padding:4px 12px;font-size:.92rem}
.truco{background:var(--marker-soft);border-radius:10px;padding:10px 12px;margin:0}.truco>b:first-child{font-family:var(--f-hand);font-size:1.4rem;color:var(--marker);margin-right:6px}
.ill{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.ill svg{width:100%;max-width:520px;height:auto;display:block;border-radius:12px}
.ill figcaption{font-size:.86rem;color:var(--muted);text-align:center}
.q{font-size:1.12rem;font-weight:700;margin:0;line-height:1.45}
.prompt{font:800 1.22rem var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.prompt small{display:block;font:400 .95rem var(--f-body);color:var(--muted);margin-top:2px}
.opts{display:flex;flex-direction:column;gap:8px}.opts.two{flex-direction:row}.opts.two .opt{flex:1;text-align:center;font-weight:700}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}.opts.three{display:grid;grid-template-columns:repeat(3,1fr)}.opts.three .opt{text-align:center;font-weight:700}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 1rem var(--f-body);padding:10px 14px;border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--muted)}.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}.opt.wrong{border-color:var(--marker);background:var(--marker-soft)}.opt:disabled{cursor:default}
.exp{border-top:2px solid var(--ink);padding-top:10px;margin:0}
.verdict{font-weight:700;margin:0}.verdict.b{color:var(--ok)}.verdict.mm{color:var(--marker)}
.stamp{position:absolute;top:10px;right:14px;font-family:var(--f-hand);font-size:3.4rem;line-height:1;transform:rotate(-8deg);pointer-events:none}.stamp.b{color:var(--ok)}.stamp.mm{color:var(--marker)}
.pbar{display:flex;gap:5px}.pbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}.pbar i.okk{background:var(--ok)}.pbar i.ko{background:var(--marker)}.pbar i.on{background:var(--ink)}
.bigstars{display:flex;gap:8px;justify-content:center}.bigstars svg{width:56px;height:56px}
@media (prefers-reduced-motion:no-preference){.bigstars svg.anim{animation:pop .45s ease-out both}.bigstars svg:nth-child(2){animation-delay:.15s}.bigstars svg:nth-child(3){animation-delay:.3s}}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}}
.grade{font-family:var(--f-hand);color:var(--marker);font-size:4.4rem;line-height:1;border:3px solid var(--marker);border-radius:50%;width:140px;height:110px;display:grid;place-items:center;transform:rotate(-6deg);margin:6px 0 10px}
.fb{min-height:1.5em;margin:0;font-weight:700}.fb.okk{color:var(--ok)}.fb.ko{color:var(--marker)}
.end{border-top:2px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:8px}.end p{margin:0}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.gcard:hover{border-color:var(--muted)}.gcard .ico{font:800 1.5rem var(--f-hand);color:var(--marker);line-height:1}
.gcard b{font:800 1.08rem var(--f-display)}.gcard small{color:var(--muted)}.gcard .best{font-size:.82rem;color:var(--ok);font-weight:700}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.timer{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}.timer i{display:block;height:100%;background:var(--marker);transition:width .2s linear}
.bigq{font:800 1.3rem var(--f-display);text-align:center;min-height:3.4em;display:grid;place-items:center;margin:0;text-wrap:balance;border-radius:10px;padding:4px}
.flash-ok{animation:fok .4s}.flash-ko{animation:fko .4s}@keyframes fok{from{background:var(--ok-soft)}}@keyframes fko{from{background:var(--marker-soft)}}
.pool{display:flex;flex-direction:column;gap:8px}
.ev{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 1rem var(--f-body);padding:10px 12px;border-radius:10px;cursor:pointer}
.ev.shake{border-color:var(--marker);animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.ladder li{background:var(--ok-soft);border-radius:8px;padding:6px 10px}.ladder li b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ok)}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.clues li{background:var(--chip);border:1px solid var(--line);border-left:5px solid var(--geo);border-radius:8px;padding:8px 12px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match .col{display:flex;flex-direction:column;gap:8px}
.mt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 .95rem var(--f-body);padding:9px 10px;border-radius:10px;cursor:pointer;min-height:48px}
.mt.shake{border-color:var(--marker);animation:shake .35s}
.mt.sel{border-color:var(--geo);background:var(--grid);font-weight:700}.mt.done{border-color:var(--ok);background:var(--ok-soft);cursor:default;opacity:.75}
.progress{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:16px}.progress h2{font-size:1.15rem;margin:0 0 10px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:.85rem;font-weight:700;color:var(--muted)}.badge.got{color:var(--ink);border-color:var(--star)}.badge svg{width:22px;height:22px}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.9rem;color:var(--muted)}
.rbtn{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;font:700 .9rem var(--f-body);padding:7px 12px;cursor:pointer;margin-left:6px}
.rbtn:disabled{opacity:.45;cursor:default}.rbtn.danger{background:var(--marker);border-color:var(--marker);color:var(--paper)}
.rconf{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px;color:var(--ink);font-weight:700}
.qlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}.qlist li{display:flex;gap:10px;align-items:baseline}.qlist b{font-family:var(--f-hand);font-size:1.5rem;width:1.2em;flex:none}
svg text{font-family:var(--f-body)}
@media (max-width:460px){header h1{font-size:1.65rem}.opts.grid,.opts.three{grid-template-columns:1fr}.stamp{font-size:2.8rem}.match{gap:6px}.mt{font-size:.88rem;padding:8px}}
[hidden]{display:none!important}
</style>

const ST=[
{id:'m1',t:1,n:'Ríos, regadío y primeras ciudades',s:'El Creciente Fértil, Mesopotamia y las ciudades-estado',
 idea:'Las primeras civilizaciones nacieron junto a <b>grandes ríos</b>. En <b>Mesopotamia</b> («tierra entre ríos»), entre el <b>Tigris</b> y el <b>Éufrates</b>, el riego dio <b>excedentes</b>, y con ellos nacieron las <b>primeras ciudades</b> en Sumer, en el <b>IV milenio a. C.</b>',
 fig:()=>svgOf('creciente','El Creciente Fértil, de Egipto a Mesopotamia'),
 b:[{k:'cards',h:'El lugar',it:[['Creciente Fértil','Franja de tierra desde el <b>Nilo</b> hasta el <b>Tigris</b>, el <b>Éufrates</b> y el golfo Pérsico. Agua dulce y cereales: la <b>cuna de la agricultura</b> y de la civilización mediterránea.',C.ve],['Mesopotamia','«<b>Tierra entre ríos</b>» (nombre griego). Hoy es Irak y partes de Siria, Turquía e Irán. Tierras <b>llanas y fértiles</b>.',C.az],['El problema','Las <b>crecidas</b> del Tigris y el Éufrates eran <b>violentas, irregulares e impredecibles</b>, en un clima semiárido.',C.ro]]},
 {k:'chips',h:'Ingeniería hidráulica',it:['Canales de irrigación: llevan el agua lejos de la orilla','Diques y presas: frenan las crecidas y guardan agua','Drenajes: sacan el agua sobrante (y evitan la sal)']},
 {k:'cards',h:'La revolución urbana',it:[['Excedentes','Con el riego se producía <b>más comida</b> de la que necesitaban los campesinos.',C.na],['Especialización','Ya no todos trabajaban la tierra: <b>artesanos, comerciantes, sacerdotes, soldados y burócratas</b>. Creció el <b>comercio</b>.',C.na],['Ciudades-estado','Primeras ciudades en <b>Sumer</b>: <b>Ur, Uruk, Lagash, Umma, Eridu, Nippur</b>. Cada una independiente, con su gobierno, ejército, leyes y dios. Luchaban por el agua y las tierras.',C.mo],['Cómo era una ciudad','<b>Muralla</b> de adobe; dentro, el <b>templo (zigurat)</b>, el palacio y los talleres; fuera, los <b>campos</b> y las casas de los campesinos.',C.mo]]}],
 truco:'La cadena del tema: <b>río → riego → excedentes → oficios y comercio → ciudades</b>. Si te preguntan por qué nacieron las ciudades, cuenta la cadena en orden.'},
{id:'m2',t:1,n:'Los pueblos de Mesopotamia',s:'Sumer, Acad, Babilonia, Asiria y Persia, y sus reyes',
 idea:'Durante 3000 años se sucedieron en Mesopotamia <b>cinco pueblos</b>: <b>sumerios, acadios, babilonios, asirios y persas</b>. Recuerda cada uno por su rey: <b>Sargón I</b>, <b>Hammurabi</b>, <b>Assurbanipal</b> y <b>Ciro II</b>.',
 fig:()=>svgOf('linea','Línea del tiempo de Mesopotamia'),
 b:[{k:'cards',h:'Los cinco pueblos',it:[['Sumer (3500-2334 a. C.)','La <b>primera civilización</b>: escritura y primeras ciudades (Ur, Uruk, Lagash, Umma, Nippur). Bases de la astronomía, las matemáticas y el urbanismo.',C.ma],['Acad (2334-2193 a. C.)','Hacia el 2300 a. C. el rey <b>Sargón I</b> acabó con la supremacía de las ciudades sumerias y <b>unificó Mesopotamia</b>.',C.gr],['Babilonia (1894-1595 a. C.)','El rey <b>Hammurabi</b> creó un gran imperio y el <b>Código de Hammurabi</b>, uno de los conjuntos de leyes más antiguos.',C.az],['Asiria (1365-611 a. C.)','Dominaron Mesopotamia, Armenia y el norte de Siria y llegaron hasta Egipto. Esplendor con <b>Assurbanipal</b>. <b>Caldeos</b> y <b>persas</b> acabaron con su imperio.',C.ro],['Persia (553-330 a. C.)','<b>Ciro II el Grande</b> conquistó Babilonia en el <b>539 a. C.</b>: Mesopotamia pasó a ser una <b>satrapía</b> (provincia) del Imperio persa.',C.ve]]},
 {k:'cards',h:'Personajes',it:[['Hammurabi','Rey de Babilonia (1792-1750 a. C.). Su código (h. 1754 a. C.) está en acadio y en cuneiforme, en una estela del <b>Louvre</b>: el dios <b>Shamash</b> le da el poder. Ley del <b>Talión</b>: «ojo por ojo, diente por diente».',C.az],['Nabucodonosor II','Rey del <b>Imperio neobabilónico</b>. Reconstruyó Babilonia con el zigurat de <b>Etemenanki</b>; la leyenda le atribuye los <b>Jardines Colgantes</b> para su esposa Amyitis. Reinó más de 40 años. Verdi le dedicó la ópera <i>Nabucco</i>.',C.az],['Ciro II el Grande','Fundó el <b>Imperio persa (aqueménida)</b>. Dejó volver a más de 40 000 hebreos a Palestina, puso <b>sátrapas</b> en cada provincia y creó el <b>primer correo imperial</b>. Castigó al río Gyndes dividiéndolo en 360 canales.',C.ve],['Jerjes I','Rey persa durante dos décadas, hijo de Darío I. En la II Guerra Médica venció a Leónidas en las <b>Termópilas</b>, pero los griegos lo derrotaron en <b>Salamina</b> y Platea. Murió asesinado.',C.ve]]}],
 truco:'Orden de los pueblos: «<b>Su-A-Ba-A-Pe</b>» → <b>Su</b>merios, <b>A</b>cadios, <b>Ba</b>bilonios, <b>A</b>sirios, <b>Pe</b>rsas.'},
{id:'m3',t:1,n:'Sociedad, escritura, dioses y arte',s:'Del rey al esclavo, la cuneiforme y el zigurat',
 idea:'Una sociedad muy <b>desigual</b> (del rey a los esclavos) que inventó la <b>escritura cuneiforme</b>, adoraba a muchos dioses y construía con <b>ladrillo</b>: zigurats, arcos y bóvedas.',
 fig:()=>svgOf('zigurat','El zigurat y el arco'),
 b:[{k:'cards',h:'La pirámide social',it:[['1. Rey','Poder político, militar y judicial ilimitado. Gobernaba como representante de los dioses (no era un dios).',C.na],['2. Sacerdotes y aristocracia','Dirigían el culto, guardaban el grano de los templos, controlaban el comercio y cobraban tributos.',C.mo],['3. Escribas y burócratas','Dominaban la escritura y el cálculo.',C.ma],['4. Pueblo llano','Campesinos, pastores, artesanos y comerciantes: la gran mayoría. Pagaban impuestos.',C.gr],['5. Esclavos','Prisioneros de guerra o deudores, sin derechos: canteras, obras públicas y servicio doméstico.',C.ro]]},
 {k:'ej',h:'La escritura',t:'Nació para <b>llevar las cuentas</b> del templo y del palacio (grano, ganado, impuestos). Primero fue <b>pictográfica</b> (dibujos, finales del IV milenio a. C.); hacia el <b>3500 a. C.</b>, los escribas sumerios crearon la <b>cuneiforme</b>: signos en forma de <b>cuña</b> hechos con un <b>cálamo</b> sobre <b>tablillas de arcilla</b> húmeda, que luego se cocían en hornos.'},
 {k:'chips',h:'Religión politeísta: dioses con defectos humanos y grandes poderes',it:['Anu: el cielo','Enlil: el viento','Ishtar (Inanna): amor y guerra','Marduk: dios supremo de Babilonia','Assur: dios de los asirios']},
 {k:'cards',h:'Arte: el triunfo del ladrillo',it:[['Materiales','Casi sin piedra ni madera: <b>adobe</b> (barro secado al sol) y <b>ladrillo cocido</b>, cubierto con cerámica vidriada y relieves.',C.ma],['Arco y bóveda','Sus dos grandes inventos: cubrir espacios enormes sin llenarlos de columnas.',C.ma],['Zigurat','Torre en <b>pirámide escalonada</b> de terrazas. Arriba, el santuario: los sacerdotes observaban los astros, guardaban tesoros y hacían sacrificios.',C.ma],['Escultura','Estatuas <b>orantes</b> como las de <b>Gudea de Lagash</b>: frontales, rígidas y con ojos muy abiertos. <b>Relieves en estelas</b> con guerras y cacerías.',C.ma]]}],
 truco:'Mesopotamia es <b>barro</b>: escribían en barro (tablillas) y construían con barro (adobe y ladrillo).'},
{id:'e1',t:2,n:'El Nilo y las etapas de Egipto',s:'El don del Nilo, Narmer y los tres imperios',
 idea:'Egipto, «el <b>don del Nilo</b>», nació hacia el <b>3000 a. C.</b> en un valle estrecho entre desiertos. <b>Narmer</b> lo unificó y su historia se divide en <b>Imperio Antiguo, Medio y Nuevo</b> y la <b>Época Tardía y Ptolemaica</b>.',
 fig:()=>svgOf('nilo','El valle del Nilo'),
 b:[{k:'cards',h:'El Nilo',it:[['Valle entre desiertos','Franja estrecha rodeada por los desiertos del <b>Sáhara</b> y de <b>Libia</b>, que la protegían. El Nilo es el río más largo del planeta. Heródoto: «el <b>don del Nilo</b>».',C.az],['Crecida y limo','En <b>verano</b>, la crecida inundaba el valle; en <b>otoño</b> quedaba el <b>limo negro</b>, muy fértil: grandes cosechas con poco esfuerzo.',C.az],['Ciencia','<b>Astronomía</b>: calendario solar de <b>12 meses y 365 días</b>. <b>Geometría</b>: volver a medir los campos tras cada inundación.',C.az],['Alto y Bajo Egipto','<b>Alto</b>: el sur, valle estrecho entre montañas. <b>Bajo</b>: el norte, el delta que desemboca en el Mediterráneo.',C.ve]]},
 {k:'cards',h:'Las etapas',it:[['Unificación (h. 3000 a. C.)','<b>Narmer</b> (Menes) unió el Alto y el Bajo Egipto: primer faraón, con la <b>doble corona</b>.',C.mo],['Imperio Antiguo (2635-2154 a. C.)','Capital <b>Menfis</b>. En la IV dinastía, las <b>pirámides de Gizeh</b> (Keops, Kefrén y Micerinos), una de las siete maravillas.',C.mo],['Imperio Medio (2040-1785 a. C.)','Capital <b>Tebas</b>. Comercio con Oriente Medio y Nubia. Acabó con la invasión de los <b>hicsos</b>, con carros de combate.',C.mo],['Imperio Nuevo (1554-1080 a. C.)','Expansión hasta el Éufrates. <b>Ramsés II</b> frenó a los hititas en <b>Qadesh</b>. Templos de <b>Luxor</b> y <b>Karnak</b> y <b>Valle de los Reyes</b>. Decadencia por los Pueblos del Mar y los asirios.',C.mo],['Tardía y Ptolemaica (713-31 a. C.)','<b>Alejandro Magno</b> conquistó Egipto (332 a. C.) y su general Ptolomeo fundó una dinastía. Tras <b>Cleopatra VII</b> (30 a. C.), provincia de <b>Roma</b>.',C.mo]]}],
 truco:'<b>A-M-N</b>: Antiguo = <b>Menfis y pirámides</b>; Medio = <b>Tebas e hicsos</b>; Nuevo = <b>Ramsés II y Valle de los Reyes</b>.'},
{id:'e2',t:2,n:'Sociedad y religión egipcias',s:'El faraón-dios, las momias y el Juicio de Osiris',
 idea:'Una pirámide social <b>rígida</b>, con el <b>faraón</b> como dios en la cima, y una religión centrada en la <b>vida después de la muerte</b>: momias y Juicio de Osiris.',
 fig:()=>svgOf('balanza','El Juicio de Osiris'),
 b:[{k:'cards',h:'La pirámide social',it:[['1. Faraón','Dueño de todas las tierras, jefe del ejército y <b>encarnación del dios Horus</b>. Sus órdenes eran leyes sagradas.',C.na],['2. Altos funcionarios','Gobernadores y generales: administraban los <b>nomos</b> (provincias).',C.mo],['3. Sacerdotes','Casta hereditaria muy rica; guardianes del saber científico y religioso.',C.mo],['4. Escribas','Inventariaban los graneros, cobraban impuestos y registraban las órdenes del faraón.',C.ma],['5. Campesinos, artesanos y mercaderes','Los campesinos eran el <b>85 %</b>: entregaban gran parte de la cosecha y, en la inundación, trabajaban gratis en los monumentos.',C.gr],['6. Esclavos','Prisioneros de guerra. Eran <b>pocos</b>: tareas domésticas y minas.',C.ro]]},
 {k:'chips',h:'Dioses: politeísmo con cuerpos humanos y cabezas de animal',it:['Ra: el sol','Amón: luz y aire (Amón-Ra)','Isis: maternidad y magia','Horus: halcón, protector de la realeza','Anubis: chacal, muerte y embalsamadores','Osiris: dios del más allá']},
 {k:'ej',h:'La vida después de la muerte',t:'El alma, el <b>Ka</b>, vivía en el reino de <b>Osiris</b> si: <b>1)</b> se <b>conservaba el cuerpo</b>, con la momificación (vísceras en <b>vasos canopos</b>, <b>sal de natrón</b> para secar, <b>resinas</b> y <b>vendas de lino</b>), y <b>2)</b> se superaba el <b>Juicio de Osiris</b>: el corazón se pesaba frente a la <b>pluma de Maat</b>; si no pesaba más, iba a los campos de <b>Aaru</b>.'}],
 truco:'Para el más allá, <b>dos condiciones</b>: el <b>cuerpo</b> (momia) y el <b>corazón</b> (juicio). Cuerpo + corazón = vida eterna.'},
{id:'e3',t:2,n:'El arte egipcio',s:'Colosalismo, tumbas, número de oro y canon de perfil',
 idea:'Arte <b>colosal</b> y casi sin cambios en 3000 años, al servicio del faraón y de la eternidad: <b>piedra</b>, techos planos y tumbas cada vez más seguras.',
 fig:()=>svgOf('tumbas','Evolución de las tumbas egipcias'),
 b:[{k:'cards',h:'Arquitectura',it:[['Colosalismo','Obras gigantescas para mostrar el poder eterno del faraón.',C.ma],['Inmovilismo','Las técnicas apenas cambiaron en tres milenios.',C.ma],['Materiales','Casas de <b>adobe y caña</b> (no se conservan); templos y tumbas de <b>piedra</b>, para la eternidad.',C.ma],['Adintelada','Techos planos: <b>no conocían el arco ni la bóveda</b>. Capiteles con forma de plantas: <b>papiriformes, lotiformes y palmiformes</b>.',C.ma]]},
 {k:'cards',h:'Evolución de las tumbas',it:[['Mastaba (3000 a. C.)','Tronco de pirámide con capilla de ofrendas y la estatua del difunto; el sarcófago, en un <b>pozo</b>.',C.mo],['Pirámide escalonada (2600 a. C.)','Mastabas superpuestas: símbolo del poder del faraón en el más allá.',C.mo],['Pirámide (2500 a. C.)','Base cuadrada, galerías, cámaras y <b>trampas</b> para proteger el tesoro. Ej.: <b>Gizeh</b>.',C.mo],['Hipogeo (1500 a. C.)','Tumba <b>excavada en la roca</b>, desde el Imperio Nuevo. Ej.: <b>Valle de los Reyes</b>.',C.mo]]},
 {k:'ej',h:'El número de oro',t:'En la pirámide de <b>Keops</b>, si divides la altura del triángulo de una cara (186,07) entre la mitad de la base (115), sale <b>1,618</b>: el número <b>phi</b> o número de oro. Es su uso en arquitectura más antiguo que se conoce.'},
 {k:'cards',h:'Escultura y pintura',it:[['Escultura','Ley de la <b>frontalidad</b> y simetría: cuerpos rígidos, brazos pegados, rostro sin expresión y mirada al infinito.',C.az],['Canon de perfil','Cabeza, brazos y piernas de perfil; <b>ojo y torso de frente</b>.',C.az],['Colores y tamaños','Colores <b>planos</b>, sin sombras. <b>Perspectiva jerárquica</b>: el tamaño depende de la importancia social.',C.az]]}],
 truco:'Tumbas en orden: «<b>Ma-Es-Pi-Hi</b>» (mastaba, escalonada, pirámide, hipogeo): cada vez más altas… y al final, escondidas en la roca.'},
{id:'e4',t:2,n:'Personajes de Egipto',s:'Osiris, Akhenatón, Nefertiti, Tutankamón, Ramsés II y Cleopatra',
 idea:'Dioses, faraones y reinas con historias de película: el mito de <b>Osiris</b>, el faraón reformador <b>Akhenatón</b>, la bella <b>Nefertiti</b>, el faraón niño <b>Tutankamón</b>, el gran <b>Ramsés II</b> y la última reina, <b>Cleopatra</b>.',
 fig:()=>svgOf('cartuchos','Seis personajes de Egipto'),
 b:[{k:'cards',h:'Mitos y faraones',it:[['Osiris y Seth','Hijos de Ra. <b>Seth</b>, por envidia, mató a su hermano <b>Osiris</b> y esparció sus restos. <b>Isis</b> los recompuso y lo devolvió a la vida: Osiris se hizo dios de los muertos y <b>símbolo de resurrección</b>.',C.ve],['Akhenatón (Amenofis IV)','Reforma religiosa casi <b>monoteísta</b>: impuso el culto al dios sol <b>Atón</b> en lugar de Amón. Se cambió el nombre y llevó la capital de Tebas a una ciudad nueva, <b>Akhetatón</b> (Tell al-Amarna). Arte más <b>humano y naturalista</b>.',C.na],['Nefertiti','Reina de la XVIII dinastía, esposa de Akhenatón, de gran belleza. Desapareció de los documentos de golpe: ¿muerte, caída en desgracia o gobierno con otro nombre? Su <b>busto</b> tiene el cuello alargado.',C.az],['Tutankamón','El <b>faraón niño</b> (1336-1327 a. C.), probablemente hijo de Akhenatón. Devolvió el culto a <b>Amón</b> y la capital a <b>Tebas</b>. Murió a los 18 años. <b>Howard Carter</b> halló su tumba intacta en <b>1922</b>.',C.mo],['Ramsés II','Hijo de Seti I. Luchó contra los <b>hititas</b> y firmó con ellos el <b>primer tratado de paz conocido</b>. Llevó la capital a Tanis, en el delta. Con él Egipto llegó a su mayor extensión. Vivió 93 años.',C.ro],['Cleopatra VII','Última soberana de la dinastía ptolemaica (69-30 a. C.); reinó desde los 16 años. Aliada de <b>Julio César</b> (con quien tuvo a Cesarión) y de <b>Marco Antonio</b>. Murió tras la derrota de <b>Actium</b>. Hablaba siete idiomas.',C.gr]]}],
 truco:'<b>Amón ↔ Atón</b>: Akhenatón cambió Amón por Atón; su hijo Tutankamón volvió a Amón… ¡y lo lleva en el nombre: Tutank-<b>amón</b>!'},
{id:'p1',t:3,n:'Fenicios y hebreos',s:'El alfabeto y el único Dios',
 idea:'Dos pueblos pequeños con aportaciones enormes: los <b>fenicios</b>, comerciantes del mar, crearon el <b>alfabeto</b>; los <b>hebreos</b>, el <b>monoteísmo</b>.',
 fig:()=>svgOf('barco','Fenicios: barcos y alfabeto'),
 b:[{k:'cards',h:'Los fenicios',it:[['Dónde','Costa del actual <b>Líbano</b> (y partes de Siria e Israel), desde h. 3000 a. C. Con montañas detrás, se volcaron al mar.',C.ro],['Cómo se organizaban','<b>Ciudades-estado</b> independientes: <b>Tiro, Sidón, Biblos</b>, Arados y Ugarit. Reyes limitados por un consejo de ricos mercaderes.',C.ro],['Factorías y colonias','<b>Factoría</b>: almacén en la costa para comerciar con los pueblos de la zona, sin quedarse. <b>Colonia</b>: ciudad nueva para vivir, como <b>Cartago</b> (Túnez) o <b>Gadir</b> (Cádiz).',C.ro],['Comercio','Vendían vidrio, joyas y tejidos teñidos de <b>púrpura</b> (del caracol <b>murex</b>) a cambio de plata, oro, cobre y estaño.',C.ro],['El alfabeto','A finales del II milenio a. C.: <b>22 signos</b> que representan sonidos consonantes. Fácil y rápido; base de los alfabetos <b>griego</b> y <b>latino</b>.',C.ro]]},
 {k:'cards',h:'Los hebreos',it:[['Origen','Tribus de <b>pastores seminómadas</b> del sur de Mesopotamia. Hacia el <b>2000 a. C.</b>, con el patriarca <b>Abraham</b>, fueron a <b>Canaán</b> (Palestina).',C.az],['Egipto y Moisés','Cautiverio en Egipto. Según la Biblia, <b>Moisés</b> («salvado de las aguas») los liberó tras las <b>10 plagas</b>, cruzó el <b>mar Rojo</b> y los guio 40 años hacia la Tierra Prometida.',C.az],['Esplendor','Siglo X a. C.: reyes <b>David</b> y <b>Salomón</b> (Templo de Jerusalén). Después, dos reinos: <b>Israel</b> (norte) y <b>Judá</b> (sur). Los invadieron babilonios, persas, macedonios y romanos.',C.az],['Monoteísmo','Un <b>único Dios</b>, Yahvé, invisible y sin imágenes. Textos sagrados: la <b>Torá</b>. Base del <b>judaísmo, el cristianismo y el islam</b>.',C.az]]}],
 truco:'<b>Fenicios → letras</b> (el alfabeto). <b>Hebreos → fe</b> (un solo Dios). Unos nos dejaron cómo escribir y otros, una forma de creer.'},
{id:'p2',t:3,n:'Tartessos, celtas e iberos',s:'Argantonio, el Carambolo, castros, oppida y la Dama de Elche',
 idea:'En la Península, en el I milenio a. C.: la rica y misteriosa <b>Tartessos</b> en el suroeste y, después, dos grandes áreas: <b>celtas</b> (norte, centro y oeste) e <b>iberos</b> (sur y costa mediterránea).',
 fig:()=>svgOf('castro','Castro celta y oppidum ibero'),
 b:[{k:'cards',h:'Tartessos',it:[['Dónde y cuándo','Sur y suroeste de la Península, desde el inicio del I milenio a. C., «más allá de las <b>Columnas de Hércules</b>» (el estrecho de Gibraltar).',C.na],['Riqueza','Agricultura, ganado y sobre todo <b>minas</b> de Sierra Morena y Huelva (oro, plata, cobre, hierro). Allí llegaba la ruta atlántica del <b>estaño</b>. Leyes en verso en tablas de bronce.',C.na],['Argantonio','Rey legendario (670-550 a. C.), «<b>hombre de plata</b>». Según Heródoto vivió 120 años y reinó 87: quizá fue una dinastía.',C.na],['El final','Hacia el <b>500 a. C.</b> desapareció de forma misteriosa (¿los cartagineses? ¿crisis internas?).',C.na],['Tesoro del Carambolo','Hallado en <b>1958</b> en <b>Camas</b> (Sevilla): <b>21 piezas de oro</b> de 24 quilates. Hoy, en el Museo Arqueológico de Sevilla.',C.mo],['Mito de Gerión','Gigante de tres cuerpos que vivía en <b>Eritia</b> (Cádiz) con su perro Ortro y sus bueyes rojos. <b>Hércules</b> lo venció en su décimo trabajo; de su sangre nació un <b>drago</b>.',C.mo]]},
 {k:'cards',h:'Celtas e iberos',it:[['Celtas','Norte, centro y oeste. <b>Indoeuropeos</b> de Europa central: vacceos, vettones, lusitanos, astures, cántabros. <b>Castros</b> en alto, con casas <b>redondas</b> de paja y sin calles. Ganaderos, buenos herreros y joyeros. <b>Sin escritura</b>.',C.ve],['Iberos','Sur y costa mediterránea. Pueblos de aquí: turdetanos, bastetanos, contestanos, edetanos, ilergetes. <b>Oppida</b> con calles. Moneda, comercio, trigo, vid y olivo. <b>Con escritura</b>. Obra cumbre: la <b>Dama de Elche</b> (s. V a. C.).',C.ma],['Celtíberos','En el valle del Duero se mezclaron: <b>metalurgia celta</b> y <b>urbanismo ibero</b>.',C.gr]]}],
 truco:'<b>C</b>eltas → <b>c</b>astros con <b>c</b>asas <b>c</b>irculares. <b>I</b>beros → <b>i</b>ncluyen calles, monedas y escritura.'},
{id:'p3',t:3,n:'Las colonizaciones',s:'Fenicios, griegos y cartagineses en la Península',
 idea:'Atraídos por los <b>metales</b>, llegaron tres pueblos: <b>fenicios</b> (s. IX a. C.), <b>griegos</b> y <b>cartagineses</b> (s. VI a. C.). Fundaron colonias y trajeron inventos que cambiaron la Península.',
 fig:()=>svgOf('colonias','Colonias en la península Ibérica'),
 b:[{k:'cards',h:'Los tres colonizadores',it:[['Fenicios (s. IX a. C.)','Desde <b>Tiro</b>, por el norte de África. Colonias: <b>Gadir</b> (Cádiz), <b>Malaka</b> (Málaga), <b>Sexi</b> (Almuñécar) y <b>Abdera</b> (Adra). Trajeron la minería a gran escala, el <b>torno de alfarero</b>, el hierro, el <b>alfabeto</b>, el <b>olivo</b> y la <b>vid</b>.',C.ro],['Griegos (s. VI a. C.)','De Asia Menor y los Balcanes, al <b>noreste</b>: <b>Emporion</b> (Ampurias) y <b>Rhode</b> (Rosas). Trajeron la <b>moneda</b>, avances en arte y arquitectura y extendieron la escritura.',C.az],['Cartagineses (s. VI a. C.)','Herederos de los fenicios tras la caída de Tiro. Primero, comercio desde <b>Ebusus</b> (Ibiza); luego, <b>conquista</b> para conseguir metales y soldados contra <b>Roma</b>. Fundaron <b>Carthago Nova</b> (Cartagena).',C.na]]},
 {k:'ej',h:'Por qué vinieron',t:'Por la enorme <b>riqueza en metales</b> de la Península (plata, oro, cobre, estaño). El contacto con ellos transformó a los pueblos de aquí, sobre todo a los <b>iberos</b>.'}],
 truco:'Nombres antiguos y actuales: <b>Gadir</b> = Cádiz, <b>Malaka</b> = Málaga, <b>Emporion</b> = Ampurias, <b>Ebusus</b> = Ibiza, <b>Carthago Nova</b> = Cartagena. ¡Se parecen!'},
];
function blocksHTML(s){return s.b.map(B=>{const h=B.h?`<h3 class="bh">${B.h}</h3>`:'';
 if(B.k==='cards')return`<section class="blk">${h}<div class="bxs">${B.it.map(([t,d,c])=>`<div class="bx" style="--c:${c}"><b>${t}</b><span>${d}</span></div>`).join('')}</div></section>`;
 if(B.k==='ej')return`<section class="ej"><span class="ejl">${B.h}</span><p>${B.t}</p></section>`;
 if(B.k==='chips')return`<section class="blk">${h}<div class="tags">${B.it.map(x=>`<span>${x}</span>`).join('')}</div></section>`;
 return''}).join('')}
const CHULETA=[['Mesopotamia','«Tierra entre ríos» (Tigris y Éufrates). Riego → excedentes → ciudades-estado en Sumer (Ur, Uruk, Lagash), IV milenio a. C.',C.az],
 ['Pueblos de Mesopotamia','Sumer (1.ª civilización) → Acad (Sargón I unifica) → Babilonia (Hammurabi y su código) → Asiria (Assurbanipal) → Persia (Ciro II, 539 a. C.).',C.az],
 ['Sociedad y cultura','Rey > sacerdotes > escribas > pueblo llano > esclavos. Escritura cuneiforme en tablillas. Dioses: Anu, Enlil, Ishtar, Marduk, Assur. Zigurat, arco y bóveda.',C.az],
 ['El Nilo','«Don del Nilo». Crecida en verano, limo negro en otoño. Calendario de 365 días. Alto Egipto (sur) y Bajo Egipto (norte, delta).',C.mo],
 ['Etapas de Egipto','Narmer (h. 3000) → I. Antiguo (Menfis, Gizeh) → I. Medio (Tebas, hicsos) → I. Nuevo (Ramsés II, Qadesh) → Ptolemaico (Cleopatra, 30 a. C.).',C.mo],
 ['Sociedad y religión','Faraón (Horus) > funcionarios > sacerdotes > escribas > campesinos (85 %) > esclavos (pocos). Ka, momificación, Juicio de Osiris y pluma de Maat.',C.mo],
 ['Arte egipcio','Colosal, de piedra y adintelado. Mastaba → escalonada → pirámide (número de oro) → hipogeo. Canon de perfil y perspectiva jerárquica.',C.mo],
 ['Fenicios y hebreos','Fenicios: Tiro, Sidón, Biblos; factorías y colonias; púrpura; alfabeto de 22 signos. Hebreos: Abraham, Moisés, David y Salomón; monoteísmo.',C.ro],
 ['Tartessos, celtas e iberos','Tartessos: Argantonio, minas, Carambolo. Celtas: castros, sin escritura. Iberos: oppida, moneda, escritura, Dama de Elche.',C.ve],
 ['Colonizaciones','Fenicios s. IX (Gadir, Malaka, Sexi, Abdera). Griegos s. VI (Emporion, Rhode). Cartagineses s. VI (Ebusus, Carthago Nova).',C.ve]];

 ['t','¿Qué rey mandó escribir uno de los códigos de leyes más antiguos?','Hammurabi de Babilonia',['Sargón I de Acad','Nabucodonosor II','Jerjes I'],'El Código de Hammurabi, hacia el 1754 a. C.'],

const KEY='hist-t3-v1';
let S={stars:{},q:{},games:{}};try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.stars)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const st={tab:'est',confirm:false,timer:null,chu:false};
const totalStars=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);
function stopTimers(){if(st.timer){clearInterval(st.timer);st.timer=null}}
function weight(q){const s=S.q[q.id];if(!s)return 3;return Math.max(.4,1+2*(s.n-s.ok)-.6*s.ok)}
function wpick(list,n){const out=[],pool=[...list];while(out.length<n&&pool.length){let r=Math.random()*pool.reduce((a,q)=>a+weight(q),0);let k=0;for(;k<pool.length;k++){r-=weight(pool[k]);if(r<=0)break}out.push(pool.splice(Math.min(k,pool.length-1),1)[0])}return out}
function setBest(id,v,lower){const p=S.games[id];if(p==null||(lower?v<p:v>p)){S.games[id]=v;save();renderProgress();return true}return false}

function renderScore(){$('#score').innerHTML=`${star(true)}<span>${totalStars()}</span><small class="note" style="font:400 .85rem var(--f-body)">/ ${ST.length*3}</small>`}

 TH.map(([t,n])=>{const L=ST.filter(s=>s.t===t);return`<div class="theme-head"><h2>${n}</h2><span>${L.reduce((a,s)=>a+(S.stars[s.id]||0),0)} de ${L.length*3} estrellas</span></div><ol class="path">${L.map(s=>{const i=ST.indexOf(s);const n2=S.stars[s.id]||0;return`<li><span class="dot ${n2?'done':''}">${i+1}</span><button class="stop" type="button" data-id="${s.id}"><span><b>${s.n}</b><small>${s.s}</small></span><span class="stars" aria-label="${n2} estrellas">${[1,2,3].map(k=>star(k<=n2)).join('')}</span></button></li>`}).join('')}</ol>`}).join('')+`<p class="note">Cada ficha tiene un reto de 5 preguntas: 5 aciertos son 3 estrellas, 4 son 2 y 3 son 1.</p>`;

 $('#main').querySelectorAll('.stop').forEach(b=>b.onclick=()=>openSt(b.dataset.id))}

 <div class="actions"><button class="primary" id="reto" type="button">Hacer el reto (5 preguntas)</button>${next?`<button class="ghost" id="sig" type="button">Siguiente ficha</button>`:''}<button class="ghost" id="volver" type="button">Volver</button></div></article>`;

let V=null;
function startQuiz(cfg){V=Object.assign(cfg,{idx:0,res:[]});drawQ()}
function drawQ(){const q=V.list[V.idx];const opts=q.t==='test'?shuffle([q.ok,...q.no]):['Verdadero','Falso'];V.opts=opts;V.ans=false;
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>${V.kind==='reto'?stOf(V.id).n:'Prueba · '+stOf(q.st).n}</span><span>${V.idx+1} / ${V.list.length}</span></div>
 <div class="pbar">${V.list.map((_,i)=>`<i class="${i<V.res.length?(V.res[i]?'okk':'ko'):i===V.idx?'on':''}"></i>`).join('')}</div>
 <p class="q">${q.t==='vf'?'¿Verdadero o falso? ':''}${esc(q.q)}</p><div class="opts ${q.t==='vf'?'two':''}" id="opts">${opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="after"></div><div class="stamp" id="stamp" hidden></div></div>`;
 $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerQ(+b.dataset.i));window.scrollTo({top:0})}
function answerQ(i){if(V.ans)return;V.ans=true;const q=V.list[V.idx];const okIdx=q.t==='test'?V.opts.indexOf(q.ok):(q.ok?0:1);const ok=i===okIdx;
 $('#opts').querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===okIdx)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
 V.res.push(ok);const s=S.q[q.id]||(S.q[q.id]={ok:0,n:0});s.n++;if(ok)s.ok++;save();const sp=$('#stamp');sp.hidden=false;sp.className='stamp '+(ok?'b':'mm');sp.textContent=ok?'B':'M';
 const last=V.idx===V.list.length-1;$('#after').innerHTML=`<p class="verdict ${ok?'b':'mm'}">${ok?pick(['¡Bien!','¡Exacto!','¡Muy bien!']):'No es correcto.'}</p><p class="exp">${q.exp}</p><div class="actions" style="margin-top:12px"><button class="primary" id="nx" type="button">${last?'Ver resultado':'Siguiente'}</button></div>`;

function renderProgress(){const any=totalStars()||Object.keys(S.games).length||Object.keys(S.q).length;
 $('#progress').innerHTML=`<h2>Medallas</h2><div class="badges">${BADGES.map(([n,f])=>{const g=f();return`<span class="badge ${g?'got':''}">${star(g)}${n}</span>`}).join('')}</div>
 <div class="pfoot"><span>${any?'Las medallas se ganan con las estrellas, los juegos y la prueba.':'Todavía no has empezado en este dispositivo.'}</span>${st.confirm?`<span class="rconf">¿Seguro? <button class="rbtn danger" id="rYes" type="button">Sí, borrar</button><button class="rbtn" id="rNo" type="button">Cancelar</button></span>`:`<button class="rbtn" id="rst" type="button"${any?'':' disabled'}>Borrar progreso</button>`}</div>`;
 if($('#rst'))$('#rst').onclick=()=>{st.confirm=true;renderProgress()};if($('#rNo'))$('#rNo').onclick=()=>{st.confirm=false;renderProgress()};
 if($('#rYes'))$('#rYes').onclick=()=>{S={stars:{},q:{},games:{}};save();st.confirm=false;renderProgress();renderScore();setTab(st.tab)}}
function setTab(t){stopTimers();st.tab=t;[['tEst','est'],['tJue','jue'],['tPru','pru']].forEach(([id,k])=>$('#'+id).setAttribute('aria-pressed',k===t));({est:renderEst,jue:renderJue,pru:renderPru})[t]();window.scrollTo({top:0})}
$('#tEst').onclick=()=>setTab('est');$('#tJue').onclick=()=>setTab('jue');$('#tPru').onclick=()=>setTab('pru');
renderScore();renderProgress();setTab('est');
</script>
</body>
</html>
