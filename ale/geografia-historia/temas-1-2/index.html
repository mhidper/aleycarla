<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expedición Historia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
/* Layout: cuaderno de expedición. Misma familia que las otras apps (hoja cuadriculada, rotulador magenta) con un camino de estaciones como mapa; los juegos van en hojas propias */
:root{
  --bg:#eaeff7; --paper:#fdfdfb; --grid:#e2e9f4; --ink:#1b2a4a; --muted:#56637d; --line:#cfd8e7;
  --marker:#c0127e; --marker-soft:#fbe4f1; --ok:#17734a; --ok-soft:#ddf2e6; --btn:#1b2a4a; --btn-fg:#fdfdfb; --chip:#ffffff;
  --star:#d9a400; --t1:#9a5a1e; --t2:#2d5fa8; --parch:#f6efe0;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1524; --paper:#151f36; --grid:#1d2a46; --ink:#e4eaf6; --muted:#9ba8c3; --line:#2a3856;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#e4eaf6; --btn-fg:#0e1524; --chip:#18233d;
  --star:#ffd23f; --t1:#e8a566; --t2:#82b0f2; --parch:#22283a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1524; --paper:#151f36; --grid:#1d2a46; --ink:#e4eaf6; --muted:#9ba8c3; --line:#2a3856;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#e4eaf6; --btn-fg:#0e1524; --chip:#18233d;
  --star:#ffd23f; --t1:#e8a566; --t2:#82b0f2; --parch:#22283a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:740px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.back{font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:700}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.1;margin:0;letter-spacing:-.01em}
header h1 span{color:var(--marker);font-family:var(--f-hand);font-size:1.15em;margin-left:.15em}
header p{margin:.35em 0 0;color:var(--muted);max-width:56ch}
.score{display:flex;align-items:center;gap:6px;font:800 1.4rem var(--f-display);font-variant-numeric:tabular-nums}
.score svg{width:28px;height:28px}
.tabs{display:flex;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 .95rem var(--f-body);padding:10px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:400 .9rem var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
button:focus-visible,.opt:focus-visible,.card3d:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.sheet{position:relative;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:6px;padding:20px 18px 22px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(20,30,60,.45);display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-right:56px}
h2{font:800 1.35rem var(--f-display);margin:0;text-wrap:balance}
h3{font:800 1.05rem var(--f-display);margin:0}
.primary{background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;font:700 1rem var(--f-body);padding:12px 20px;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:700 1rem var(--f-body);padding:11px 16px;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:.9rem;color:var(--muted);margin:0}
/* Mapa de estaciones */
.theme-head{display:flex;align-items:baseline;gap:10px;margin:6px 0 -4px}
.theme-head h2{font-size:1.2rem}
.theme-head span{font-size:.85rem;color:var(--muted);font-weight:700}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;position:relative}
.path li{position:relative;padding-left:58px;padding-block:6px}
.path li::before{content:"";position:absolute;left:21px;top:0;bottom:0;border-left:3px dotted var(--line)}
.path li:first-child::before{top:50%}.path li:last-child::before{bottom:50%}
.stop{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.stop:hover{border-color:var(--muted)}
.stop b{font:800 1.05rem var(--f-display);display:block}
.stop small{color:var(--muted);font-size:.88rem;display:block}
.dot{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 .95rem var(--f-display);background:var(--paper);border:3px solid currentColor}
.t1c{color:var(--t1)} .t2c{color:var(--t2)}
.dot.done{background:currentColor}.dot.done span{color:var(--paper)}
.stars{display:flex;gap:2px;flex:none}
.stars svg{width:20px;height:20px}
.st-on{fill:var(--star)} .st-off{fill:none;stroke:var(--line);stroke-width:2}
/* Ficha */
.ill{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.ill svg{width:100%;max-width:420px;height:auto;display:block;border-radius:10px}
.ill figcaption{font-size:.86rem;color:var(--muted);text-align:center}
.figs{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.figs .ill{flex:1 1 240px}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:64ch}
.card li::marker{color:var(--marker)}
.truco{background:var(--marker-soft);border-radius:10px;padding:10px 12px;margin:0}
.truco b{font-family:var(--f-hand);font-size:1.4rem;color:var(--marker);font-weight:700;margin-right:6px}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:440px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;background:var(--paper)}
.tbl th{background:var(--chip)}
/* Preguntas */
.q{font-size:1.12rem;font-weight:700;margin:0;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.two{flex-direction:row}.opts.two .opt{flex:1;text-align:center;font-weight:700}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 1rem var(--f-body);padding:10px 14px;border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.opt.wrong{border-color:var(--marker);background:var(--marker-soft)}
.opt:disabled{cursor:default}
.exp{border-top:2px solid var(--ink);padding-top:10px;margin:0}
.verdict{font-weight:700;margin:0}.verdict.b{color:var(--ok)}.verdict.mm{color:var(--marker)}
.stamp{position:absolute;top:10px;right:14px;font-family:var(--f-hand);font-size:3.4rem;line-height:1;transform:rotate(-8deg);pointer-events:none}
.stamp.b{color:var(--ok)}.stamp.mm{color:var(--marker)}
.pbar{display:flex;gap:5px}.pbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.pbar i.okk{background:var(--ok)}.pbar i.ko{background:var(--marker)}.pbar i.on{background:var(--ink)}
.bigstars{display:flex;gap:8px;justify-content:center}.bigstars svg{width:56px;height:56px}
@media (prefers-reduced-motion:no-preference){.bigstars svg.st-on-anim{animation:pop .45s ease-out both}.bigstars svg:nth-child(2){animation-delay:.15s}.bigstars svg:nth-child(3){animation-delay:.3s}}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}}
.grade{font-family:var(--f-hand);color:var(--marker);font-size:4.4rem;line-height:1;border:3px solid var(--marker);border-radius:50%;width:140px;height:110px;display:grid;place-items:center;transform:rotate(-6deg);margin:6px 0 10px}
/* Juegos */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.gcard:hover{border-color:var(--muted)}
.gcard svg{width:44px;height:44px}
.gcard b{font:800 1.08rem var(--f-display)}
.gcard small{color:var(--muted)}
.gcard .best{font-size:.82rem;color:var(--ok);font-weight:700}
.tl-pool{display:flex;flex-wrap:wrap;gap:8px}
.ev{border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 .98rem var(--f-body);padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left}
.ev.shake{border-color:var(--marker);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:3px solid var(--ink);display:flex;flex-direction:column;gap:8px;min-height:20px}
.tl li{position:relative;background:var(--ok-soft);border-radius:8px;padding:6px 10px}
.tl li::before{content:"";position:absolute;left:-30px;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ok);transform:translateY(-50%)}
.tl li small{display:block;color:var(--muted);font-weight:700}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card3d{display:block;position:relative;width:100%;aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer;perspective:600px;font:inherit;color:var(--ink);min-width:0}
.card3d .in{display:block;position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.card3d.up .in,.card3d.done .in{transform:rotateY(180deg)}
.card3d .f,.card3d .b{position:absolute;inset:0;border-radius:10px;display:grid;place-items:center;padding:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;font-size:.82rem;line-height:1.2;overflow:hidden}
.card3d .f{background:var(--btn);color:var(--btn-fg);font-family:var(--f-hand);font-size:2rem}
.card3d .b{overflow-wrap:anywhere;hyphens:auto;background:var(--paper);border:2px solid var(--line);transform:rotateY(180deg)}
.card3d .b.sp{font-weight:700;font-style:italic}
.card3d.done .b{border-color:var(--ok);background:var(--ok-soft)}
@media (prefers-reduced-motion:reduce){.card3d .in{transition:none}}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.timer{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}.timer i{display:block;height:100%;background:var(--marker);transition:width .2s linear}
.bigq{font:800 1.5rem var(--f-display);text-align:center;min-height:3.2em;display:grid;place-items:center;margin:0;text-wrap:balance}
.flash-ok{animation:fok .4s}.flash-ko{animation:fko .4s}
@keyframes fok{from{background:var(--ok-soft)}}@keyframes fko{from{background:var(--marker-soft)}}
.tapsvg svg{width:100%;max-width:440px;height:auto;display:block;margin:0 auto;border-radius:10px}
.tapsvg [data-k]{cursor:pointer}
.tapsvg [data-k]:hover{opacity:.85}
.planets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.pl{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 .85rem var(--f-body);color:var(--ink)}
.pl svg{display:block}
.pl.placed{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.pl.shake{border-color:var(--marker);animation:shake .35s}
.order{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center}
.order span{background:var(--ok-soft);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.9rem}
/* Tarjetas */
.flash{width:100%;min-height:220px;border:0;padding:0;background:none;cursor:pointer;perspective:900px;font:inherit;color:var(--ink)}
.flash .in{display:block;position:relative;width:100%;min-height:220px;transition:transform .45s;transform-style:preserve-3d}
.flash.up .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;border:2px solid var(--line);background:var(--paper)}
.flash .f b{font:800 1.8rem var(--f-display)}
.flash .b{transform:rotateY(180deg);font-size:1.08rem}
.flash small{color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){.flash .in{transition:none}}
/* Progreso */
.progress{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:16px}
.progress h2{font-size:1.15rem;margin:0 0 10px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:.85rem;font-weight:700;color:var(--muted)}
.badge.got{color:var(--ink);border-color:var(--star)}
.badge svg{width:22px;height:22px}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.9rem;color:var(--muted)}
.rbtn{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;font:700 .9rem var(--f-body);padding:7px 12px;cursor:pointer;margin-left:6px}
.rbtn:disabled{opacity:.45;cursor:default}
.rbtn.danger{background:var(--marker);border-color:var(--marker);color:var(--paper)}
.rconf{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px;color:var(--ink);font-weight:700}
.qlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.qlist li{display:flex;gap:10px;align-items:baseline}
.qlist b{font-family:var(--f-hand);font-size:1.5rem;width:1.2em;flex:none}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-fg);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:5;max-width:calc(100% - 32px);text-align:center}
/* textos de los dibujos */
svg text{font-family:var(--f-body)}
.ink{fill:var(--ink)}.inks{stroke:var(--ink)}.mut{fill:var(--muted)}.pap{fill:var(--paper)}.parch{fill:var(--parch)}
@media (max-width:460px){header h1{font-size:1.65rem}.opts.grid{grid-template-columns:1fr}.stamp{font-size:2.8rem}.mem{gap:6px}.card3d .b{font-size:.74rem}}
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="../../../#ale/geografia-historia">← Historia de Ale</a>
  <header>
    <div><h1>Expedición Historia <span>Ale</span></h1>
    <p>Tema 1, La Prehistoria, y Tema 2, La Tierra y el Universo. Recorre las estaciones, gana estrellas y juega para repasar.</p></div>
    <div class="score" id="score" aria-label="Estrellas"></div>
  </header>
  <div class="tabs" role="group" aria-label="Sección">
    <button id="tMapa" aria-pressed="true">Mapa</button>
    <button id="tJuegos" aria-pressed="false">Juegos</button>
    <button id="tTarjetas" aria-pressed="false">Tarjetas</button>
    <button id="tPrueba" aria-pressed="false">Prueba</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Tema"></div>
  <main id="main"></main>
  <section class="progress" id="progress"></section>
</div>

<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAR='<path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/>';
const star=(on,cls='')=>`<svg viewBox="0 0 24 24" class="${on?'st-on':'st-off'} ${cls}" aria-hidden="true">${STAR}</svg>`;

/* =================== DIBUJOS =================== */
const D={
linea:()=>{const seg=[['Paleolítico','#d9b98f'],['Neolítico','#c9d49a'],['Metales','#d6a77a'],['E. Antigua','#e6cf8e'],['E. Media','#b9c7dd'],['E. Moderna','#d8b6d4'],['E. Contemp.','#a9d1c4']];const w=340/7;
 let s=`<rect width="360" height="132" class="parch"/>`;seg.forEach((g,i)=>{const x=10+i*w;s+=`<rect x="${x}" y="40" width="${w-2}" height="34" rx="4" fill="${g[1]}"/><text x="${x+w/2-1}" y="61" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2a2a2a">${g[0]}</text>`});
 s+=`<path d="M10 32 L${10+3*w-2} 32" stroke="var(--muted)" stroke-width="2"/><text x="${10+1.5*w}" y="26" text-anchor="middle" font-size="11" font-weight="700" class="mut">PREHISTORIA</text><text x="${10+5*w}" y="26" text-anchor="middle" font-size="11" font-weight="700" class="mut">HISTORIA</text>`;
 [['2,5 M años',0],['10000 a.C.',1],['5000 a.C.',2],['3500 a.C.',3],['476',4],['1492',5],['1789',6]].forEach(([t,i])=>{const x=10+i*w;s+=`<line x1="${x}" y1="76" x2="${x}" y2="88" class="inks" stroke-width="1.5"/><text x="${x+2}" y="${i%2?112:100}" font-size="10" class="ink">${t}</text>`});
 return{vb:'0 0 360 132',s}},
arqueo:()=>({vb:'0 0 300 170',s:`<rect width="300" height="40" fill="#dbe7ee"/><rect y="40" width="300" height="40" fill="#b08d63"/><rect y="80" width="300" height="45" fill="#957450"/><rect y="125" width="300" height="45" fill="#7c5f40"/>
 <path d="M60 110 C 52 96, 62 86, 70 86 L 90 86 C 98 86, 108 96, 100 110 C 96 118, 64 118, 60 110 Z" fill="#c9733a" stroke="#5a3a1a" stroke-width="2"/><rect x="70" y="80" width="20" height="8" rx="2" fill="#c9733a" stroke="#5a3a1a" stroke-width="2"/>
 <circle cx="200" cy="145" r="12" fill="#d4a017" stroke="#7a5d08" stroke-width="2"/><circle cx="200" cy="145" r="7" fill="none" stroke="#7a5d08" stroke-width="1.2"/>
 <path d="M150 104 l14 -4 l6 10 l-12 6 Z" fill="#efe6d4" stroke="#5a3a1a" stroke-width="1.5"/>
 <g transform="translate(230 18) rotate(35)"><rect x="-3" y="0" width="6" height="34" rx="2" fill="#6b4422"/><path d="M-9 34 L9 34 L0 56 Z" fill="#9aa3ad" stroke="#5c6670" stroke-width="1.5"/></g>
 <g transform="translate(120 10) rotate(-20)"><rect x="-2.5" y="0" width="5" height="26" rx="2" fill="#6b4422"/><rect x="-6" y="26" width="12" height="12" rx="2" fill="#e8c77a"/></g>

 '<b>Homínido</b>: la familia de primates a la que pertenece el ser humano (<i>Homo sapiens</i>) y sus antepasados.'],
 truco:'Para las fechas de las edades: «<b>476</b> cae Roma, <b>1492</b> Colón, <b>1789</b> Francia en revolución».'},
{id:'h2',t:1,n:'El estudio del pasado',s:'Fuentes y ciencias auxiliares',figs:[['arqueo','La arqueología estudia los restos enterrados: lo más profundo suele ser lo más antiguo']],p:[
 'La historia trabaja con <b>fuentes históricas</b>: materiales, escritas, artísticas y gráficas o audiovisuales.',
 '<b>Fuentes primarias</b>: son de la época que se estudia (ánforas griegas, monedas romanas, textos medievales). Pueden ser escritas o no escritas.',
 '<b>Fuentes secundarias</b>: se hicieron después, a partir de las primarias (dibujos, mapas, libros).',
 '<b>Ciencias auxiliares</b>: la <b>arqueología</b> estudia los restos materiales; la <b>paleontología</b>, los fósiles de animales y plantas; la <b>química</b> data restos orgánicos con el <b>carbono-14</b>.',
 'Fases del trabajo arqueológico: 1) obtención previa de datos, 2) <b>excavación</b>, 3) análisis y descripción de los restos, 4) <b>interpretación</b>.'],
 truco:'Primaria = de <b>primera mano</b>, de la misma época. Secundaria = contada <b>después</b> por otros.'},
{id:'h3',t:1,n:'La hominización',s:'De los primeros homínidos al Homo sapiens',figs:[['huellas','Las huellas más antiguas de bipedismo']],p:[
 'Hace unos <b>6 millones de años</b>, un cambio climático en el sudeste de África secó el clima y la selva dio paso a la <b>sabana</b>. Algunos primates se adaptaron: fueron los primeros homínidos.',
 '<b>Australopithecus</b> (3,5 M años, África): el primero en ser <b>bípedo</b>. La más famosa es <b>Lucy</b> (hallada en Etiopía en 1974; vivió hace 3,2 M años).',
 '<b>Homo habilis</b> (2,5 M): el primero del género Homo, más cerebro, <b>primeras herramientas</b>. <b>Homo erectus</b> (1,7 M): <b>descubrió el fuego</b> y tallaba la piedra.',
 '<b>Homo antecessor</b>: en la Península hace más de 800.000 años; antepasado directo del sapiens. <b>Homo heidelbergensis</b>: llegó hace unos 500.000 años.',
 '<b>Neandertal</b>: adaptado al frío glacial, vivió en Europa, Asia y Oriente Medio y convivió con el sapiens. Las personas de origen no africano tienen un <b>2-3 % de genes neandertales</b>.',
 'Grandes cambios: <b>más capacidad craneal</b>, <b>bipedismo</b> (manos libres), <b>pulgar oponible</b> y <b>capacidad de hablar</b>.',
 'Las huellas de <b>Laetoli</b> (Tanzania), de 3,75 millones de años, son la prueba más antigua de bipedismo.'],
 truco:'Habilis = <b>hábil</b> con las herramientas. Erectus = <b>erguido</b> junto al fuego. Sapiens = <b>sabio</b>, como tú.'},
{id:'h4',t:1,n:'La Prehistoria en la Península',s:'Atapuerca, primeros pobladores y arte',figs:[['bifaz','Un bifaz: piedra tallada con forma de almendra']],p:[
 'Los primeros homínidos llegaron a la Península hace más de <b>un millón de años</b>: eran <b>Homo erectus</b> venidos de África.',
 '<b>Atapuerca</b> (Burgos) es uno de los mayores hallazgos: allí se descubrió el <b>Homo antecessor</b>, y también hay restos de Homo heidelbergensis.',
 'Después llegaron los <b>neandertales</b> (hace 90.000 años), que desaparecieron hace unos 30.000 años, y el <b>Homo sapiens</b> (hace 40.000 años).',
 'Vivían en grupos pequeños y <b>nómadas</b>, en cuevas y abrigos; cazaban, recolectaban, dominaban el fuego y tallaban piedra (hachas, <b>bifaces</b>, puntas, cuchillos).',
 '<b>Pintura francocantábrica</b>: animales salvajes muy <b>naturalistas</b> (Altamira). <b>Pintura levantina</b>: escenas de caza con <b>figuras humanas esquemáticas</b> (El Cogul, Lleida).',
 'Muestras de arte: <b>arte rupestre</b> (Paleolítico), <b>objetos</b> como estatuillas (Paleolítico y Neolítico), <b>cerámica</b> y <b>megalitos</b> (Neolítico).']},
{id:'h5',t:1,n:'El Paleolítico',s:'«Piedra antigua»: cazadores y recolectores',figs:[['campamento','Un campamento paleolítico: cabaña de ramas y pieles y el fuego']],p:[
 'Es el período <b>más largo</b> de la historia. Su nombre significa «piedra antigua».',
 'Rasgos: <b>piedra tallada</b> (sobre todo <b>sílex</b>), descubrimiento del <b>fuego</b>, <b>caza y recolección</b> y <b>nomadismo</b>.',
 'Etapas: <b>inferior</b> (2,5 M-100000 a.C., Homo habilis), <b>medio</b> (100000-40000 a.C., neandertal y sapiens) y <b>superior</b> (40000-10000 a.C., llega el sapiens a Europa).',
 'El fuego permitió calentarse, ver de noche, defenderse, cocinar y mejorar herramientas. Se encendía frotando un palo o golpeando <b>pedernal contra pirita</b>.',
 'Vivían en <b>clanes de 25 a 50</b> personas. Las mujeres también cazaban; la cooperación era fundamental. Las cuevas eran refugios temporales.',
 'Talla de la piedra por <b>percusión</b> (golpear el núcleo para sacar <b>lascas</b>) o por <b>presión</b> (más precisa). Usaban hueso para agujas, arpones y punzones.',
 'Armas: <b>azagayas</b> (lanzas pequeñas), cuchillos, hachas y, en el Paleolítico superior, <b>arcos y flechas</b>. Su forma de vida era <b>depredadora</b>.',
 'Arte: pinturas <b>rupestres o parietales</b> (Altamira, Lascaux), con finalidad mágica o religiosa, y <b>Venus</b> como la de <b>Willendorf</b> (Austria, 11 cm).']},
{id:'h6',t:1,n:'El Neolítico',s:'«Piedra nueva»: agricultura y poblados',figs:[['neolitico','Agricultura, piedra pulida y cerámica']],p:[
 'Empieza hacia el <b>10000 a.C.</b> con la <b>agricultura y la ganadería</b>: es la <b>revolución neolítica</b>, que nace en el <b>Creciente Fértil</b>.',
 'Se pasa de una economía <b>depredadora</b> a una <b>productora</b>. La gente se hace <b>sedentaria</b> y vive en <b>poblados permanentes</b>.',
 'Rasgos: <b>piedra pulida</b>, agricultura y ganadería, nacimiento de la <b>artesanía</b>, sedentarismo y primeros intercambios gracias al <b>excedente</b>.',
 'Cultivos: trigo, cebada, avena, centeno, mijo, lentejas, guisantes. Animales: ovejas, cabras, vacas y caballos. Al principio, <b>cultivo itinerante</b>.',
 'Inventos: <b>cerámica</b> (como la <b>cardial</b>, decorada con conchas de berberecho), <b>molino de mano</b>, <b>hoz</b> de sílex, tejidos de lino y lana.',
 '<b>Çatalhöyük</b> (Turquía), de hace 9.000 años, es la <b>primera ciudad</b>: unas 8.000 personas, sin calles y con entrada por el techo.',
 'Arte y creencias: <b>megalitos</b> (menhir, dolmen, alineamiento, crómlech) y <b>animismo</b>: creían que todo tenía alma.'],
 truco:'Paleo = <b>antiguo</b>, Neo = <b>nuevo</b>, lítico = <b>piedra</b>. Paleolítico tallada, Neolítico pulida.'},
{id:'h7',t:1,n:'La Edad de los Metales',s:'Cobre, bronce y hierro',figs:[['metales','Las tres edades de los metales']],p:[
 'Empieza hacia el <b>5000 a.C.</b> con la <b>metalurgia</b>. Tres etapas: <b>Cobre</b> (5000-1800 a.C.), <b>Bronce</b> (1800-750 a.C.) y <b>Hierro</b> (750 a.C.-s. I a.C.).',
 'El <b>bronce</b> es una aleación de <b>cobre y estaño</b>. Como no estaban en el mismo sitio, nació el <b>comercio a larga distancia</b>.',
 'En la Península: <b>vaso campaniforme</b> (2500-1750 a.C.), <b>Los Millares</b> en Almería (h. 2400 a.C.) y <b>El Argar</b> en el sudeste (2250-1600 a.C.).',
 'Los pueblos indoeuropeos trajeron el hierro y la cultura de los <b>campos de urnas</b> (1300-1100 a.C.): <b>incineraban</b> a los muertos y guardaban las cenizas en urnas.',
 'Sociedad: <b>clases sociales</b> (jefes, sacerdotes y guerreros) y pueblo (metalurgia, orfebrería, comercio, oficios menores y campesinado).',
 'Poblados más grandes, en <b>lugares altos</b> y con <b>murallas</b>; casas de <b>adobe</b>. Técnicas: <b>forja</b>, <b>batido</b>, <b>fundición</b> en moldes y aleación.',
 'Inventos: <b>rueda</b>, <b>horno de piedra</b>, <b>arado</b> tirado por animales, <b>vela</b> y <b>canales</b>. Arte: <b>orfebrería</b>, <b>repujado</b> y <b>ajuares</b> funerarios.',
 'El primer metal usado fue el <b>oro</b>, golpeado hasta hacer láminas.']},
{id:'u1',t:2,n:'El Universo',s:'Big Bang, galaxias y cuerpos celestes',figs:[['galaxia','La Vía Láctea, una galaxia espiral barrada (dibujo)']],p:[
 'El <b>Universo</b> es el conjunto de toda la materia, la energía, el espacio y el tiempo.',
 'Teoría del <b>Big Bang</b>: hace unos <b>13.800 millones de años</b> todo estaba concentrado en un punto, la <b>singularidad</b>. Al expandirse se formaron el <b>hidrógeno</b> y el <b>helio</b>, y luego estrellas y galaxias.',
 '<b>Cosmogonías</b>: explicaciones míticas o religiosas del origen. Los griegos llamaban <b>kósmos</b> al orden y <b>khaos</b> al desorden.',
 'La <b>astrología</b> nació en Mesopotamia (III milenio a.C.) y dividió el cielo en <b>12 constelaciones del zodiaco</b>. No es una ciencia.',
 'La <b>Estrella Polar</b>, en la <b>Osa Menor</b>, señala el Norte.',
 'Nuestra galaxia es la <b>Vía Láctea</b> («camino de leche»), una galaxia <b>espiral barrada</b>.',
 '<b>Estrellas</b>: tienen luz propia (fusión nuclear). <b>Planetas</b>: giran alrededor de una estrella y han limpiado su órbita. <b>Satélites</b>: giran alrededor de un planeta. <b>Asteroides</b>: fragmentos de roca. <b>Cometas</b>: hielo y polvo; al acercarse al Sol forman la <b>cabellera</b> y la <b>cola</b>.']},
{id:'u2',t:2,n:'Cómo estudiamos el cielo',s:'De Stonehenge a Newton',figs:[['geohelio','Los dos grandes modelos del Universo']],p:[
 'La <b>astronomía</b> es la ciencia que estudia los astros.',
 'En la Prehistoria, <b>Stonehenge</b> y los <b>dólmenes de Antequera</b> se alinearon con los solsticios y equinoccios para regular la siembra y la cosecha.',
 '<b>Ptolomeo</b> (s. II d.C.): modelo <b>geocéntrico</b>, la Tierra inmóvil en el centro.',
 '<b>Copérnico</b> (s. XVI): modelo <b>heliocéntrico</b>, el Sol en el centro.',
 '<b>Galileo</b> (s. XVII): usó por primera vez el <b>telescopio</b> y observó las fases de Venus y los satélites de Júpiter.',
 '<b>Kepler</b>: las órbitas son <b>elipses</b>, no círculos. <b>Newton</b>: la <b>ley de la gravitación universal</b>.'],
 truco:'<b>Geo</b> = Tierra, <b>Helio</b> = Sol. Geocéntrico: la Tierra en el centro.'},
{id:'u3',t:2,n:'El Sistema Solar',s:'El Sol, los planetas y los cuerpos menores',figs:[['sistema','Los planetas en orden desde el Sol (tamaños aproximados, distancias no a escala)']],p:[
 'Está en el <b>brazo de Orión</b> de la Vía Láctea y se formó hace unos <b>4.600 millones de años</b> a partir de una nube de gas y polvo.',
 'El <b>Sol</b> es una estrella: <b>73 % hidrógeno</b> y <b>25 % helio</b>; tiene el <b>99,86 %</b> de la masa del sistema y su núcleo supera los <b>15 millones de grados</b>.',
 '<b>Planetas interiores o terrestres</b>: Mercurio, Venus, Tierra y Marte. Rocosos, densos, pocos satélites, sin anillos, giran despacio.',
 '<b>Planetas exteriores o jovianos</b>: Júpiter, Saturno, Urano y Neptuno. Gaseosos, poco densos (Saturno flotaría en agua), muchos satélites y anillos, giran muy rápido.',
 'El <b>cinturón de asteroides</b> está entre <b>Marte y Júpiter</b>. El <b>cinturón de Kuiper</b>, más allá de Neptuno.',
 'En <b>2006</b> se creó la categoría de <b>planeta enano</b>: <b>Ceres</b>, <b>Plutón</b> (antes era planeta) y <b>Eris</b>.'],
 truco:'Orden de los planetas: «<b>Mi Vieja Tía María Jamás Supo Usar Netflix</b>» (Mercurio, Venus, Tierra, Marte, Júpiter, Saturno, Urano, Neptuno).'},
{id:'u4',t:2,n:'La Tierra y sus capas',s:'Geosfera, hidrosfera y atmósfera',figs:[['interior','Capas de la geosfera'],['atmos','Capas de la atmósfera (no está a escala)']],p:[
 'Se formó hace unos <b>4.650 millones de años</b>. Es el <b>planeta azul</b> por su agua.',
 'Tiene forma de <b>geoide</b>: achatada por los polos y ensanchada en el Ecuador (12.756 km de diámetro ecuatorial frente a 12.714 km polar).',
 '<b>Geosfera</b>: <b>corteza</b> (continental, gruesa, de granito; oceánica, fina, de basalto), <b>manto</b> (82 % del volumen; en la astenosfera nace el magma) y <b>núcleo</b> de hierro y níquel (el externo, líquido, crea el campo magnético; el interno, sólido).',
 '<b>Hidrosfera</b>: cubre el <b>71 %</b> de la superficie. El <b>97 %</b> del agua es salada y solo el 3 % dulce.',
 '<b>Atmósfera</b>: 78 % nitrógeno, 21 % oxígeno. Capas: <b>troposfera</b> (0-12 km, el tiempo meteorológico), <b>estratosfera</b> (capa de <b>ozono</b>), <b>mesosfera</b> (estrellas fugaces), <b>termosfera</b> (auroras, ondas de radio) y <b>exosfera</b>.'],
 truco:'Capas de la atmósfera de abajo arriba: «<b>T</b>odos <b>E</b>scuchamos <b>M</b>úsica <b>T</b>an <b>E</b>mocionados» (troposfera, estratosfera, mesosfera, termosfera, exosfera).'},
{id:'u5',t:2,n:'Movimientos de la Tierra y la Luna',s:'Días, años, estaciones y fases',figs:[['orbita','La traslación y las estaciones']],p:[
 '<b>Rotación</b>: la Tierra gira sobre su eje (inclinado <b>23º 27\'</b>), de <b>oeste a este</b>, en unas <b>24 horas</b>. Provoca el <b>día y la noche</b>, el efecto Coriolis y los <b>24 husos horarios</b> de 15º.',
 '<b>Traslación</b>: vuelta alrededor del Sol en <b>365 días, 5 h, 48 min y 46 s</b>. Por esas casi 6 horas, cada 4 años hay un año <b>bisiesto</b> de 366 días. Provoca las <b>estaciones</b>.',
 '<b>Solsticios</b> (21 de junio y 21 de diciembre): el Sol cae vertical sobre los <b>trópicos</b>. <b>Equinoccios</b> (21 de marzo y 23 de septiembre): sobre el <b>Ecuador</b>; el día y la noche duran 12 horas.',
 'La <b>Luna</b> no tiene atmósfera ni agua líquida. Tarda <b>27 días y 7 horas</b> en girar, y por eso vemos siempre la misma cara.',
 'Fases: <b>nueva</b>, <b>cuarto creciente</b> (forma de D), <b>llena</b> y <b>cuarto menguante</b> (forma de C).',
 '<b>Eclipse solar</b>: la Luna se pone entre el Sol y la Tierra. <b>Eclipse lunar</b>: la Tierra se pone entre el Sol y la Luna. Las <b>mareas</b> se deben a la atracción de la Luna y el Sol.'],
 truco:'«La Luna es <b>mentirosa</b>»: cuando parece una <b>C</b> está <b>decreciendo</b> (menguante) y cuando parece una <b>D</b> está <b>creciendo</b>. Rotación = <b>día</b>; traslación = <b>año</b>.'},
{id:'u6',t:2,n:'Representar la Tierra',s:'Coordenadas, mapas y proyecciones',figs:[['mapa','Paralelos y meridianos',[null,true]],['proyec','Tipos de proyección']],p:[
 '<b>Paralelos</b>: círculos paralelos al Ecuador. El <b>Ecuador (0º)</b> divide la Tierra en hemisferio <b>Norte o septentrional</b> y <b>Sur o meridional</b>. Otros: trópicos y círculos polares.',
 '<b>Meridianos</b>: semicírculos que van de polo a polo. El de referencia es el de <b>Greenwich (0º)</b>.',
 '<b>Latitud</b>: distancia al Ecuador, de <b>0º a 90º Norte o Sur</b>. <b>Longitud</b>: distancia a Greenwich, de <b>0º a 180º Este u Oeste</b>.',
 '<b>Cartografía</b>: la técnica de hacer mapas. Como no se puede aplanar una esfera sin deformarla, se usan <b>proyecciones</b>: <b>cilíndrica</b> (Mercator, buena para navegar, deforma los polos), <b>cónica</b> (latitudes medias, como Europa) y <b>acimutal</b> (un plano que toca un punto, normalmente un polo).',
 '<b>Planos</b>: lugares pequeños (una casa, un barrio). <b>Mapas</b>: zonas grandes; pueden ser <b>topográficos</b> (relieve) o <b>temáticos</b> (clima, población…).',
 'Todo mapa necesita <b>escala</b> (numérica, como 1:50.000, o gráfica) y <b>leyenda</b> (qué significa cada color y símbolo).',
 'Tecnología: <b>fotografía aérea</b>, <b>teledetección</b> por satélite, <b>GPS</b> y <b>SIG</b> (sistemas de información geográfica).'],
 truco:'<b>Latitud</b>: sube y baja (Norte/Sur), hasta 90º. <b>Longitud</b> es más «larga»: va a los lados (Este/Oeste) y llega hasta 180º.'},
];

h3:[['t','¿Qué cambio en África favoreció la aparición de los homínidos hace unos 6 millones de años?','El clima se secó y la selva dio paso a la sabana',['Llegó una glaciación','Un volcán cubrió África','El mar inundó la sabana'],'Algunos primates se adaptaron a la sabana: eran los primeros homínidos.'],
 ['t','¿Qué homínido fue el primero en andar sobre dos pies?','Australopithecus',['Homo habilis','Homo sapiens','Homo erectus'],'El Australopithecus adoptó la posición bípeda.'],
 ['t','¿Quién fue el primero del género Homo y el primero en usar herramientas?','Homo habilis',['Australopithecus','Homo erectus','Homo neanderthalensis'],'Habilis: hábil con las herramientas (2,5 millones de años).'],
 ['t','¿Qué especie descubrió el fuego?','Homo erectus',['Homo habilis','Australopithecus','Homo antecessor'],'El Homo erectus (1,7 millones de años) descubrió el fuego.'],
 ['t','¿Qué especie estaba adaptada al frío de la época glacial y convivió con el sapiens?','Homo neanderthalensis',['Homo habilis','Australopithecus','Homo erectus'],'Los neandertales vivieron en Europa, Asia y Oriente Medio.'],
 ['t','¿Dónde se encontró a Lucy, la Australopithecus más famosa?','En Etiopía',['En Atapuerca','En Tanzania','En Turquía'],'Sus restos se descubrieron en 1974 en Etiopía.'],
 ['t','¿Qué hay en Laetoli (Tanzania)?','Huellas de bipedismo de hace 3,75 millones de años',['Las pinturas de Altamira','La primera ciudad del mundo','Restos de Homo antecessor'],'Huellas de tres Australopithecus conservadas en ceniza volcánica.'],
 ['t','¿Cuál de estos NO es uno de los grandes cambios de la hominización?','Aprender a escribir',['El bipedismo','El pulgar oponible','Más capacidad craneal'],'Los cambios fueron cerebro mayor, bipedismo, pulgar oponible y capacidad de hablar.'],
 ['t','¿Qué ventaja tuvo andar sobre dos pies?','Dejar los brazos libres para usar herramientas',['Correr más que los caballos','Ver en la oscuridad','No necesitar comer carne'],'Con las manos libres podían agarrar, transportar y fabricar.'],
 ['t','¿Qué porcentaje de genes neandertales tienen las personas de origen no africano?','Entre un 2 y un 3 %',['Un 50 %','Ninguno','Un 25 %'],'El sapiens se mezcló con otras especies de Homo.'],
 ['v','La hominización fue un camino recto y sin ramas hasta llegar a nosotros.',false,'Falso: fue un camino con bifurcaciones y callejones sin salida; solo el sapiens sobrevivió.'],
 ['v','El Homo antecessor es el antepasado común del Homo sapiens y del neandertal.',true,'Verdadero, según los apuntes.']],
h4:[['t','¿Qué yacimiento de Burgos es clave para conocer la evolución humana?','Atapuerca',['Altamira','Los Millares','El Argar'],'En Atapuerca se descubrió el Homo antecessor.'],
 ['t','¿Qué especie se descubrió en Atapuerca?','Homo antecessor',['Homo habilis','Australopithecus','Homo sapiens'],'Era una especie desconocida, antepasado directo del sapiens.'],
 ['t','¿Qué homínidos llegaron primero a la Península, hace más de un millón de años?','Homo erectus',['Homo sapiens','Neandertales','Australopithecus'],'Llegaron desde África.'],
 ['t','¿Cuándo llegó el Homo sapiens a la Península?','Hace unos 40.000 años',['Hace un millón de años','Hace 500.000 años','Hace 4.000 años'],'Convivió un tiempo con los neandertales.'],
 ['t','¿Qué es un bifaz?','Una piedra tallada con forma de almendra',['Un tipo de vasija','Una pintura de dos colores','Un menhir doble'],'Se tallaba por las dos caras hasta darle forma almendrada.'],
 ['t','¿Qué caracteriza a la pintura francocantábrica?','Animales salvajes pintados con naturalismo',['Escenas de caza con figuras humanas esquemáticas','Paisajes con ríos','Retratos de jefes'],'Bisontes, caballos y ciervos muy realistas, como en Altamira.'],
 ['t','¿Qué caracteriza a la pintura levantina?','Escenas de caza dinámicas con figuras humanas esquemáticas',['Animales aislados muy realistas','Mapas de las estrellas','Grandes bisontes de colores'],'Como en El Cogul (Lleida).'],
 ['t','¿Dónde está la cueva de El Cogul, con pintura levantina?','En Lleida',['En Cantabria','En Burgos','En Almería'],'El Cogul está en Lleida.'],
 ['t','¿En qué época se hacían cerámica y monumentos megalíticos, según los apuntes?','En el Neolítico',['En el Paleolítico','En la Edad Media','En la Edad Contemporánea'],'Cerámica y megalitos: Neolítico.'],
 ['v','Los neandertales llegaron a la Península antes que el Homo sapiens.',true,'Verdadero: neandertales hace 90.000 años, sapiens hace 40.000.']],
h5:[['t','¿Qué significa «Paleolítico»?','Piedra antigua',['Piedra nueva','Metal antiguo','Hombre sabio'],'Paleo: antiguo. Lítico: piedra.'],
 ['t','¿Qué material se usaba más para hacer herramientas en el Paleolítico?','El sílex',['El bronce','El hierro','El barro cocido'],'El sílex o pedernal, duro y con bordes cortantes.'],
 ['t','¿Cómo obtenían el alimento los grupos del Paleolítico?','Cazando y recolectando',['Cultivando trigo','Comprándolo en el mercado','Criando ovejas'],'Eran cazadores-recolectores.'],
 ['t','¿Qué significa que eran nómadas?','Que se desplazaban de un lugar a otro buscando alimento',['Que vivían siempre en la misma cueva','Que construían ciudades','Que navegaban en barco'],'No permanecían mucho tiempo en el mismo lugar.'],
 ['t','¿Con qué dos piedras encendían fuego?','Pedernal y pirita',['Granito y basalto','Mármol y yeso','Cobre y estaño'],'Una piedra dura (pedernal) contra otra rica en hierro (pirita).'],
 ['t','¿Cuántas personas tenían los clanes del Paleolítico?','Entre 25 y 50',['Entre 2 y 3','Unas 8.000','Más de mil'],'Clanes de 25 a 50 miembros formados por varias familias.'],
 ['t','¿Qué especie da comienzo al Paleolítico inferior?','Homo habilis',['Homo sapiens','Neandertal','Australopithecus'],'El Paleolítico inferior empieza con el Homo habilis.'],
 ['t','¿Qué ocurre al empezar el Paleolítico superior (40000 a.C.)?','Llega el Homo sapiens a Europa',['Se inventa la agricultura','Aparece el bronce','Se funda Çatalhöyük'],'Paleolítico superior: 40000-10000 a.C.'],
 ['t','¿Qué son las lascas?','Trozos que saltan al golpear una piedra',['Lanzas pequeñas','Pinturas en la pared','Vasijas de barro'],'En la talla por percusión, al golpear el núcleo saltan lascas.'],
 ['t','¿Qué son las azagayas?','Lanzas pequeñas',['Agujas de hueso','Cabañas de ramas','Pinturas de manos'],'Las azagayas eran pequeñas lanzas.'],
 ['t','¿Qué técnica de talla da formas más afiladas y precisas?','La talla por presión',['La talla por percusión','La fundición','El pulido'],'Por presión se elige mejor el punto exacto de donde sale la lasca.'],
 ['t','¿Qué arma aparece en el Paleolítico superior?','El arco y las flechas',['La espada de hierro','El cañón','El escudo de bronce'],'Arcos y flechas: Paleolítico superior.'],
 ['t','¿Por qué se dice que su forma de vida era depredadora?','Porque consumían los recursos sin reponerlos',['Porque eran muy violentos','Porque comían solo carne cruda','Porque cultivaban demasiado'],'Cuando agotaban un lugar, se iban a otro.'],
 ['t','¿Dónde se encontró la Venus de Willendorf?','En Austria',['En Cantabria','En Etiopía','En Turquía'],'Mide 11 cm y se halló en 1908.'],
 ['v','En el Paleolítico, las mujeres también cazaban.',true,'Verdadero: no había una división de tareas por géneros.'],
 ['v','Los hombres del Paleolítico vivían siempre dentro de las cuevas.',false,'Falso: es un estereotipo. Las cuevas eran refugios temporales; también hacían cabañas.']],
h6:[['t','¿Qué significa «Neolítico»?','Piedra nueva',['Piedra antigua','Nuevo metal','Hombre nuevo'],'Neo: nuevo. La «nueva piedra» es la piedra pulida.'],
 ['t','¿Dónde nació la revolución neolítica?','En el Creciente Fértil (Oriente Próximo)',['En la cornisa cantábrica','En el sur de África','En América'],'Entre Oriente Próximo y la meseta iraní, hacia el 10000 a.C.'],
 ['t','¿Qué cambio en la forma de vida trajo la agricultura?','El sedentarismo: vivir en poblados permanentes',['El nomadismo','La vida en barcos','El fin de la ganadería'],'Cuidar campos y ganado obligaba a quedarse.'],
 ['t','¿Qué es el excedente?','Lo que sobra de la producción',['Un tipo de cerámica','Una herramienta de piedra','Un clan nómada'],'Con el excedente apareció el comercio.'],
 ['t','¿Qué es la cerámica cardial?','Cerámica decorada con conchas de berberecho',['Cerámica pintada de rojo','Vasijas de bronce','Platos de madera'],'Recibe su nombre de los cárdidos, la familia del berberecho.'],
 ['t','¿Cuál es considerada la primera ciudad del mundo?','Çatalhöyük (Turquía)',['Atapuerca (Burgos)','Los Millares (Almería)','Laetoli (Tanzania)'],'Hace 9.000 años, unas 8.000 personas, con entrada por el techo.'],
 ['t','¿Qué era el cultivo itinerante?','Quemar una zona, cultivarla hasta agotarla y trasladarse',['Regar con canales','Cultivar en barcos','Plantar solo árboles'],'Las cenizas fertilizaban el suelo.'],
 ['t','¿Qué era el molino de mano?','Una piedra cóncava para moler el grano con otra piedra',['Un molino de viento','Una rueda de carro','Un horno'],'Apareció en el Neolítico.'],
 ['t','¿Qué creencia se atribuye al Neolítico?','El animismo: todo tenía alma',['El monoteísmo','La astrología','No tenían creencias'],'Animales, plantas, piedras o montañas tenían alma.'],
 ['t','¿Qué animales se domesticaron en el Neolítico?','Ovejas, cabras, vacas y caballos',['Leones y tigres','Mamuts y bisontes','Gatos y loros'],'Aprovechaban carne, leche, pieles y tendones.'],
 ['t','¿Por qué apareció la artesanía?','Porque no hacía falta que todos trabajaran el campo',['Porque se acabó la comida','Porque llegaron los romanos','Porque se inventó la escritura'],'Más comida permitió la especialización del trabajo.'],
 ['v','En el Neolítico desaparecieron por completo la caza y la recolección.',false,'Falso: quedaron como actividades complementarias.'],
 ['v','Un crómlech es un conjunto de menhires dispuestos en círculo.',true,'Verdadero, como Stonehenge.']],
h7:[['t','¿De qué está hecho el bronce?','De cobre y estaño',['De hierro y oro','De cobre y hierro','De plata y estaño'],'Es una aleación de cobre y estaño.'],
 ['t','¿Por qué el bronce impulsó el comercio a larga distancia?','Porque el cobre y el estaño no estaban en el mismo lugar',['Porque el bronce flotaba','Porque se usaba como moneda','Porque solo había bronce en América'],'Había que traer los metales de lejos.'],
 ['t','Ordena: ¿qué etapa va primero?','Edad del Cobre',['Edad del Bronce','Edad del Hierro','Todas a la vez'],'Cobre (5000), Bronce (1800), Hierro (750 a.C.).'],
 ['t','¿Cuál fue el primer metal que se utilizó?','El oro',['El hierro','El bronce','El acero'],'Se golpeaba hasta conseguir láminas finas para joyas.'],
 ['t','¿En qué provincia está Los Millares?','Almería',['Burgos','Cantabria','Lleida'],'Cultura de Los Millares, hacia el 2400 a.C.'],
 ['t','¿Qué cultura de la Edad del Bronce destacó en el sudeste peninsular?','El Argar',['Los Millares','Çatalhöyük','Atapuerca'],'El Argar: 2250-1600 a.C.'],
 ['t','¿Qué hacían con los muertos en la cultura de los campos de urnas?','Los incineraban y guardaban las cenizas en urnas',['Los momificaban','Los enterraban en dólmenes','Los dejaban en cuevas pintadas'],'De ahí el nombre: campos de urnas.'],
 ['t','¿Cómo eran los poblados de la Edad de los Metales?','En lugares altos y rodeados de murallas',['Cabañas de ramas que se trasladaban','Ciudades sin calles con entrada por el techo','Cuevas con pinturas'],'Así se vigilaban y defendían mejor.'],
 ['t','¿Qué técnica consiste en calentar el metal hasta hacerlo líquido y echarlo en moldes?','La fundición',['El batido','El repujado','La talla'],'Luego se dejaba enfriar y se pulía.'],
 ['t','¿Qué técnica decora una lámina de metal con un dibujo en relieve?','El repujado',['La fundición','La forja','La percusión'],'Apareció con la orfebrería de la Edad del Bronce.'],
 ['t','¿Qué grupo pertenecía a las clases privilegiadas?','Jefes, sacerdotes y guerreros',['Campesinos','Alfareros','Tejedores'],'El resto era el pueblo.'],
 ['t','¿Qué invento revolucionó la navegación?','La vela',['La rueda','El arado','El molino de mano'],'Mejoró el transporte por ríos y mares.'],
 ['t','¿Qué eran los ajuares funerarios?','Objetos que se enterraban con los muertos',['Herramientas de labranza','Vestidos de boda','Murallas de los poblados'],'Los más ricos se enterraban con joyas, armas y cerámica.'],
 ['v','El hierro es más duro y además más abundante que el cobre y el estaño.',true,'Verdadero, según los apuntes: muy resistente y abundante.']],
u1:[['t','¿Hace cuánto tiempo ocurrió el Big Bang?','Unos 13.800 millones de años',['Unos 4.600 millones de años','Unos 6 millones de años','Unos 10.000 años'],'4.600 millones es la edad del Sistema Solar.'],
 ['t','¿Qué elementos se formaron primero tras el Big Bang?','Hidrógeno y helio',['Hierro y níquel','Oxígeno y nitrógeno','Cobre y estaño'],'Luego la gravedad formó estrellas y galaxias.'],
 ['t','¿Cómo se llama el punto inicial donde estaba concentrado todo?','Singularidad',['Geoide','Eclíptica','Astenosfera'],'Un punto de densidad y temperatura infinitas.'],
 ['t','¿Qué es una cosmogonía?','Una explicación mítica o religiosa del origen del mundo',['Un telescopio antiguo','Un tipo de estrella','Un mapa del cielo'],'Las civilizaciones antiguas crearon sus cosmogonías.'],
 ['t','Para los griegos, ¿qué era el «kósmos»?','El orden y la armonía del cielo',['El desorden','Un dios del mar','Un planeta'],'Lo contrario era el «khaos».'],
 ['t','¿Dónde nació la astrología?','En Mesopotamia',['En Grecia','En Egipto','En Roma'],'Hacia el III milenio a.C.; dividió el cielo en 12 constelaciones del zodiaco.'],
 ['t','¿Qué estrella indica el Norte?','La Estrella Polar',['El Sol','Sirio','Venus'],'Está en la Osa Menor.'],
 ['t','¿Qué tipo de galaxia es la Vía Láctea?','Espiral barrada',['Elíptica','Irregular','Esférica'],'Su nombre significa «camino de leche».'],
 ['t','¿Qué cuerpo celeste tiene luz propia?','Una estrella',['Un planeta','Un satélite','Un asteroide'],'Las estrellas producen luz y calor por fusión nuclear.'],
 ['t','¿Qué forma un cometa al acercarse al Sol?','Una cabellera y una cola',['Anillos','Un satélite','Un cráter'],'El calor sublima sus hielos.'],
 ['t','¿Qué es un satélite?','Un astro que gira alrededor de un planeta',['Una estrella pequeña','Un cometa sin cola','Un planeta enano'],'Como la Luna alrededor de la Tierra.'],
 ['v','La astrología es una ciencia.',false,'Falso: no tiene validez científica, aunque impulsó las primeras observaciones del cielo.']],
u2:[['t','¿Quién defendió el modelo geocéntrico?','Ptolomeo',['Copérnico','Galileo','Newton'],'Ptolomeo, en el siglo II d.C.'],
 ['t','¿Qué dice el modelo heliocéntrico?','Que el Sol está en el centro',['Que la Tierra está en el centro','Que la Luna está en el centro','Que no hay centro'],'Lo propuso Copérnico en el siglo XVI.'],
 ['t','¿Quién usó por primera vez el telescopio para observar el cielo?','Galileo Galilei',['Ptolomeo','Kepler','Heródoto'],'Vio las fases de Venus y los satélites de Júpiter.'],
 ['t','¿Qué descubrió Kepler?','Que las órbitas de los planetas son elipses',['La gravedad','El telescopio','El Big Bang'],'No son círculos perfectos.'],
 ['t','¿Qué formuló Newton?','La ley de la gravitación universal',['El modelo geocéntrico','Las fases de la Luna','El zodiaco'],'Explica la causa de los movimientos de los planetas.'],
 ['t','¿Con qué se alineaban Stonehenge y los dólmenes de Antequera?','Con los solsticios y equinoccios',['Con la Estrella Polar','Con Júpiter','Con el meridiano de Greenwich'],'Servían para regular la siembra y la cosecha.'],
 ['t','¿En qué siglo vivió Copérnico?','En el siglo XVI',['En el siglo II','En el siglo XX','En el siglo XII'],'Publicó «De revolutionibus orbium coelestium».'],
 ['v','Galileo vio con su telescopio los satélites de Júpiter.',true,'Verdadero.']],
u3:[['t','¿Cuántos planetas tiene el Sistema Solar?','Ocho',['Nueve','Siete','Doce'],'Plutón pasó a ser planeta enano en 2006.'],
 ['t','¿Cuál es el planeta más cercano al Sol?','Mercurio',['Venus','Marte','Neptuno'],'«Mi Vieja Tía…»'],
 ['t','¿Cuál de estos es un planeta exterior o joviano?','Saturno',['Marte','Venus','Mercurio'],'Exteriores: Júpiter, Saturno, Urano y Neptuno.'],
 ['t','¿Qué planeta podría flotar en el agua por su baja densidad?','Saturno',['La Tierra','Mercurio','Marte'],'Su densidad es de 0,69 g/cm³.'],
 ['t','¿Dónde está el cinturón de asteroides?','Entre Marte y Júpiter',['Entre la Tierra y Marte','Más allá de Neptuno','Alrededor del Sol, muy cerca'],'La gravedad de Júpiter impidió que formaran un planeta.'],
 ['t','¿Dónde está el cinturón de Kuiper?','Más allá de Neptuno',['Entre Marte y Júpiter','Dentro de la Tierra','Entre Venus y la Tierra'],'Con fragmentos helados y cometas.'],
 ['t','¿Cuál de estos es un planeta enano?','Plutón',['Neptuno','Mercurio','Júpiter'],'También Ceres y Eris.'],
 ['t','¿Qué porcentaje de la masa del Sistema Solar tiene el Sol?','El 99,86 %',['La mitad','El 25 %','El 73 %'],'Por eso controla el sistema con su gravedad.'],
 ['t','¿De qué está hecho sobre todo el Sol?','De hidrógeno y helio',['De hierro y níquel','De roca y agua','De oxígeno'],'73 % hidrógeno y 25 % helio.'],
 ['t','¿Hace cuánto se formó el Sistema Solar?','Unos 4.600 millones de años',['Unos 13.800 millones de años','Unos 6 millones de años','Unos 2.000 años'],'A partir de una nube de gas y polvo.'],
 ['t','¿En qué zona de la Vía Láctea está el Sistema Solar?','En el brazo de Orión',['En el centro de la galaxia','En la Osa Menor','En el cinturón de Kuiper'],'Una zona periférica de la galaxia.'],
 ['v','Los planetas interiores tienen muchos anillos y satélites.',false,'Falso: eso es de los exteriores. Los interiores tienen pocos o ningún satélite y no tienen anillos.']],
u4:[['t','¿Qué forma tiene la Tierra?','Geoide: achatada por los polos',['Una esfera perfecta','Un cubo','Un disco plano'],'Ensanchada en el Ecuador por la rotación.'],
 ['t','¿Qué capa de la geosfera ocupa el 82 % del volumen?','El manto',['La corteza','El núcleo','La hidrosfera'],'En su parte superior está la astenosfera, de donde procede el magma.'],
 ['t','¿Qué capa genera el campo magnético de la Tierra?','El núcleo externo, que es líquido',['La corteza','La estratosfera','El manto inferior'],'Sus corrientes crean la magnetosfera.'],
 ['t','¿De qué está hecho el núcleo?','De hierro y níquel',['De granito','De hidrógeno y helio','De basalto'],'El interno es sólido por la enorme presión.'],
 ['t','¿Qué parte de la superficie cubre la hidrosfera?','El 71 %',['El 97 %','El 21 %','La mitad'],'Y el 97 % de esa agua es salada.'],
 ['t','¿Qué porcentaje del agua del planeta es dulce?','Solo el 3 %',['El 71 %','El 50 %','El 97 %'],'Está en glaciares, acuíferos, lagos y ríos.'],
 ['t','¿Qué gas abunda más en la atmósfera?','El nitrógeno',['El oxígeno','El dióxido de carbono','El helio'],'78 % nitrógeno y 21 % oxígeno.'],
 ['t','¿En qué capa está la capa de ozono?','En la estratosfera',['En la troposfera','En la mesosfera','En la exosfera'],'El ozono absorbe la radiación ultravioleta.'],
 ['t','¿En qué capa ocurren la lluvia, el viento y las nubes?','En la troposfera',['En la estratosfera','En la termosfera','En la exosfera'],'La troposfera va de 0 a 12 km.'],
 ['t','¿En qué capa se forman las estrellas fugaces?','En la mesosfera',['En la troposfera','En la exosfera','En la estratosfera'],'El roce desintegra los meteoroides pequeños.'],
 ['t','¿En qué capa se forman las auroras polares?','En la termosfera',['En la troposfera','En la mesosfera','En la estratosfera'],'También refleja las ondas de radio.'],
 ['t','¿Qué tipo de corteza es más gruesa y forma los continentes?','La continental',['La oceánica','La basáltica','El manto'],'La oceánica es fina y de basalto.']],
u5:[['t','¿Qué movimiento provoca el día y la noche?','La rotación',['La traslación','Las mareas','Los eclipses'],'Rotación: la Tierra gira sobre sí misma.'],
 ['t','¿Qué movimiento provoca las estaciones del año?','La traslación, junto con la inclinación del eje',['La rotación','Las mareas','El efecto Coriolis'],'La Tierra da una vuelta al Sol con el eje inclinado.'],
 ['t','¿En qué sentido gira la Tierra?','De oeste a este',['De este a oeste','De norte a sur','No gira'],'Por eso el Sol parece salir por el este.'],
 ['t','¿Cuántos husos horarios hay?','24',['12','365','15'],'Cada uno de 15º de longitud.'],
 ['t','¿Cada cuánto hay un año bisiesto?','Cada 4 años',['Cada año','Cada 10 años','Cada 100 años'],'Por las casi 6 horas que sobran cada año.'],
 ['t','¿Qué ocurre en los equinoccios?','El día y la noche duran lo mismo',['Es el día más largo del año','Hay eclipse','No sale el Sol'],'21 de marzo y 23 de septiembre: el Sol cae vertical sobre el Ecuador.'],
 ['t','¿Cuándo es el solsticio de verano en el hemisferio norte?','En torno al 21 de junio',['El 21 de marzo','El 23 de septiembre','El 1 de enero'],'El de invierno, hacia el 21 de diciembre.'],
 ['t','¿Qué inclinación tiene el eje de la Tierra?','23º 27\'',['45º','90º','0º'],'Esa inclinación causa las estaciones.'],
 ['t','¿Por qué vemos siempre la misma cara de la Luna?','Porque tarda lo mismo en girar sobre sí misma que en dar la vuelta a la Tierra',['Porque no gira','Porque la Tierra no gira','Porque la otra cara no existe'],'Unos 27 días y 7 horas.'],
 ['t','¿Qué forma tiene la Luna en cuarto creciente?','La de una D',['La de una C','Un círculo completo','No se ve'],'«La Luna es mentirosa»: D de… creciente.'],
 ['t','¿Qué ocurre en un eclipse de Sol?','La Luna se pone entre el Sol y la Tierra',['La Tierra se pone entre el Sol y la Luna','El Sol se apaga','La Luna se aleja'],'En el lunar, la Tierra se interpone.'],

function totalStars(){return Object.values(S.stars).reduce((a,b)=>a+b,0)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function stopTimers(){if(st.timer){clearInterval(st.timer);st.timer=null}}
function recordQ(id,ok){const s=S.q[id]||(S.q[id]={ok:0,n:0});s.n++;if(ok)s.ok++}
function weight(q){const s=S.q[q.id];if(!s)return 3;return Math.max(.4,1+2*(s.n-s.ok)-.6*s.ok)}
function wpick(list,n){const out=[];const pool=[...list];while(out.length<n&&pool.length){let r=Math.random()*pool.reduce((a,q)=>a+weight(q),0);let k=0;for(;k<pool.length;k++){r-=weight(pool[k]);if(r<=0)break}out.push(pool.splice(Math.min(k,pool.length-1),1)[0])}return out}

function startQuiz(cfg){st.view=Object.assign(cfg,{idx:0,res:[]});drawQ()}
function drawQ(){const V=st.view;const q=V.list[V.idx];const opts=q.t==='test'?shuffle([q.ok,...q.no]):['Verdadero','Falso'];V.opts=opts;V.answered=false;
 const head=V.kind==='reto'?`${stOf(V.id).n}`:`Prueba · ${q.st[0]==='h'?'Tema 1':'Tema 2'}`;
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>${head}</span><span>${V.idx+1} / ${V.list.length}</span></div>
 <div class="pbar">${V.list.map((_,i)=>`<i class="${i<V.res.length?(V.res[i]?'okk':'ko'):i===V.idx?'on':''}"></i>`).join('')}</div>
 <p class="q">${q.t==='vf'?'¿Verdadero o falso? ':''}${esc(q.q)}</p>
 <div class="opts ${q.t==='vf'?'two':''}" id="opts">${opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${esc(o)}</button>`).join('')}</div>
 <div id="after"></div><div class="stamp" id="stamp" hidden></div></div>`;
 $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerQ(+b.dataset.i))}
function answerQ(i){const V=st.view;if(V.answered)return;V.answered=true;const q=V.list[V.idx];const okIdx=q.t==='test'?V.opts.indexOf(q.ok):(q.ok?0:1);const ok=i===okIdx;
 $('#opts').querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===okIdx)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
 V.res.push(ok);recordQ(q.id,ok);save();const sp=$('#stamp');sp.hidden=false;sp.className='stamp '+(ok?'b':'mm');sp.textContent=ok?'B':'M';
 const last=V.idx===V.list.length-1;
 $('#after').innerHTML=`<p class="verdict ${ok?'b':'mm'}">${ok?pick(['¡Bien!','¡Exacto!','¡Muy bien!','¡Eso es!']):'No es correcto.'}</p><p class="exp">${q.exp}</p><div class="actions" style="margin-top:12px"><button class="primary" id="nx" type="button">${last?'Ver resultado':'Siguiente'}</button></div>`;
 $('#nx').onclick=()=>{if(last)finishQuiz();else{V.idx++;drawQ()}};$('#nx').focus({preventScroll:true})}
function finishQuiz(){const V=st.view;const n=V.res.filter(Boolean).length;
 if(V.kind==='reto'){const stars=n>=5?3:n===4?2:n===3?1:0;const prev=S.stars[V.id]||0;if(stars>prev){S.stars[V.id]=stars;save();renderScore();renderProgress()}
  const s=stOf(V.id);const next=ST[ST.indexOf(s)+1];
  $('#main').innerHTML=`<div class="sheet" style="align-items:center;text-align:center"><div class="meta" style="align-self:stretch"><span>${s.n}</span></div>
  <h2>${n} de 5 aciertos</h2><div class="bigstars">${[1,2,3].map(k=>star(k<=stars,k<=stars?'st-on-anim':'')).join('')}</div>
  <p>${stars===3?'¡Estación completada con todas las estrellas!':stars?`Has ganado ${stars} ${stars===1?'estrella':'estrellas'}. ${stars>prev?'¡Nuevo récord!':''} Repite el reto para conseguir las 3.`:'Repasa la ficha y vuelve a intentarlo: las preguntas que fallas saldrán más.'}${stars<=prev&&prev?` Tu mejor marca aquí: ${prev} ${prev===1?'estrella':'estrellas'}.`:''}</p>
  <div class="actions" style="justify-content:center"><button class="primary" id="again" type="button">Repetir el reto</button><button class="ghost" id="ficha" type="button">Ver la ficha</button>${next&&temaOk(next.t)?`<button class="ghost" id="next" type="button">Siguiente estación</button>`:''}<button class="ghost" id="mapa" type="button">Mapa</button></div></div>`;
  $('#again').onclick=()=>startQuiz({kind:'reto',id:V.id,list:wpick(QS.filter(q=>q.st===V.id),5)});$('#ficha').onclick=()=>openStation(V.id);$('#mapa').onclick=()=>go();if($('#next'))$('#next').onclick=()=>openStation(next.id);
  if(stars===3&&prev<3&&ST.every(x=>S.stars[x.id]===3))toast('¡Has conseguido las 39 estrellas! Expedición completa.');}
 else{const nota=Math.round(n/V.list.length*100)/10;S.games.prueba=Math.max(S.games.prueba||0,nota);save();renderProgress();
  $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Prueba terminada</span></div><h2>Tu nota</h2><div class="grade">${nota.toLocaleString('es-ES')}</div>
  <ul class="qlist">${V.list.map((q,i)=>`<li><b style="color:var(${V.res[i]?'--ok':'--marker'})">${V.res[i]?'B':'M'}</b><span>${esc(q.q)} <small class="note">(${stOf(q.st).n})</small></span></li>`).join('')}</ul>
  <p>${nota>=9?'¡Sobresaliente!':nota>=5?'¡Aprobado! Mira las M y repasa esas estaciones.':'Repasa las estaciones de las preguntas marcadas con M.'}</p>
  <div class="actions"><button class="primary" id="again" type="button">Otra prueba</button><button class="ghost" id="mapa" type="button">Ir al mapa</button></div></div>`;
  $('#again').onclick=renderPrueba;$('#mapa').onclick=()=>setTab('mapa')}}

function gTL(){const pool=EVENTS.filter(e=>st.tema==='all'||e[3]===0||e[3]===+st.tema);const sel=shuffle(pool).slice(0,6);const order=[...sel].sort((a,b)=>a[1]-b[1]);let placed=0,err=0;
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Línea del tiempo</span><span id="hud">Errores: 0</span></div>

  if(placed===order.length){const better=setBest('tl',err,true);gameEnd(err?`¡Hecho con ${err} ${err===1?'error':'errores'}!`:'¡Perfecto, sin errores!',`${better&&S.games.tl===err?'¡Es tu mejor marca! ':''}Cada partida trae acontecimientos distintos.`,gTL)}}

/* Parejas */
const PAIRS=[['Australo&shy;pithecus','Primero en andar sobre dos pies'],['H. habilis','Primeras herramientas'],['H. erectus','Descubrió el fuego'],['H. antecessor','Hallado en Atapuerca'],['H. heidel&shy;bergensis','Llegó a la Península hace 500.000 años'],['Neandertal','Adaptado al frío glacial'],['H. sapiens','Nuestra especie']];
function gMem(){const pairs=shuffle(PAIRS).slice(0,6);const cards=shuffle(pairs.flatMap((p,i)=>[{i,txt:p[0],sp:true},{i,txt:p[1]}]));let open=[],tries=0,done=0,lock=false;
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Parejas de homínidos</span><span id="hud">Intentos: 0</span></div><p class="q">Encuentra cada especie y lo que la caracteriza.</p>
 <div class="mem" id="mem">${cards.map((c,k)=>`<button class="card3d" type="button" data-k="${k}" aria-label="Carta ${k+1}"><span class="in"><span class="f">?</span><span class="b ${c.sp?'sp':''}">${c.txt}</span></span></button>`).join('')}</div><div id="gend"><div class="actions">${backBtn()}</div></div></div>`;wireBack();
 $('#mem').querySelectorAll('.card3d').forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('up')||b.classList.contains('done'))return;b.classList.add('up');b.setAttribute('aria-label',cards[+b.dataset.k].txt.replace(/&shy;/g,''));open.push(b);
  if(open.length===2){tries++;$('#hud').textContent='Intentos: '+tries;const[a,c]=open;const A=cards[+a.dataset.k],C=cards[+c.dataset.k];
   if(A.i===C.i&&A.sp!==C.sp){a.classList.add('done');c.classList.add('done');open=[];done++;if(done===pairs.length){const better=setBest('mem',tries,true);gameEnd(`¡Completado en ${tries} intentos!`,`${better?'¡Es tu mejor marca! ':''}El mínimo posible es 6.`,gMem)}}
   else{lock=true;setTimeout(()=>{a.classList.remove('up');c.classList.remove('up');a.setAttribute('aria-label','Carta');c.setAttribute('aria-label','Carta');open=[];lock=false},1100)}}})}

/* ¿De qué época es? */
const ERAS=['Paleolítico','Neolítico','Metales'];
const ITEMS=[['Piedra tallada',0],['Nomadismo',0],['Cazadores-recolectores',0],['Bifaz',0],['Venus de Willendorf',0],['Pinturas de Altamira',0],['Descubrimiento del fuego',0],['Azagayas',0],['Talla por percusión',0],['Clanes de 25 a 50 personas',0],['Aparece el arco y las flechas',0],['Agujas de hueso y pieles',0],
['Piedra pulida',1],['Agricultura',1],['Ganadería',1],['Sedentarismo',1],['Cerámica cardial',1],['Molino de mano',1],['Hoz con dientes de sílex',1],['Çatalhöyük',1],['Primeros poblados permanentes',1],['Menhires y dólmenes',1],['Animismo',1],['Cultivo itinerante',1],['Tejidos de lino y lana',1],
['Bronce: cobre + estaño',2],['Fundición en moldes',2],['La rueda',2],['La vela',2],['Arado tirado por animales',2],['Poblados amurallados en alto',2],['Los Millares',2],['El Argar',2],['Campos de urnas',2],['Jefes, sacerdotes y guerreros',2],['Orfebrería y repujado',2],['Ajuares funerarios',2],['Casas de adobe',2]];
function gCla(){let pts=0,streak=0,left=60,cur=null,deck=shuffle(ITEMS),k=0,miss=[];
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>¿De qué época es?</span><span>60 segundos</span></div><div class="hud"><span id="pts">0 puntos</span><span id="stk"></span><span id="sec">60 s</span></div><div class="timer"><i id="bar" style="width:100%"></i></div>
 <p class="bigq" id="item">Pulsa «Empezar»</p><div class="opts two" id="opts" hidden>${ERAS.map((e,i)=>`<button class="opt" type="button" data-i="${i}">${e}</button>`).join('')}</div>
 <div id="gend"><div class="actions"><button class="primary" id="start" type="button">Empezar</button>${backBtn()}</div></div></div>`;wireBack();
 const next=()=>{if(k>=deck.length){deck=shuffle(ITEMS);k=0}cur=deck[k++];$('#item').textContent=cur[0]};
 $('#start').onclick=()=>{$('#opts').hidden=false;$('#gend').innerHTML='';next();st.timer=setInterval(()=>{left--;$('#sec').textContent=left+' s';$('#bar').style.width=(left/60*100)+'%';if(left<=0){stopTimers();end()}},1000)};
 $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!cur||left<=0)return;const ok=+b.dataset.i===cur[1];const sheet=$('#item');sheet.classList.remove('flash-ok','flash-ko');void sheet.offsetWidth;
  if(ok){streak++;pts+=streak>=5?2:1}else{streak=0;miss.push(cur)}sheet.classList.add(ok?'flash-ok':'flash-ko');$('#pts').textContent=pts+' puntos';$('#stk').textContent=streak>=5?`¡Racha ×2!`:streak>=2?`Racha ${streak}`:'';next()});
 function end(){$('#opts').hidden=true;$('#item').textContent='¡Tiempo!';const better=setBest('cla',pts,false);const uniq=[...new Map(miss.map(m=>[m[0],m])).values()];
  gameEnd(`${pts} puntos`,`${better?'¡Nueva mejor marca! ':''}${uniq.length?'Para repasar: '+uniq.slice(0,6).map(m=>`<b>${esc(m[0])}</b> (${ERAS[m[1]]})`).join(', ')+'.':'¡Sin fallos!'} Con 5 aciertos seguidos cada uno vale doble.`,gCla)}}

/* Sistema Solar */
function gSol(){let placed=0,err=0,phase=1;const idx=shuffle([0,1,2,3,4,5,6,7]);
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Ordena el Sistema Solar</span><span id="hud">Errores: 0</span></div>
 <p class="q" id="ask">Toca los planetas en orden, empezando por el más cercano al Sol.</p>
 <div class="order" id="ord"><span style="background:#f9c22e;color:#3a2a00">Sol</span></div>
 <div class="planets" id="pls">${idx.map(i=>`<button class="pl" type="button" data-i="${i}">${D.planet(i,Math.max(10,D.PLANETS[i][1]*1.2))}<span>${D.PLANETS[i][0]}</span></button>`).join('')}</div>
 <div id="gend"><div class="actions">${backBtn()}</div></div></div>`;wireBack();
 $('#pls').querySelectorAll('.pl').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(phase===1){if(b.classList.contains('placed'))return;if(i===placed){placed++;b.classList.add('placed');$('#ord').insertAdjacentHTML('beforeend',`<span>${D.PLANETS[i][0]}</span>`);if(placed===8)phase2()}else{err++;$('#hud').textContent='Errores: '+err;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}});
 function phase2(){phase=2;let k=0;const ord=shuffle([0,1,2,3,4,5,6,7]);
  const ask=()=>{if(k>=8){const better=setBest('sol',err,true);gameEnd(err?`¡Hecho con ${err} ${err===1?'error':'errores'}!`:'¡Perfecto!',`${better?'¡Es tu mejor marca! ':''}Recuerda: «Mi Vieja Tía María Jamás Supo Usar Netflix».`,gSol);return}
   const i=ord[k];$('#ask').innerHTML=`Segunda parte: ¿<b>${D.PLANETS[i][0]}</b> es un planeta interior o exterior?`;
   $('#gend').innerHTML=`<div class="opts two">${['Interior (rocoso)','Exterior (gaseoso)'].map((t,j)=>`<button class="opt" type="button" data-j="${j}">${t}</button>`).join('')}</div>`;
   $('#gend').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=(+b.dataset.j)===(i<4?0:1);if(!ok){err++;$('#hud').textContent='Errores: '+err;b.classList.add('wrong');return}b.classList.add('right');k++;setTimeout(ask,450)})};ask()}}

/* Capas de la Tierra */
const CAPQ=[['atm','tropo','¿Dónde ocurren la lluvia, el viento y las nubes?'],['atm','estrato','¿Dónde está la capa de ozono?'],['atm','meso','¿Dónde se forman las estrellas fugaces?'],['atm','termo','¿Dónde se forman las auroras polares?'],['atm','exo','¿Qué capa es la transición hacia el espacio?'],['atm','termo','¿Qué capa refleja las ondas de radio?'],['atm','tropo','¿En qué capa está el 80 % del aire y la temperatura baja con la altura?'],
 ['geo','corteza','¿Qué capa forma los continentes y los fondos marinos?'],['geo','manto','¿Qué capa ocupa el 82 % del volumen de la Tierra?'],['geo','manto','¿En qué capa está la astenosfera, de donde sale el magma?'],['geo','ext','¿Qué capa es líquida y genera el campo magnético?'],['geo','int','¿Qué capa es sólida por la enorme presión?'],['geo','corteza','¿En qué capa hay granito en los continentes y basalto en los océanos?']];
const CAPN={tropo:'Troposfera',estrato:'Estratosfera',meso:'Mesosfera',termo:'Termosfera',exo:'Exosfera',corteza:'Corteza',manto:'Manto',ext:'Núcleo externo',int:'Núcleo interno'};
function gCap(){const qs=shuffle(CAPQ).slice(0,8);let k=0,good=0;
 const draw=()=>{if(k>=qs.length){const better=setBest('cap',good,false);$('#main').querySelector('.tapsvg').innerHTML='';$('#q').textContent='';gameEnd(`${good} de 8`,`${better?'¡Nueva mejor marca! ':''}Truco de la atmósfera: «Todos Escuchamos Música Tan Emocionados».`,gCap);return}
  const [w,ans,txt]=qs[k];$('#cnt').textContent=`${k+1} / 8`;$('#q').textContent=txt;$('#fb').textContent='';$('#fb').className='note';
  $('#draw').innerHTML=svg(w==='atm'?D.atmos(false):D.interiorTap(),null,w==='atm'?'Capas de la atmósfera: toca una':'Capas de la geosfera: toca una');
  let tried=false;$('#draw').querySelectorAll('[data-k]').forEach(el=>{el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',CAPN[el.dataset.k]);const act=e=>{if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;e.stopPropagation();if(e.type==='keydown')e.preventDefault();
   const ok=el.dataset.k===ans;if(!tried&&ok)good++;tried=true;$('#fb').innerHTML=ok?`<b style="color:var(--ok)">¡Bien! ${CAPN[ans]}.</b>`:`<b style="color:var(--marker)">Esa es la ${CAPN[el.dataset.k].toLowerCase()}.</b> Prueba otra.`;
   if(ok){$('#draw').querySelectorAll('[data-k]').forEach(x=>{x.style.pointerEvents='none'});k++;setTimeout(draw,1100)}};el.addEventListener('click',act);el.addEventListener('keydown',act)})};
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Capas de la Tierra</span><span id="cnt"></span></div><p class="q" id="q"></p><div class="tapsvg" id="draw"></div><p class="note" id="fb" role="status"></p><p class="note">Los dibujos no tienen nombres: tienes que saber cuál es cada capa. La atmósfera va de abajo (suelo) arriba (espacio).</p><div id="gend"><div class="actions">${backBtn()}</div></div></div>`;wireBack();draw()}

/* Coordenadas */
function fmtC(la,lo){return`${Math.abs(la)}º ${la>0?'N':la<0?'S':''}, ${Math.abs(lo)}º ${lo>0?'E':lo<0?'O':''}`.replace(/º ,/,'º,').replace(/ $/,'')}
function gCoo(){let k=0,good=0;const N=8;
 const draw=()=>{if(k>=N){const better=setBest('coo',good,false);$('#draw').innerHTML='';$('#opts').innerHTML='';$('#q').textContent='';gameEnd(`${good} de ${N}`,`${better?'¡Nueva mejor marca! ':''}Primero la latitud (N/S, hasta 90º) y después la longitud (E/O, hasta 180º).`,gCoo);return}
  let la,lo;do{la=pick([-60,-45,-30,-15,15,30,45,60]);lo=pick([-150,-120,-90,-60,-30,30,60,90,120,150])}while(Math.abs(la)===Math.abs(lo));
  const right=fmtC(la,lo);const wrong=[fmtC(-la,lo),fmtC(la,-lo),fmtC(-la,-lo)];if(Math.abs(lo)<=90)wrong.push(fmtC(lo,la));const opts=shuffle([right,...shuffle(wrong).slice(0,3)]);
  $('#cnt').textContent=`${k+1} / ${N}`;$('#q').textContent='¿Qué coordenadas tiene el punto rosa?';$('#draw').innerHTML=svg(D.mapa([la,lo],false),null,'Mapa con paralelos y meridianos');
  $('#opts').innerHTML=opts.map(o=>`<button class="opt" type="button">${o}</button>`).join('');let tried=false;
  $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.textContent===right;if(!tried&&ok)good++;tried=true;if(ok){b.classList.add('right');$('#opts').querySelectorAll('.opt').forEach(x=>x.disabled=true);k++;setTimeout(draw,900)}else{b.classList.add('wrong');b.disabled=true;
   const t=b.textContent;const tip=t===fmtC(-la,lo)?'Mira si el punto está encima (N) o debajo (S) del Ecuador.':t===fmtC(la,-lo)?'Mira si está a la derecha (E) o a la izquierda (O) de Greenwich.':t===fmtC(lo,la)?'Has cambiado latitud y longitud: la latitud es la de arriba-abajo.':'Revisa los dos hemisferios.';$('#fb').textContent=tip;setTimeout(()=>{if($('#fb'))$('#fb').textContent=''},2600)}})};
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Cazador de coordenadas</span><span id="cnt"></span></div><p class="q" id="q"></p><div class="tapsvg" id="draw"></div><p class="note" id="fb" role="status"></p><div class="opts grid" id="opts"></div><div id="gend"><div class="actions">${backBtn()}</div></div></div>`;wireBack();draw()}

/* La Luna */
const LUNQ=[['luna','nueva','Luna nueva'],['luna','creciente','Cuarto creciente'],['luna','llena','Luna llena'],['luna','menguante','Cuarto menguante'],['eclipse','solar','Eclipse de Sol'],['eclipse','lunar','Eclipse de Luna']];
function gLun(){const qs=shuffle([...LUNQ,...shuffle(LUNQ).slice(0,2)]);let k=0,good=0;const N=qs.length;
 const draw=()=>{if(k>=N){const v=Math.round(good/N*8);const better=setBest('lun',v,false);$('#draw').innerHTML='';$('#opts').innerHTML='';$('#q').textContent='';gameEnd(`${good} de ${N}`,`${better?'¡Nueva mejor marca! ':''}«La Luna es mentirosa»: con forma de C decrece, con forma de D crece.`,gLun);return}
  const [kind,arg,name]=qs[k];$('#cnt').textContent=`${k+1} / ${N}`;$('#q').textContent=kind==='luna'?'¿Qué fase de la Luna es?':'¿Qué tipo de eclipse muestra el dibujo?';
  $('#draw').innerHTML=`<div style="max-width:${kind==='luna'?180:420}px;margin:0 auto">${svg(kind==='luna'?D.luna(arg):D.eclipse(arg),null,'Dibujo')}</div>`;
  const opts=kind==='luna'?LUNQ.slice(0,4).map(x=>x[2]):['Eclipse de Sol','Eclipse de Luna'];
  $('#opts').className='opts '+(kind==='luna'?'grid':'two');$('#opts').innerHTML=opts.map(o=>`<button class="opt" type="button">${o}</button>`).join('');let tried=false;
  $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.textContent===name;if(!tried&&ok)good++;tried=true;if(ok){b.classList.add('right');$('#opts').querySelectorAll('.opt').forEach(x=>x.disabled=true);k++;setTimeout(draw,900)}else{b.classList.add('wrong');b.disabled=true}})};
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>La Luna</span><span id="cnt"></span></div><p class="q" id="q"></p><div id="draw"></div><div class="opts" id="opts"></div><div id="gend"><div class="actions">${backBtn()}</div></div></div>`;wireBack();draw()}

/* =================== TARJETAS =================== */
function renderTarjetas(){const deck=CARDS.map((c,i)=>({i,t:c[0],w:c[1],d:c[2]})).filter(c=>temaOk(c.t));
 const known=deck.filter(c=>S.cards[c.i]==='ok').length;let queue=shuffle(deck.filter(c=>S.cards[c.i]!=='ok'));if(!queue.length)queue=shuffle(deck);let cur=0;
 const draw=()=>{if(cur>=queue.length){$('#fc').innerHTML=`<h3>¡Ronda terminada!</h3><p>Sabes ${deck.filter(c=>S.cards[c.i]==='ok').length} de ${deck.length} palabras.</p><div class="actions"><button class="primary" id="more" type="button">Otra ronda</button><button class="ghost" id="resetc" type="button">Empezar de cero</button></div>`;$('#more').onclick=renderTarjetas;$('#resetc').onclick=()=>{deck.forEach(c=>delete S.cards[c.i]);save();renderTarjetas()};return}
  const c=queue[cur];$('#fc').innerHTML=`<p class="note">Tarjeta ${cur+1} de ${queue.length} · Toca para darle la vuelta</p><button class="flash" id="flip" type="button" aria-label="Darle la vuelta"><span class="in"><span class="f"><small>${c.t===1?'Tema 1':'Tema 2'}</small><b>${esc(c.w)}</b><small>¿Qué significa?</small></span><span class="b">${esc(c.d)}</span></span></button>
  <div class="actions" id="judge" hidden><button class="primary" id="ok" type="button">Lo sabía</button><button class="ghost" id="ko" type="button">Repasar otra vez</button></div>`;
  $('#flip').onclick=()=>{$('#flip').classList.toggle('up');$('#judge').hidden=false};
  $('#ok').onclick=()=>{S.cards[c.i]='ok';save();cur++;draw()};$('#ko').onclick=()=>{S.cards[c.i]='ko';save();queue.push(c);cur++;draw()}};
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Palabras clave</span><span>${known} / ${deck.length} sabidas</span></div><div id="fc" style="display:flex;flex-direction:column;gap:12px"></div></div>`;draw()}

/* =================== PROGRESO Y NAVEGACIÓN =================== */
const BADGES=[['Primeros pasos',()=>totalStars()>=1],['Experta en Prehistoria',()=>ST.filter(s=>s.t===1).every(s=>S.stars[s.id]===3)],['Exploradora del Universo',()=>ST.filter(s=>s.t===2).every(s=>S.stars[s.id]===3)],['Memoria de elefante',()=>S.games.mem!=null&&S.games.mem<=8],['Máquina del tiempo',()=>S.games.tl===0],['Rápida como el rayo',()=>(S.games.cla||0)>=25],['Navegante',()=>(S.games.coo||0)>=7],['Sobresaliente',()=>(S.games.prueba||0)>=9]];
function renderProgress(){const any=totalStars()||Object.keys(S.games).length||Object.keys(S.q).length||Object.keys(S.cards).length;
 $('#progress').innerHTML=`<h2>Medallas</h2><div class="badges">${BADGES.map(([n,f])=>{const g=f();return`<span class="badge ${g?'got':''}">${star(g)}${n}</span>`}).join('')}</div>
 <div class="pfoot"><span>${any?'Las medallas se ganan con las estrellas, los juegos y la prueba.':'Todavía no has empezado la expedición en este dispositivo.'}</span>${st.confirm?`<span class="rconf">¿Seguro? <button class="rbtn danger" id="rYes" type="button">Sí, borrar</button><button class="rbtn" id="rNo" type="button">Cancelar</button></span>`:`<button class="rbtn" id="rst" type="button"${any?'':' disabled'}>Borrar progreso</button>`}</div>`;
 if($('#rst'))$('#rst').onclick=()=>{st.confirm=true;renderProgress()};if($('#rNo'))$('#rNo').onclick=()=>{st.confirm=false;renderProgress()};
 if($('#rYes'))$('#rYes').onclick=()=>{S={stars:{},q:{},games:{},cards:{}};save();st.confirm=false;renderProgress();renderScore();go()}}
function setTab(t){stopTimers();st.tab=t;[['tMapa','mapa'],['tJuegos','juegos'],['tTarjetas','tarjetas'],['tPrueba','prueba']].forEach(([id,k])=>$('#'+id).setAttribute('aria-pressed',k===t));go();window.scrollTo({top:0})}
function go(){stopTimers();st.view=null;renderChips(true);({mapa:renderMapa,juegos:renderJuegos,tarjetas:renderTarjetas,prueba:renderPrueba})[st.tab]()}
$('#tMapa').onclick=()=>setTab('mapa');$('#tJuegos').onclick=()=>setTab('juegos');$('#tTarjetas').onclick=()=>setTab('tarjetas');$('#tPrueba').onclick=()=>setTab('prueba');
renderScore();renderProgress();go();
</script>
