<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio de células</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
/* Layout: cuaderno de laboratorio. Misma familia que las otras apps; los dibujos de células y del microscopio se pueden tocar y son el centro de los juegos */
:root{
  --bg:#eaeff7; --paper:#fdfdfb; --grid:#e2e9f4; --ink:#1b2a4a; --muted:#56637d; --line:#cfd8e7;
  --marker:#c0127e; --marker-soft:#fbe4f1; --ok:#17734a; --ok-soft:#ddf2e6; --btn:#1b2a4a; --btn-fg:#fdfdfb; --chip:#ffffff;
  --star:#d9a400; --lab:#1f7a5c; --slide:#eef4ea; --hl:#c0127e;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1524; --paper:#151f36; --grid:#1d2a46; --ink:#e4eaf6; --muted:#9ba8c3; --line:#2a3856;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#e4eaf6; --btn-fg:#0e1524; --chip:#18233d;
  --star:#ffd23f; --lab:#5fd3a6; --slide:#1b2b2a; --hl:#ff5fb9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1524; --paper:#151f36; --grid:#1d2a46; --ink:#e4eaf6; --muted:#9ba8c3; --line:#2a3856;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#e4eaf6; --btn-fg:#0e1524; --chip:#18233d;
  --star:#ffd23f; --lab:#5fd3a6; --slide:#1b2b2a; --hl:#ff5fb9; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:740px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.back{font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:700}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.1;margin:0;letter-spacing:-.01em}
header h1 span{color:var(--marker);font-family:var(--f-hand);font-size:1.15em;margin-left:.15em}
header p{margin:.35em 0 0;color:var(--muted);max-width:56ch}
.score{display:flex;align-items:center;gap:6px;font:800 1.4rem var(--f-display);font-variant-numeric:tabular-nums}
.score svg{width:28px;height:28px}
.tabs{display:flex;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 .95rem var(--f-body);padding:10px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:400 .9rem var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible,.card3d:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.sheet{position:relative;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:6px;padding:20px 18px 22px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(20,30,60,.45);display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-right:56px}
h2{font:800 1.35rem var(--f-display);margin:0;text-wrap:balance}
h3{font:800 1.05rem var(--f-display);margin:0}
.primary{background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;font:700 1rem var(--f-body);padding:12px 20px;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:700 1rem var(--f-body);padding:11px 16px;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:.9rem;color:var(--muted);margin:0}
/* Estaciones */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.path li{position:relative;padding-left:58px;padding-block:6px}
.path li::before{content:"";position:absolute;left:21px;top:0;bottom:0;border-left:3px dotted var(--line)}
.path li:first-child::before{top:50%}.path li:last-child::before{bottom:50%}
.stop{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.stop:hover{border-color:var(--muted)}
.stop b{font:800 1.05rem var(--f-display);display:block}
.stop small{color:var(--muted);font-size:.88rem;display:block}
.dot{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 .95rem var(--f-display);background:var(--paper);border:3px solid var(--lab);color:var(--lab)}
.dot.done{background:var(--lab);color:var(--paper)}
.stars{display:flex;gap:2px;flex:none}.stars svg{width:20px;height:20px}
.st-on{fill:var(--star)}.st-off{fill:none;stroke:var(--line);stroke-width:2}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:64ch}
.card li::marker{color:var(--marker)}
.truco{background:var(--marker-soft);border-radius:10px;padding:10px 12px;margin:0}
.truco b{font-family:var(--f-hand);font-size:1.4rem;color:var(--marker);margin-right:6px}
.ill{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.ill svg{width:100%;max-width:380px;height:auto;display:block;border-radius:12px}
.ill figcaption{font-size:.86rem;color:var(--muted);text-align:center}
.figs{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}.figs .ill{flex:1 1 220px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:420px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;background:var(--paper)}
.tbl th{background:var(--chip)}
/* Preguntas */
.q{font-size:1.12rem;font-weight:700;margin:0;line-height:1.45}
.prompt{font:800 1.25rem var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.prompt small{display:block;font:400 .95rem var(--f-body);color:var(--muted);margin-top:2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.two{flex-direction:row}.opts.two .opt{flex:1;text-align:center;font-weight:700}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opts.three{display:grid;grid-template-columns:repeat(3,1fr)}.opts.three .opt{text-align:center;font-weight:700}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 1rem var(--f-body);padding:10px 14px;border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}.opt.wrong{border-color:var(--marker);background:var(--marker-soft)}.opt:disabled{cursor:default}
.exp{border-top:2px solid var(--ink);padding-top:10px;margin:0}
.verdict{font-weight:700;margin:0}.verdict.b{color:var(--ok)}.verdict.mm{color:var(--marker)}
.stamp{position:absolute;top:10px;right:14px;font-family:var(--f-hand);font-size:3.4rem;line-height:1;transform:rotate(-8deg);pointer-events:none}
.stamp.b{color:var(--ok)}.stamp.mm{color:var(--marker)}
.pbar{display:flex;gap:5px}.pbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}.pbar i.okk{background:var(--ok)}.pbar i.ko{background:var(--marker)}.pbar i.on{background:var(--ink)}
.bigstars{display:flex;gap:8px;justify-content:center}.bigstars svg{width:56px;height:56px}
@media (prefers-reduced-motion:no-preference){.bigstars svg.anim{animation:pop .45s ease-out both}.bigstars svg:nth-child(2){animation-delay:.15s}.bigstars svg:nth-child(3){animation-delay:.3s}}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}}
.grade{font-family:var(--f-hand);color:var(--marker);font-size:4.4rem;line-height:1;border:3px solid var(--marker);border-radius:50%;width:140px;height:110px;display:grid;place-items:center;transform:rotate(-6deg);margin:6px 0 10px}
.fb{min-height:1.5em;margin:0;font-weight:700}.fb.okk{color:var(--ok)}.fb.ko{color:var(--marker)}
.end{border-top:2px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:8px}.end p{margin:0}
/* Dibujos tocables */
.scope{border-radius:14px;overflow:hidden;background:var(--slide);display:flex;justify-content:center}
.scope svg{width:100%;max-width:420px;height:auto;display:block}
.tap [data-k]{cursor:pointer}
.tap [data-k]:hover{filter:brightness(1.08)}
.hit-ok{fill:var(--ok)!important;stroke:var(--ok)!important}
.hit-ko{fill:var(--marker)!important;stroke:var(--marker)!important}
.ghost,.ghost.hit-ok,.ghost.hit-ko{fill:transparent!important;stroke:transparent!important}
@media (prefers-reduced-motion:no-preference){[data-k].blink{animation:blink .5s ease-in-out 3}@keyframes blink{50%{opacity:.25}}}
.lbl{font:700 11px var(--f-body);fill:#14213a;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
/* Juegos */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.gcard:hover{border-color:var(--muted)}
.gcard svg{width:46px;height:46px}
.gcard b{font:800 1.08rem var(--f-display)}.gcard small{color:var(--muted)}.gcard .best{font-size:.82rem;color:var(--ok);font-weight:700}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.timer{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}.timer i{display:block;height:100%;background:var(--marker);transition:width .2s linear}
.bigq{font:800 1.5rem var(--f-display);text-align:center;min-height:3em;display:grid;place-items:center;margin:0;text-wrap:balance;border-radius:10px}
.flash-ok{animation:fok .4s}.flash-ko{animation:fko .4s}@keyframes fok{from{background:var(--ok-soft)}}@keyframes fko{from{background:var(--marker-soft)}}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{font:400 1.2rem var(--f-body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:12em;max-width:100%;font-variant-numeric:tabular-nums}
.numrow .unit{font-weight:700;color:var(--muted)}
.numrow input.ok{border-color:var(--ok)}.numrow input.ko{border-color:var(--marker)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.ev{border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 1rem var(--f-body);padding:9px 12px;border-radius:10px;cursor:pointer}
.ev.shake{border-color:var(--marker);animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:l}
.ladder li{background:var(--ok-soft);border-radius:8px;padding:6px 10px;font-weight:700}
.ladder li small{font-weight:400;color:var(--muted);margin-left:6px}
.cloze{line-height:2.4;margin:0;font-size:1.05rem}
.cloze select{font:400 1rem var(--f-body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:4px 6px;max-width:100%}
.cloze select.ok{border-color:var(--ok);background:var(--ok-soft)}.cloze select.ko{border-color:var(--marker);background:var(--marker-soft)}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card3d{display:block;position:relative;width:100%;aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer;perspective:600px;font:inherit;color:var(--ink);min-width:0}
.card3d .in{display:block;position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.card3d.up .in,.card3d.done .in{transform:rotateY(180deg)}
.card3d .f,.card3d .b{position:absolute;inset:0;border-radius:10px;display:grid;place-items:center;padding:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;font-size:.82rem;line-height:1.2;overflow:hidden;overflow-wrap:anywhere;hyphens:auto}
.card3d .f{background:var(--lab);color:var(--paper);font-family:var(--f-hand);font-size:2rem}
.card3d .b{background:var(--paper);border:2px solid var(--line);transform:rotateY(180deg)}
.card3d .b.sp{font-weight:700}
.card3d.done .b{border-color:var(--ok);background:var(--ok-soft)}
@media (prefers-reduced-motion:reduce){.card3d .in{transition:none}}
/* Progreso */
.progress{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:16px}
.progress h2{font-size:1.15rem;margin:0 0 10px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:.85rem;font-weight:700;color:var(--muted)}
.badge.got{color:var(--ink);border-color:var(--star)}.badge svg{width:22px;height:22px}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.9rem;color:var(--muted)}
.rbtn{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;font:700 .9rem var(--f-body);padding:7px 12px;cursor:pointer;margin-left:6px}
.rbtn:disabled{opacity:.45;cursor:default}.rbtn.danger{background:var(--marker);border-color:var(--marker);color:var(--paper)}
.rconf{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px;color:var(--ink);font-weight:700}
.qlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}.qlist li{display:flex;gap:10px;align-items:baseline}.qlist b{font-family:var(--f-hand);font-size:1.5rem;width:1.2em;flex:none}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-fg);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:5;max-width:calc(100% - 32px);text-align:center}
svg text{font-family:var(--f-body)}
@media (max-width:460px){header h1{font-size:1.65rem}.opts.grid{grid-template-columns:1fr}.opts.three{grid-template-columns:1fr}.stamp{font-size:2.8rem}.mem{gap:6px}.card3d .b{font-size:.74rem}}
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="../../../#ale/biologia">← Biología y Geología de Ale</a>
  <header>
    <div><h1>Laboratorio de células <span>Ale</span></h1>
    <p>Biología y Geología: «Formados por células». El microscopio, las partes de la célula, procariotas y eucariotas, células animales y vegetales y los tejidos.</p></div>
    <div class="score" id="score" aria-label="Estrellas"></div>
  </header>
  <div class="tabs" role="group" aria-label="Sección">
    <button id="tEst" aria-pressed="true">Estudiar</button>
    <button id="tJue" aria-pressed="false">Laboratorio</button>
    <button id="tPru" aria-pressed="false">Prueba</button>
  </div>
  <main id="main"></main>
  <section class="progress" id="progress"></section>
</div>

<script>
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STARP='<path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/>';
const star=(on,cls='')=>`<svg viewBox="0 0 24 24" class="${on?'st-on':'st-off'} ${cls}" aria-hidden="true">${STARP}</svg>`;
const nf=n=>n.toLocaleString('es-ES',{maximumFractionDigits:6});

/* =================== DIBUJOS (tocables por data-k) =================== */
const PARTS={ocular:'Ocular',objetivo:'Objetivo (en el revólver)',platina:'Platina',condensador:'Condensador',tornillos:'Tornillos de enfoque',luz:'Fuente de luz (bombilla)',
 membrana:'Membrana plasmática',citoplasma:'Citoplasma',nucleo:'Núcleo',material:'Material genético',organulos:'Orgánulos',pared:'Pared celular',cloroplastos:'Cloroplastos',vacuola:'Vacuola',apendice:'Apéndice móvil (flagelo)',paredb:'Pared bacteriana',cilios:'Apéndices móviles (cilios)'};
const DR={
micro:()=>({vb:'0 0 280 300',s:`<rect width="280" height="300" fill="#eef4ea"/>
 <rect x="50" y="268" width="180" height="20" rx="8" fill="#34495e"/>
 <path d="M86 270 C 64 222, 66 130, 112 72 L 134 86 C 98 128, 96 216, 116 270 Z" fill="#3f5a70"/>
 <g data-k="luz"><rect x="146" y="248" width="44" height="20" rx="4" fill="#5d7488"/><circle cx="168" cy="252" r="10" fill="#ffd34d" stroke="#b8860b" stroke-width="2"/><path d="M168 236 l0 -8 M156 240 l-5 -5 M180 240 l5 -5" stroke="#e8a317" stroke-width="2.5" stroke-linecap="round"/></g>
 <g data-k="condensador"><rect x="150" y="206" width="36" height="16" rx="3" fill="#8fa2b4" stroke="#4a5d70" stroke-width="1.5"/><rect x="186" y="210" width="16" height="5" rx="2" fill="#4a5d70"/></g>
 <g data-k="platina"><rect x="112" y="190" width="112" height="12" rx="3" fill="#2c3e50"/><rect x="150" y="186" width="34" height="4" fill="#a9b7c5"/><path d="M128 186 h18 M190 186 h18" stroke="#c0ccd8" stroke-width="3" stroke-linecap="round"/></g>
 <path d="M130 96 L 166 146 L 178 138 L 142 88 Z" fill="#4a6580"/>
 <g data-k="objetivo"><path d="M150 140 L196 140 L188 156 L158 156 Z" fill="#7b8fa3"/><rect x="160" y="156" width="9" height="24" rx="2" fill="#c9d3dd" stroke="#5d7488" stroke-width="1.2"/><rect x="174" y="156" width="8" height="17" rx="2" fill="#c9d3dd" stroke="#5d7488" stroke-width="1.2"/><rect x="186" y="154" width="7" height="12" rx="2" fill="#c9d3dd" stroke="#5d7488" stroke-width="1.2"/></g>
 <g data-k="ocular"><path d="M118 56 L138 44 L152 66 L132 78 Z" fill="#7b8fa3"/><rect x="113" y="34" width="26" height="14" rx="3" transform="rotate(-32 126 41)" fill="#2c3e50"/></g>
 <g data-k="tornillos"><circle cx="96" cy="204" r="15" fill="#7b8fa3" stroke="#34495e" stroke-width="2"/><circle cx="96" cy="204" r="5" fill="#34495e"/><circle cx="98" cy="238" r="9" fill="#9fb0c0" stroke="#34495e" stroke-width="2"/></g>`}),
animal:(o={})=>({vb:'0 0 260 210',s:`<rect width="260" height="210" fill="#eef4ea"/>
 <path data-k="membrana" d="M130 14 C 196 10, 246 54, 240 110 C 236 166, 186 200, 126 196 C 64 194, 18 160, 20 104 C 22 50, 70 18, 130 14 Z" fill="#e48aa8"/>
 <path data-k="citoplasma" d="M130 24 C 190 21, 232 60, 228 110 C 224 160, 180 186, 126 184 C 72 182, 32 152, 32 104 C 34 56, 76 27, 130 24 Z" fill="#fbd9e2"/>

const ST=[
{id:'s1',n:'El microscopio',s:'Para ver lo que el ojo no ve',figs:[['micro','Las partes del microscopio óptico']],p:[
 'El <b>microscopio óptico</b> permite ver cosas <b>mil veces más pequeñas</b> que las que vemos a simple vista. Es un sistema de <b>lentes</b> con piezas mecánicas.',
 '<b>Ocular</b>: la lente que ponemos delante del ojo. Aumenta la imagen entre <b>5 y 15 veces</b>.',
 '<b>Objetivo</b>: lente que forma una primera imagen aumentada y la envía al ocular. Aumenta entre <b>4 y 40 veces</b>. Suele haber varios en una pieza giratoria: el <b>revólver</b>.',
 '<b>Platina</b>: la plataforma donde se pone la muestra. Tiene un agujero para que pase la luz.',
 '<b>Condensador</b>: concentra la luz sobre la muestra. Tiene un <b>diafragma</b> que regula la cantidad de luz.',
 '<b>Tornillos de enfoque</b>: suben y bajan la platina. El grande hace movimientos grandes; el pequeño, movimientos precisos.',
 '<b>Fuente de luz</b>: normalmente una bombilla. La luz atraviesa la muestra y las lentes hasta el ojo.',
 'Las muestras se <b>tiñen</b> con colorantes para que se vean con más contraste.'],
 truco:'El <b>oc</b>ular está junto al <b>o</b>jo; el <b>obj</b>etivo, junto al <b>obj</b>eto que observas.'},
{id:'s2',n:'La célula, unidad de vida',s:'Uni, pluri y las micras',p:[
 'Todos los seres vivos están formados por <b>células</b>. Dentro de ellas ocurren las reacciones químicas de la vida. La célula es la <b>unidad mínima de vida</b>.',
 'La <b>materia inerte</b> (papel, cristales de azúcar, piedras…) no está formada por células.',
 '<b>Unicelulares</b>: una sola célula (protozoos, bacterias, algunas algas). <b>Pluricelulares</b>: muchas células (plantas, hongos y animales).',
 'Un ser humano adulto tiene unos <b>100 billones</b> de células.',
 'Las células se miden en <b>micrómetros o micras</b> (<b>µm</b>): <b>1 µm = 0,001 mm</b> y <b>1.000 µm = 1 mm</b>. La mayoría mide entre <b>1 y 100 µm</b>.',
 'Un elefante es más grande que un ratón porque tiene <b>más células</b>, no células más grandes. Al crecer aumenta el <b>número</b> de células, no su tamaño.'],
 truco:'De mm a µm, <b>multiplica por 1.000</b>; de µm a mm, <b>divide entre 1.000</b>. 0,055 mm = 55 µm.'},
{id:'s3',n:'Las partes de la célula',s:'Membrana, citoplasma y material genético',figs:[['animal','Partes de una célula (animal)']],p:[
 'Todas las células, sean como sean, tienen tres partes:',
 '<b>Membrana plasmática</b>: rodea la célula. Es flexible y funciona como un <b>filtro</b> que regula lo que entra y sale.',
 '<b>Citoplasma</b>: el medio interno, sobre todo <b>agua</b> con sustancias disueltas. En algunas células tiene <b>orgánulos</b> (compartimentos rodeados de membrana).',
 '<b>Material genético</b>: <b>regula</b> los procesos de la célula. En unas células está dentro de un <b>núcleo</b>; en otras, libre en el citoplasma.'],
 truco:'La membrana es la <b>puerta</b>, el citoplasma la <b>casa</b> y el material genético el <b>director</b>.'},
{id:'s4',n:'Procariotas y eucariotas',s:'Con núcleo o sin núcleo',figs:[['bacteria','Célula procariota (bacteria)']],p:[
 'Las células se dividen en dos grupos según tengan o no <b>núcleo</b>.',
 '<b>Procariotas</b> («antes del núcleo»): <b>sin núcleo</b> ni orgánulos; el material genético está libre en el citoplasma. Tienen <b>pared bacteriana</b> alrededor de la membrana.',
 'Las procariotas suelen medir <b>1 µm</b>, tienen formas simples (esfera, bastón, tirabuzón, judía) y algunas tienen <b>filamentos</b> para moverse. No forman seres pluricelulares complejos. Son las <b>bacterias</b>.',
 '<b>Eucariotas</b> («auténtico núcleo»): <b>con núcleo</b> y con <b>orgánulos</b>. Miden de <b>10 a 150 µm</b>.',
 'Son eucariotas los <b>pluricelulares</b> (animales, plantas y hongos) y algunos unicelulares: <b>protozoos, algas unicelulares y levaduras</b>.'],
 truco:'<b>Pro</b> = antes, <b>karyon</b> = núcleo: las procariotas son de «antes del núcleo». <b>Eu</b> = auténtico: las eucariotas tienen núcleo de verdad.'},
{id:'s5',n:'Célula animal y vegetal',s:'Lo que tienen las plantas',figs:[['animal','Célula animal'],['vegetal','Célula vegetal']],p:[
 'Animales y plantas tienen células <b>eucariotas</b>: núcleo, membrana, citoplasma y orgánulos.',
 'Las células <b>vegetales</b> tienen además:',
 '<b>Pared celular</b> rígida alrededor de la membrana; por eso suelen tener forma <b>poligonal</b>.',
 '<b>Cloroplastos</b> en las partes verdes: allí se hace la <b>fotosíntesis</b>. Son verdes por la <b>clorofila</b>.',
 '<b>Vacuolas muy grandes</b> que almacenan agua y sustancias disueltas.'],
 tabla:{h:['','Animal','Vegetal'],r:[['Núcleo, membrana, citoplasma','Sí','Sí'],['Pared celular','No','Sí'],['Cloroplastos','No','Sí'],['Vacuolas grandes','No','Sí'],['Forma','Redondeada, variable','Poligonal']]},
 truco:'Las plantas tienen las «<b>3 extras</b>»: <b>P</b>ared, <b>C</b>loroplastos y <b>V</b>acuola grande.'},
{id:'s6',n:'Diversidad y tejidos',s:'Células especializadas y niveles',figs:[['niveles','Niveles de organización'],['protozoo','Un protozoo (sin cloroplastos)'],['alga','Un alga unicelular (con cloroplastos)']],p:[
 'Los pluricelulares tienen <b>distintos tipos de células</b>; su forma depende de su <b>función</b>.',
 '<b>Neuronas</b>: alargadas y con muchos apéndices; transmiten estímulos. Los <b>espermatozoides</b> se mueven con un <b>flagelo</b>. En las hojas hay células llenas de <b>cloroplastos</b>. Los <b>vasos conductores</b> llevan la savia. Las células del <b>oído</b> detectan las vibraciones del sonido.',
 'Las células de un mismo tipo forman <b>tejidos</b>. Varios tejidos forman <b>órganos</b> (hoja, raíz, flor; piel, corazón, cerebro). Varios órganos forman <b>aparatos o sistemas</b>.',
 '<b>Eucariotas unicelulares</b>: <b>protozoos</b>, <b>algas unicelulares</b> y <b>levaduras</b> (hongos unicelulares). Pueden tener pared celular y apéndices móviles.',
 'Las <b>algas</b> tienen cloroplastos; los <b>protozoos</b> y las <b>levaduras</b>, no.'],
 truco:'Célula → tejido → órgano → aparato → organismo: de lo más <b>pequeño</b> a lo más <b>grande</b>.'},
];

function weight(q){const s=S.q[q.id];if(!s)return 3;return Math.max(.4,1+2*(s.n-s.ok)-.6*s.ok)}
function wpick(list,n){const out=[],pool=[...list];while(out.length<n&&pool.length){let r=Math.random()*pool.reduce((a,q)=>a+weight(q),0);let k=0;for(;k<pool.length;k++){r-=weight(pool[k]);if(r<=0)break}out.push(pool.splice(Math.min(k,pool.length-1),1)[0])}return out}

const CLUE={bacteria:'No tiene núcleo: el material genético está suelto. Tiene pared bacteriana y un flagelo.',animal:'Tiene núcleo y orgánulos, sin pared ni cloroplastos, y forma redondeada.',vegetal:'Tiene pared celular, cloroplastos y una gran vacuola, y forma poligonal.',protozoo:'Una sola célula con núcleo y apéndices móviles (cilios), sin cloroplastos.',alga:'Una sola célula con núcleo, pared, cloroplastos y flagelos.',levadura:'Hongo unicelular: tiene núcleo y pared, sin cloroplastos. Se reproduce por gemación (la «yema»).'};
function gDet(){const list=shuffle([...TYPES,...shuffle(TYPES).slice(0,2)]);let k=0,good=0;const res=[];
 const draw=()=>{if(k>=list.length){const better=setBest('det',good,false);$('#draw').innerHTML='';$('#q').textContent='';$('#opts').innerHTML='';$('#pb').innerHTML=pbar(8,res,99);endG(`${good} de 8`,`${better?'¡Nueva mejor marca! ':''}Primero busca el núcleo; luego, pared y cloroplastos.`,gDet);return}
  const [key,name,kind]=list[k];$('#pb').innerHTML=pbar(8,res,k);let step=1,ok1=true;$('#fb').textContent='';
  const rot=pick([0,0,-12,12,180]);$('#draw').innerHTML=`<div style="transform:rotate(${rot}deg);max-width:340px;margin:0 auto">${svgOf(key,'Muestra al microscopio')}</div>`;
  const ask1=()=>{$('#q').textContent='Paso 1: ¿es una célula procariota o eucariota?';$('#opts').className='opts two';$('#opts').innerHTML=['Procariota','Eucariota'].map(o=>`<button class="opt" type="button">${o}</button>`).join('');
   $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.textContent.toLowerCase()===kind;if(!ok){ok1=false;b.classList.add('wrong');b.disabled=true;$('#fb').className='fb ko';$('#fb').textContent=kind==='eucariota'?'Fíjate: ¿hay un núcleo?':'Fíjate: ¿hay un núcleo o el material genético está suelto?';return}b.classList.add('right');$('#fb').textContent='';setTimeout(ask2,450)})};
  const ask2=()=>{$('#q').textContent='Paso 2: ¿qué es exactamente?';$('#opts').className='opts grid';$('#opts').innerHTML=TYPES.map(t=>`<button class="opt" type="button">${t[1]}</button>`).join('');let tries=0;
   $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{tries++;const ok=b.textContent===name;if(!ok){b.classList.add('wrong');b.disabled=true;$('#fb').className='fb ko';$('#fb').textContent='Busca pistas: pared, cloroplastos, vacuola, cilios o flagelos.';if(tries<2)return}
    $('#opts').querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===name)x.classList.add('right')});const win=ok&&tries===1&&ok1;if(win)good++;res.push(win);
    $('#fb').className='fb '+(win?'okk':'ko');$('#fb').innerHTML=`${win?'¡Caso resuelto!':'Era: '+name+'.'} ${CLUE[key]}`;
    $('#opts').insertAdjacentHTML('afterend','<div class="actions" id="nxw" style="margin-top:4px"><button class="primary" id="nx" type="button">Siguiente muestra</button></div>');$('#nx').onclick=()=>{$('#nxw').remove();k++;draw()}})};ask1()};
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Detective de células</span></div><div id="pb"></div><div class="scope" id="draw"></div><p class="prompt" id="q"></p><div class="opts" id="opts"></div><p class="fb" id="fb" role="status"></p><div id="gend"><div class="actions">${backB()}</div></div></div>`;wireBack();draw()}

/* Clasifica contra reloj */
const DECKS={
va:{n:'¿Vegetal, animal o las dos?',c:['Vegetal','Animal','Las dos'],it:[['Pared celular',0],['Cloroplastos',0],['Vacuolas muy grandes',0],['Forma poligonal',0],['Clorofila',0],['Hace la fotosíntesis',0],['Núcleo',2],['Membrana plasmática',2],['Citoplasma',2],['Material genético',2],['Orgánulos',2],['Es eucariota',2],['Neurona',1],['Espermatozoide',1],['Células del oído',1],['Célula del corazón',1]]},
pe:{n:'¿Procariota o eucariota?',c:['Procariota','Eucariota'],it:[['Bacteria',0],['Sin núcleo',0],['Pared bacteriana',0],['Mide alrededor de 1 µm',0],['Material genético libre en el citoplasma',0],['Sin orgánulos',0],['Forma de bastón o tirabuzón',0],['Protozoo',1],['Alga unicelular',1],['Levadura',1],['Célula de cebolla',1],['Neurona',1],['Tiene núcleo',1],['Tiene orgánulos',1],['Mide de 10 a 150 µm',1],['Forma animales y plantas',1]]},
vi:{n:'¿Tiene células?',c:['Sí, es un ser vivo','No, es inerte'],it:[['Paramecio',0],['Ameba',0],['Bacteria',0],['Levadura',0],['Seta',0],['Musgo',0],['Mosquito',0],['Bulbo de cebolla',0],['Raíz de una planta',0],['Ballena',0],['Cristal de azúcar',1],['Piedra',1],['Sal de mesa',1],['Una moneda',1],['Agua del grifo sin seres vivos',1],['Un trozo de vidrio',1],['Un clavo de hierro',1]]}};
function gCla(){let deckK='va';
 const setup=()=>{const D=DECKS[deckK];let pts=0,streak=0,left=60,cur=null,deck=shuffle(D.it),k=0,miss=[];
  $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Clasifica contra reloj</span><span>60 segundos</span></div>
  <div class="chips" id="decks">${Object.entries(DECKS).map(([k2,d])=>`<button type="button" data-d="${k2}" aria-pressed="${k2===deckK}">${d.n}</button>`).join('')}</div>
  <div class="hud"><span id="pts">0 puntos</span><span id="stk"></span><span id="sec">60 s</span></div><div class="timer"><i id="bar" style="width:100%"></i></div>
  <p class="bigq" id="item">Pulsa «Empezar»</p><div class="opts ${D.c.length===3?'three':'two'}" id="opts" hidden>${D.c.map((c,i)=>`<button class="opt" type="button" data-i="${i}">${c}</button>`).join('')}</div>
  <div id="gend"><div class="actions"><button class="primary" id="start" type="button">Empezar</button>${backB()}</div></div></div>`;wireBack();
  $('#decks').querySelectorAll('button').forEach(b=>b.onclick=()=>{stopTimers();deckK=b.dataset.d;setup()});
  const next=()=>{if(k>=deck.length){deck=shuffle(D.it);k=0}cur=deck[k++];$('#item').textContent=cur[0]};
  $('#start').onclick=()=>{$('#opts').hidden=false;$('#gend').innerHTML='';next();st.timer=setInterval(()=>{left--;$('#sec').textContent=left+' s';$('#bar').style.width=(left/60*100)+'%';if(left<=0){stopTimers();end()}},1000)};
  $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!cur||left<=0)return;const ok=+b.dataset.i===cur[1];const it=$('#item');it.classList.remove('flash-ok','flash-ko');void it.offsetWidth;
   if(ok){streak++;pts+=streak>=5?2:1}else{streak=0;miss.push(cur)}it.classList.add(ok?'flash-ok':'flash-ko');$('#pts').textContent=pts+' puntos';$('#stk').textContent=streak>=5?'¡Racha ×2!':streak>=2?'Racha '+streak:'';next()});
  function end(){$('#opts').hidden=true;$('#item').textContent='¡Tiempo!';const better=setBest('cla',pts,false);const u=[...new Map(miss.map(m=>[m[0],m])).values()];
   endG(`${pts} puntos`,`${better?'¡Nueva mejor marca! ':''}${u.length?'Para repasar: '+u.slice(0,6).map(m=>`<b>${esc(m[0])}</b> (${D.c[m[1]]})`).join(', ')+'.':'¡Sin fallos!'} Con 5 aciertos seguidos, cada uno vale doble.`,setup)}};setup()}

/* Calculadora de micras */
function parseNum(s){s=s.replace(/\s/g,'');if(!s)return null;if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN}
function numQ(){const t=pick(['mm2um','mm2um','um2mm','cells','fila','fila2']);
 if(t==='mm2um'){const um=pick([R(2,9),R(10,99),R(100,500)]);const mm=um/1000;return{q:`Un microorganismo mide <b>${nf(mm)} mm</b>. ¿Cuántos micrómetros son?`,ans:um,unit:'µm',exp:`${nf(mm)} mm × 1.000 = ${nf(um)} µm.`}}
 if(t==='um2mm'){const um=pick([R(2,9),R(10,99),R(100,900)]);return{q:`Una célula mide <b>${nf(um)} µm</b>. ¿Cuántos milímetros son?`,ans:um/1000,unit:'mm',exp:`${nf(um)} µm : 1.000 = ${nf(um/1000)} mm.`}}
 if(t==='cells'){const kg=pick([10,15,20,25,30,40,45,50,60,70,75,80,100]);const an=pick(['un perro','una persona','un cerdo','un niño','una oveja']);return{q:`En <b>5 kg</b> de masa animal hay unos <b>10 billones</b> de células. ¿Cuántos billones de células tiene ${an} de <b>${kg} kg</b>?`,ans:kg*2,unit:'billones',exp:`${kg} : 5 = ${kg/5} grupos de 5 kg; ${kg/5} × 10 = ${kg*2} billones.`}}
 if(t==='fila'){const L=pick([50,100,125,200,250]);const n=pick([100,200,400,800,1000,2000]);return{q:`Un protozoo mide <b>${L} µm</b>. Si ponemos <b>${nf(n)}</b> en fila, ¿cuántos milímetros miden en total?`,ans:L*n/1000,unit:'mm',exp:`${L} × ${nf(n)} = ${nf(L*n)} µm = ${nf(L*n/1000)} mm.`}}
 const L=pick([50,100,125,200,250,500]);const mm=pick([1,2,5,10,25,50,100]);return{q:`Un protozoo mide <b>${L} µm</b>. ¿Cuántos hacen falta en fila para llegar a <b>${mm} mm</b>?`,ans:mm*1000/L,unit:'protozoos',exp:`${mm} mm = ${nf(mm*1000)} µm; ${nf(mm*1000)} : ${L} = ${nf(mm*1000/L)}.`}}
function gNum(){let k=0,good=0;const res=[];let q;
 const draw=()=>{if(k>=8){const better=setBest('num',good,false);$('#body').innerHTML='';$('#pb').innerHTML=pbar(8,res,99);endG(`${good} de 8`,`${better?'¡Nueva mejor marca! ':''}De mm a µm se multiplica por 1.000; de µm a mm se divide.`,gNum);return}
  do{q=numQ()}while(!Number.isFinite(q.ans)||(q.unit==='protozoos'&&!Number.isInteger(q.ans)));$('#pb').innerHTML=pbar(8,res,k);let tries=0;
  $('#body').innerHTML=`<p class="q">${q.q}</p><div class="numrow"><input id="ans" inputmode="decimal" autocomplete="off" aria-label="Respuesta"><span class="unit">${q.unit}</span><button class="primary" id="chk" type="button">Comprobar</button></div><p class="fb" id="fb" role="status"></p>`;
  const inp=$('#ans');if(window.matchMedia('(hover:hover)').matches)inp.focus();
  const check=()=>{const v=parseNum(inp.value);if(v===null||Number.isNaN(v)){$('#fb').className='fb ko';$('#fb').textContent='Escribe un número (puedes usar coma para los decimales).';return}tries++;const ok=Math.abs(v-q.ans)<1e-9*Math.max(1,q.ans)+1e-9;
   if(ok||tries>=2){inp.disabled=true;inp.className=ok?'ok':'ko';const win=ok&&tries===1;if(win)good++;res.push(win);$('#fb').className='fb '+(ok?'okk':'ko');$('#fb').innerHTML=`${ok?'¡Bien!':'La respuesta era '+nf(q.ans)+' '+q.unit+'.'} ${q.exp}`;
    $('#chk').outerHTML=`<button class="primary" id="nx" type="button">Siguiente</button>`;$('#nx').onclick=()=>{k++;draw()};$('#nx').focus({preventScroll:true})}
   else{inp.className='ko';$('#fb').className='fb ko';$('#fb').textContent=(v===q.ans*1000||v===q.ans/1000)?'Te has equivocado al multiplicar o dividir por 1.000: ¿la cifra tiene que salir mayor o menor?':'No es correcto. Inténtalo otra vez.'}};
  $('#chk').onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#chk'))check()})};
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Calculadora de micras</span></div><div id="pb"></div><p class="note">1 mm = 1.000 µm</p><div id="body"></div><div id="gend"><div class="actions">${backB()}</div></div></div>`;wireBack();draw()}

/* Escalera de la vida: ordenar niveles y clasificar ejemplos */
const LEVELS=['Célula','Tejido','Órgano','Aparato o sistema','Organismo'];
const LEVEX=[['Neurona',0],['Espermatozoide',0],['Paramecio',4],['Ser humano',4],['Rosal',4],['Corazón',2],['Hoja',2],['Raíz',2],['Flor',2],['Piel',2],['Cerebro',2],['Aparato digestivo',3],['Sistema nervioso',3],['Conjunto de células de la epidermis',1],['Tejido de los vasos conductores',1],['Célula de la hoja con cloroplastos',0]];
function gNiv(){let placed=0,err=0;const sh=shuffle(LEVELS);
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Escalera de la vida</span><span id="hud">Errores: 0</span></div><p class="prompt" id="q">Toca los niveles en orden, del más sencillo al más complejo.</p>
 <div class="pool" id="pool">${sh.map(l=>`<button class="ev" type="button">${l}</button>`).join('')}</div><ol class="ladder" id="lad"></ol><div id="part2"></div><div id="gend"><div class="actions">${backB()}</div></div></div>`;wireBack();
 $('#pool').querySelectorAll('.ev').forEach(b=>b.onclick=()=>{if(b.textContent===LEVELS[placed]){placed++;b.remove();$('#lad').insertAdjacentHTML('beforeend',`<li>${placed}. ${b.textContent}</li>`);if(placed===5)part2()}else{err++;$('#hud').textContent='Errores: '+err;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}});
 function part2(){const ex=shuffle(LEVEX).slice(0,6);let k=0;
  const ask=()=>{if(k>=ex.length){const sc=Math.max(0,8-err);const better=setBest('niv',sc,false);gameEnd2(sc,better);return}const [t,l]=ex[k];
   $('#q').innerHTML=`Segunda parte: ¿qué nivel es <b>${t}</b>?`;$('#part2').innerHTML=`<div class="opts grid">${LEVELS.map((L,i)=>`<button class="opt" type="button" data-i="${i}">${L}</button>`).join('')}</div>`;
   $('#part2').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.i!==l){err++;$('#hud').textContent='Errores: '+err;b.classList.add('wrong');b.disabled=true;return}b.classList.add('right');k++;setTimeout(ask,450)})};ask()}
 function gameEnd2(sc,better){$('#part2').innerHTML='';$('#q').textContent='';endG(err?`${err} ${err===1?'error':'errores'}`:'¡Perfecto, sin errores!',`${better?'¡Nueva mejor marca! ':''}Célula → tejido → órgano → aparato o sistema → organismo. Un paramecio es célula y organismo a la vez: es unicelular.`,gNiv)}}

/* Completa el texto */
const CLOZES=[
{t:'Las células están delimitadas por una {membrana} plasmática, que funciona como un filtro. El medio interno se llama {citoplasma} y es sobre todo {agua}. La actividad de la célula la controla el {material genético}, que en algunas células está dentro de un {núcleo}.',o:['membrana','pared','citoplasma','vacuola','agua','aire','material genético','cloroplasto','núcleo','revólver']},
{t:'Las células {procariotas} no tienen núcleo y su material genético está libre en el {citoplasma}. Tienen una pared {bacteriana} y miden alrededor de {1 µm}. Las {bacterias} son procariotas.',o:['procariotas','eucariotas','citoplasma','núcleo','bacteriana','celular','1 µm','100 µm','bacterias','levaduras']},
{t:'Las células vegetales tienen una {pared} celular rígida, por eso son {poligonales}. En los {cloroplastos} se hace la {fotosíntesis}, y las {vacuolas} guardan agua.',o:['pared','membrana','poligonales','redondas','cloroplastos','núcleos','fotosíntesis','digestión','vacuolas','neuronas']},
{t:'En el microscopio, el {ocular} está junto al ojo y el {objetivo} junto a la muestra. La muestra se pone en la {platina}, el {condensador} concentra la luz y los {tornillos} sirven para enfocar.',o:['ocular','objetivo','platina','revólver','condensador','diafragma','tornillos','espejo']},
{t:'Las células de un mismo tipo forman {tejidos}. Varios tejidos forman un {órgano}, como el corazón o la {hoja}. Varios órganos forman un {aparato} o sistema.',o:['tejidos','órganos','órgano','tejido','hoja','neurona','aparato','orgánulo']}];
function gClo(){const C=pick(CLOZES);const blanks=[];const html=C.t.replace(/\{([^}]+)\}/g,(m,w)=>{const i=blanks.push(w)-1;return`<select id="b${i}" aria-label="Hueco ${i+1}"><option value="">…</option>${shuffle(C.o).map(o=>`<option>${o}</option>`).join('')}</select>`});
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Completa el texto</span></div><p class="cloze">${html}</p><p class="fb" id="fb" role="status"></p><div class="actions" id="acts"><button class="primary" id="chk" type="button">Comprobar</button>${backB()}</div><div id="gend"></div></div>`;wireBack();
 $('#chk').onclick=()=>{let good=0,empty=0;blanks.forEach((w,i)=>{const s=$('#b'+i);if(!s.value)empty++;const ok=s.value===w;s.className=s.value?(ok?'ok':'ko'):'';if(ok)good++});
  if(empty){$('#fb').className='fb ko';$('#fb').textContent='Te quedan huecos por rellenar.';return}
  if(good===blanks.length){blanks.forEach((_,i)=>$('#b'+i).disabled=true);$('#fb').className='fb okk';$('#fb').textContent='¡Texto perfecto!';$('#acts').innerHTML='';endG('¡Completado!','Cada vez sale un texto distinto.',gClo)}
  else{$('#fb').className='fb ko';$('#fb').textContent=`${good} de ${blanks.length} bien. Cambia los que están en rosa.`}}}

/* Parejas */
const PAIRS=[['Neurona','Transmite estímulos y respuestas'],['Espermatozoide','Se mueve con un flagelo'],['Célula de la hoja','Hace la fotosíntesis'],['Vasos conductores','Llevan la savia'],['Células del oído','Detectan el sonido'],['Bacteria','Célula sin núcleo'],['Levadura','Hongo unicelular'],['Alga unicelular','Una célula con cloroplastos']];
function gMem(){const pairs=shuffle(PAIRS).slice(0,6);const cards=shuffle(pairs.flatMap((p,i)=>[{i,txt:p[0],sp:true},{i,txt:p[1]}]));let open=[],tries=0,done=0,lock=false;
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>Parejas de células</span><span id="hud">Intentos: 0</span></div><p class="q">Une cada célula con lo que hace o lo que la caracteriza.</p>
 <div class="mem" id="mem">${cards.map((c,k)=>`<button class="card3d" type="button" data-k="${k}" aria-label="Carta ${k+1}"><span class="in"><span class="f">?</span><span class="b ${c.sp?'sp':''}">${c.txt}</span></span></button>`).join('')}</div><div id="gend"><div class="actions">${backB()}</div></div></div>`;wireBack();
 $('#mem').querySelectorAll('.card3d').forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('up')||b.classList.contains('done'))return;b.classList.add('up');b.setAttribute('aria-label',cards[+b.dataset.k].txt);open.push(b);
  if(open.length===2){tries++;$('#hud').textContent='Intentos: '+tries;const[a,c]=open;const A=cards[+a.dataset.k],C=cards[+c.dataset.k];
   if(A.i===C.i&&A.sp!==C.sp){a.classList.add('done');c.classList.add('done');open=[];done++;if(done===pairs.length){const better=setBest('mem',tries,true);endG(`¡Completado en ${tries} intentos!`,`${better?'¡Es tu mejor marca! ':''}El mínimo posible es 6.`,gMem)}}
   else{lock=true;setTimeout(()=>{a.classList.remove('up');c.classList.remove('up');open=[];lock=false},1100)}}})}

/* =================== PROGRESO =================== */
const BADGES=[['Primera estrella',()=>totalStars()>=1],['Bióloga experta',()=>ST.every(s=>S.stars[s.id]===3)],['Ojo de microscopio',()=>(S.games.mic||0)>=8],['Anatomista',()=>(S.games.par||0)>=7],['Detective',()=>(S.games.det||0)>=7],['Rápida como una bacteria',()=>(S.games.cla||0)>=25],['Reina de las micras',()=>(S.games.num||0)>=7],['Sobresaliente',()=>(S.games.prueba||0)>=9]];
function renderProgress(){const any=totalStars()||Object.keys(S.games).length||Object.keys(S.q).length;
 $('#progress').innerHTML=`<h2>Medallas</h2><div class="badges">${BADGES.map(([n,f])=>{const g=f();return`<span class="badge ${g?'got':''}">${star(g)}${n}</span>`}).join('')}</div>
 <div class="pfoot"><span>${any?'Las medallas se ganan con las estrellas, los juegos y la prueba.':'Todavía no has empezado en este dispositivo.'}</span>${st.confirm?`<span class="rconf">¿Seguro? <button class="rbtn danger" id="rYes" type="button">Sí, borrar</button><button class="rbtn" id="rNo" type="button">Cancelar</button></span>`:`<button class="rbtn" id="rst" type="button"${any?'':' disabled'}>Borrar progreso</button>`}</div>`;
 if($('#rst'))$('#rst').onclick=()=>{st.confirm=true;renderProgress()};if($('#rNo'))$('#rNo').onclick=()=>{st.confirm=false;renderProgress()};
 if($('#rYes'))$('#rYes').onclick=()=>{S={stars:{},q:{},games:{}};save();st.confirm=false;renderProgress();renderScore();setTab(st.tab)}}
function setTab(t){stopTimers();st.tab=t;[['tEst','est'],['tJue','jue'],['tPru','pru']].forEach(([id,k])=>$('#'+id).setAttribute('aria-pressed',k===t));({est:renderEst,jue:renderJue,pru:renderPru})[t]();window.scrollTo({top:0})}
$('#tEst').onclick=()=>setTab('est');$('#tJue').onclick=()=>setTab('jue');$('#tPru').onclick=()=>setTab('pru');
renderScore();renderProgress();setTab('est');
</script>
