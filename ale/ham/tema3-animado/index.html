<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas animadas: Tema 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
:root{
  --bg:#f2eef8; --paper:#fdfdfb; --grid:#e5e0f0; --ink:#1f1d3a; --muted:#5d5a7a; --line:#d4cee6;
  --marker:#c0127e; --marker-soft:#fbe4f1; --ok:#17734a; --ok-soft:#ddf2e6; --btn:#1f1d3a; --btn-fg:#fdfdfb; --chip:#ffffff;
  --lit:#8a3b12; --gold:#d9a400; --lapiz:#1e4f94; --parch:#f7f0e4; --parch-line:#e0d3be;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12101f; --paper:#1b1830; --grid:#25213d; --ink:#ebe8f7; --muted:#a6a1c4; --line:#332e52;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#ebe8f7; --btn-fg:#12101f; --chip:#1f1b36;
  --lit:#f0a774; --gold:#ffd23f; --lapiz:#4b82d9; --parch:#221e33; --parch-line:#3b3654; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12101f; --paper:#1b1830; --grid:#25213d; --ink:#ebe8f7; --muted:#a6a1c4; --line:#332e52;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#ebe8f7; --btn-fg:#12101f; --chip:#1f1b36;
  --lit:#f0a774; --gold:#ffd23f; --lapiz:#4b82d9; --parch:#221e33; --parch-line:#3b3654; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.nav-links{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.back{font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:700}
.back:hover{text-decoration:underline}
.link-app{font-size:.88rem;color:var(--lit);text-decoration:none;font-weight:700;border:1.5px solid var(--line);background:var(--chip);padding:4px 10px;border-radius:8px}
.link-app:hover{border-color:var(--lit)}
header h1{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
header h1 span{color:var(--marker);font-family:var(--f-hand);font-size:1.15em;font-weight:700;margin-left:.15em}
header p{margin:.4em 0 0;color:var(--muted);max-width:60ch}
.pick{display:flex;flex-direction:column;gap:8px}
.pick h2{font:700 .78rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:400 .88rem var(--f-body);padding:6px 11px;border-radius:999px;cursor:pointer}
.chips button[aria-current="true"]{border-color:var(--ink);background:var(--btn);color:var(--btn-fg);font-weight:700}
.chips button.done::after{content:" ✓";color:var(--ok);font-weight:700}
.chips button.done[aria-current="true"]::after{color:var(--btn-fg)}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.sheet{position:relative;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:6px;padding:18px 16px 20px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(30,20,60,.45);display:flex;flex-direction:column;gap:14px;min-width:0}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:0}
.sheet h2.t{font:800 1.4rem var(--f-display);margin:-6px 0 0;text-wrap:balance}
.stage{border-radius:12px;overflow:hidden;border:1px solid var(--parch-line);background:#fbf8f1;line-height:0}
.stage>svg{width:100%;height:auto;display:block}
.stage svg text{font-family:var(--f-body)}
.cap{font-size:1.15rem;line-height:1.5;margin:0;min-height:4.5em;max-width:62ch}
.cap b{color:var(--marker)}
@media (prefers-reduced-motion:no-preference){.cap.in{animation:capin .35s ease-out}@keyframes capin{from{opacity:0;transform:translateY(4px)}}}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--marker)}
.dots i.past{background:var(--muted)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctrl .sp{flex:1}
.primary{background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;font:700 1rem var(--f-body);padding:12px 22px;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:700 1rem var(--f-body);padding:11px 16px;cursor:pointer}
.ghost:disabled,.primary:disabled{opacity:.4;cursor:default}
.nogsap{background:var(--marker-soft);border:1.5px solid var(--marker);border-radius:10px;padding:10px 14px;margin:0}
.steps-list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
/* Comprobación */
.quiz{display:flex;flex-direction:column;gap:16px;border-top:2px solid var(--ink);padding-top:14px}
.quiz h3{font:800 1.15rem var(--f-display);margin:0}
.qq{display:flex;flex-direction:column;gap:8px}
.qq p.q{font-weight:700;margin:0;font-size:1.05rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 1rem var(--f-body);padding:10px 14px;border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.opt.wrong{border-color:var(--marker);background:var(--marker-soft)}
.opt:disabled{cursor:default}
.exp{margin:0;font-size:.95rem}
.exp.b{color:var(--ok)} .exp.mm{color:var(--marker)}
.exp b{color:var(--ink)}
.stamp{font-family:var(--f-hand);font-size:2.4rem;line-height:1;color:var(--ok);transform:rotate(-6deg);display:inline-block}
@media (max-width:420px){header h1{font-size:1.65rem}.cap{font-size:1.05rem}.primary{padding:12px 16px}.ghost{padding:11px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav-links">
    <a class="back" href="../../../#ale/ham">← Arte y Música de Ale</a>
    <a class="link-app" href="../tema3/">📖 Ir a la app de Tema 3 (retos y juegos)</a>
  </div>
  <header>
    <h1>Fichas animadas <span>Tema 3</span></h1>
    <p>Mesopotamia, Egipto y el Clasicismo musical, paso a paso con animaciones interactivas. Pulsa «Siguiente» para avanzar y comprueba lo aprendido al final de cada ficha.</p>
  </header>
  <section class="sheet" id="sheet" aria-labelledby="ttl">
    <p class="kicker" id="kick"></p>
    <h2 class="t" id="ttl"></h2>
    <div class="stage" id="stagebox"><svg id="stage" viewBox="0 0 400 250" role="img" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <p class="cap" id="cap" aria-live="polite"></p>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="ctrl">
      <button class="ghost" id="bBack">← Atrás</button>
      <button class="ghost" id="bAgain">↻ Repetir</button>
      <span class="sp"></span>
      <button class="primary" id="bNext">Siguiente →</button>
    </div>
    <div class="quiz" id="quiz" hidden></div>
  </section>
  <nav class="pick" id="pick" aria-label="Todas las fichas"></nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* =================== DIBUJOS Y UTILIDADES =================== */
const INK='#1f1d3a',MUT='#5d5a7a',MAG='#c0127e',LIT='#8a3b12',GOLD='#d9a400',BLUE='#1e6fd9',LAP='#1e4f94',SAND='#efe0b9',SKY='#e9f1f6',GREEN='#17734a';
const PB=`<rect width="400" height="250" fill="#fbf8f1"/>`;
const SAND_BG=`<rect width="400" height="250" fill="#eef3f7"/><path d="M0 190 Q120 180 240 194 T400 188 L400 250 L0 250 Z" fill="#ebd8ab"/><path d="M0 216 Q160 206 280 220 T400 214 L400 250 L0 250 Z" fill="#ddc594"/>`;
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.size||14}" text-anchor="${o.a||'middle'}" font-weight="${o.w||400}" fill="${o.c||INK}"${o.cls?` class="${o.cls}"`:''}${o.it?' font-style="italic"':''}${o.ff?` font-family="${o.ff}"`:''}>${s}</text>`;
const tw=(s,size)=>Math.round([...s].length*size*.56+20);
const chip=(cls,x,y,s,c=MAG,size=13)=>{const w=tw(s,size),h=size+12;return`<g class="${cls}"><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="#fff" stroke="${c}" stroke-width="1.8"/>${T(x,y+size*.35,s,{size,c,w:700})}</g>`};
const person=(x,y,c='#3a3a3a')=>`<g fill="${c}" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="${x}" cy="${y}" r="3.2" stroke="none"/><line x1="${x}" y1="${y+3}" x2="${x}" y2="${y+13}"/><line x1="${x}" y1="${y+13}" x2="${x-3}" y2="${y+21}"/><line x1="${x}" y1="${y+13}" x2="${x+3}" y2="${y+21}"/><line x1="${x-4}" y1="${y+7}" x2="${x+4}" y2="${y+7}"/></g>`;
const staff=(x1,x2,y,gap=7,c='#8a7a5c')=>[0,1,2,3,4].map(k=>`<line x1="${x1}" y1="${y+k*gap}" x2="${x2}" y2="${y+k*gap}" stroke="${c}" stroke-width="1.1"/>`).join('');

/* =================== ESCENAS =================== */
const SCENES=[
/* ---------- 1. ARCO Y BÓVEDA ---------- */
{id:'arco',b:'Arte',t:'Mesopotamia: el arco y la bóveda',
 keys:[["Mesopotamia", "ladrillo", "adobe"], ["pocos restos", "gran invento: el arco"], ["dovelas", "clave", "reparte el peso"], ["arcos seguidos = bóveda de cañón"]],
 steps:[
  '<b>Mesopotamia</b> («tierra entre ríos») floreció entre el <b>Tigris</b> y el <b>Éufrates</b> hacia el 3000 a. C. Al no tener piedra, construían con <b>ladrillo</b> y <b>adobe</b> (barro con paja secado al sol).',
  'Por usar materiales frágiles nos han llegado <b>pocos restos</b>. Pero para cubrir grandes salas inventaron algo revolucionario que los egipcios no usaban: el <b>arco</b>.',
  'Un arco se construye con piedras o ladrillos en cuña (<b>dovelas</b>). Al colocar la pieza central en lo alto, la <b>clave</b>, todas las piezas se aprietan entre sí y <b>desvían el peso hacia los lados</b>.',
  'Si prolongamos un arco en profundidad, obtenemos una <b>bóveda de cañón</b>. Así crearon techos resistentes y amplios con simples ladrillos de barro.'],
 svg(){
  let s=PB;
  s+=`<g class="pA">
    ${T(200,32,'Mesopotamia: entre dos ríos',{size:18,w:800,c:LIT})}
    <path d="M60 70 Q90 120 110 200" stroke="#4a90e2" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M160 60 Q180 120 220 200" stroke="#4a90e2" stroke-width="12" fill="none" stroke-linecap="round"/>
    ${T(82,100,'Tigris',{size:12,w:700,c:'#21528c'})}
    ${T(208,130,'Éufrates',{size:12,w:700,c:'#21528c'})}
    <g class="brik" transform="translate(260 76)">
      <rect x="0" y="0" width="90" height="42" rx="4" fill="#c49a68" stroke="#7a5528" stroke-width="2"/>
      <rect x="10" y="8" width="70" height="26" fill="#b08453" opacity=".4"/>
      ${T(45,26,'Ladrillo cocido',{size:11,w:700,c:'#fff'})}
    </g>
    <g class="brik" transform="translate(260 136)">
      <rect x="0" y="0" width="90" height="42" rx="4" fill="#d8b27c" stroke="#8a6330" stroke-width="2"/>
      ${[16,28,40,54,68,76].map(x=>`<line x1="${x}" y1="12" x2="${x-4}" y2="30" stroke="#684a20" stroke-width="1.5"/>`).join('')}
      ${T(45,26,'Adobe (paja)',{size:11,w:700,c:INK})}
    </g>
  </g>`;
  s+=`<g class="pB">
    <rect x="60" y="210" width="280" height="14" fill="#7a5528"/>
    <rect class="pillar" x="110" y="110" width="28" height="100" fill="#c49a68" stroke="#7a5528" stroke-width="2"/>
    <rect class="pillar" x="262" y="110" width="28" height="100" fill="#c49a68" stroke="#7a5528" stroke-width="2"/>
    <g id="dovs">
      ${[[-42,-22],[-30,-48],[-14,-68],[14,-68],[30,-48],[42,-22]].map(([dx,dy],i)=>`
        <rect class="dov" x="${200+dx-11}" y="${108+dy}" width="22" height="18" rx="2" fill="#d9b17d" stroke="#7a5528" stroke-width="1.6"/>
      `).join('')}
    </g>
    <g class="clave">
      <path d="M190 32 L210 32 L206 56 L194 56 Z" fill="${MAG}" stroke="#7a0d4f" stroke-width="2"/>
      ${T(200,24,'CLAVE',{size:12,w:800,c:MAG})}
    </g>
    <g class="forces">
      <path d="M188 44 Q140 54 124 104" stroke="${MAG}" stroke-width="3.5" fill="none" stroke-dasharray="4 4"/>
      <path d="M212 44 Q260 54 276 104" stroke="${MAG}" stroke-width="3.5" fill="none" stroke-dasharray="4 4"/>
      ${T(200,84,'reparto de cargas',{size:12,w:700,c:MAG})}
    </g>
  </g>`;
  s+=`<g class="pC">
    <path d="M120 180 Q200 80 280 180 L350 140 Q270 40 190 140 Z" fill="#e4c79e" stroke="#7a5528" stroke-width="2.5"/>
    <path d="M120 180 Q200 80 280 180" fill="none" stroke="#7a5528" stroke-width="3"/>
    ${[0,1,2,3,4].map(k=>`<path class="bovline" d="M${138+k*15} ${170-k*8} Q${218+k*15} ${70-k*8} ${298+k*15} ${170-k*8}" fill="none" stroke="#b08453" stroke-width="1.8"/>`).join('')}
    ${chip('bovlab',200,224,'Bóveda de cañón = sucesión continua de arcos',LIT,13)}
  </g>`;
  return s;
 },
 anim(tl,E){
  gsap.set(['.pB','.pC','.clave','.forces'],{opacity:0});
  tl.from('.pA',{opacity:0,duration:.4});tl.from('.brik',{x:40,opacity:0,stagger:.3,duration:.5,ease:'back.out(1.7)'});E();
  tl.to('.pA',{opacity:0,duration:.35});tl.to('.pB',{opacity:1,duration:.35},'<');
  tl.from('.pillar',{y:60,opacity:0,stagger:.2,duration:.4});tl.from('.dov',{scale:0,stagger:.12,duration:.3,transformOrigin:'50% 50%'});E();
  tl.to('.clave',{opacity:1,y:10,duration:.5,ease:'bounce.out'});tl.to('.forces',{opacity:1,duration:.4});E();
  tl.to('.pB',{opacity:0,duration:.35});tl.to('.pC',{opacity:1,duration:.35},'<');
  tl.from('.bovline',{opacity:0,stagger:.15,duration:.4});tl.from('.bovlab',{y:12,opacity:0,duration:.4});E();
 },
 qs:[
  {q:'¿Qué gran invento arquitectónico introdujeron los mesopotámicos?',ok:'El arco y la bóveda',no:['El dintel plano de piedra','La columna con capitel dórico','La pirámide de caras lisas'],exp:'Los mesopotámicos crearon el arco y la bóveda para cubrir techos con pequeños ladrillos.'},
  {q:'¿Qué pieza es la que cierra el arco y reparte las fuerzas hacia los lados?',ok:'La clave (pieza central superior)',no:['La dovela inferior','El dintel','El sillar de cimiento'],exp:'La clave encaja en la parte superior y hace que todas las dovelas queden encajadas a presión.'}
 ]},

/* ---------- 2. ZIGURAT ---------- */
{id:'zigurat',b:'Arte',t:'El zigurat: santuario y observatorio',
 keys:[["zigurat", "sumerios", "puente cielo-tierra"], ["Ur-Nammu", "zigurat de Ur", "3 plantas"], ["solo suben los sacerdotes"], ["santuario de Nanna", "observatorio"]],
 steps:[
  'El <b>zigurat</b> era la gran torre escalonada de los templos mesopotámicos, creada por los <b>sumerios</b>. Se consideraba un <b>puente entre el cielo y la tierra</b>.',
  'El rey <b>Ur-Nammu</b> mandó levantar el gran <b>zigurat de Ur</b>: una mole de ladrillo macizo con <b>tres plantas escalonadas</b> y terrazas.',
  'Solo los <b>sacerdotes</b> tenían permitido subir por las rampas y escaleras exteriores para realizar ceremonias y acercarse a los dioses.',
  'En la cumbre estaba el <b>santuario</b> dedicado a <b>Nanna</b> (divinidad de la luna). Sus esquinas orientadas a los <b>cuatro puntos cardinales</b> le permitían servir también como <b>observatorio astronómico</b>.'],
 svg(){
  let s=SAND_BG;
  s+=`<g class="zig" transform="translate(20 10)">
    <polygon points="50,180 310,180 294,136 66,136" fill="#bfa075" stroke="#5a3d1b" stroke-width="2"/>
    <polygon points="80,136 280,136 266,96 94,96" fill="#cca97d" stroke="#5a3d1b" stroke-width="2"/>
    <polygon points="112,96 248,96 238,66 122,66" fill="#dcba8c" stroke="#5a3d1b" stroke-width="2"/>
    <rect class="sanct" x="162" y="44" width="36" height="22" fill="#ffe29b" stroke="#7a5528" stroke-width="2"/>
    <line x1="180" y1="180" x2="180" y2="66" stroke="#7a5528" stroke-width="5"/>
    <line x1="66" y1="180" x2="162" y2="136" stroke="#7a5528" stroke-width="3"/>
    <line x1="294" y1="180" x2="198" y2="136" stroke="#7a5528" stroke-width="3"/>
  </g>`;
  s+=`<g class="priest">${person(70,210,'#7a3818')}${T(70,236,'sacerdote',{size:11,w:700,c:'#7a3818'})}</g>`;
  s+=`<g class="sky-ast">
    <path d="M330 36 A18 18 0 1 0 348 54 A14 14 0 1 1 330 36 Z" fill="${GOLD}"/>
    ${[[310,30],[360,35],[340,75],[290,60]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2" fill="${GOLD}"/>`).join('')}
    ${T(335,90,'Nanna (la luna)',{size:12,w:700,c:LIT})}
  </g>`;
  s+=chip('ur_lab',200,230,'Rey Ur-Nammu · 3 plantas y terrazas',INK,13);
  return s;
 },
 anim(tl,E){
  gsap.set(['.priest','.sky-ast','.ur_lab'],{opacity:0});
  tl.from('.zig polygon',{scaleY:0,transformOrigin:'50% 100%',stagger:.25,duration:.6,ease:'power2.out'});
  tl.from('.sanct',{scale:0,duration:.4,transformOrigin:'50% 100%',ease:'back.out(2)'});E();
  tl.from('.ur_lab',{opacity:0,y:10,duration:.4});E();
  tl.to('.priest',{opacity:1,duration:.3});
  tl.to('.priest',{x:130,y:-140,duration:2.2,ease:'power1.inOut'});E();
  tl.to('.sanct',{fill:'#fff3b8',stroke:GOLD,duration:.4});
  tl.from('.sky-ast',{opacity:0,scale:0,transformOrigin:'50% 50%',duration:.6,ease:'back.out(1.8)'});E();
 },
 qs:[
  {q:'¿Quién podía acceder a la cima del zigurat?',ok:'Únicamente los sacerdotes',no:['Todo el pueblo en fiestas','El ejército y los esclavos','Los comerciantes extranjeros'],exp:'El santuario superior era la morada del dios y estaba reservado a los sacerdotes.'},
  {q:'¿Qué rey sumerio ordenó construir el famoso zigurat de Ur?',ok:'Ur-Nammu',no:['Nabucodonosor II','Hammurabi','Ramsés II'],exp:'Ur-Nammu fue el rey sumerio que mandó levantar la torre escalonada de Ur.'}
 ]},

/* ---------- 3. PUERTA DE ISHTAR ---------- */
{id:'ishtar',b:'Arte',t:'La Puerta de Ishtar y Babilonia',
 keys:[["palacios", "poder del rey"], ["Nabucodonosor II", "Babilonia", "s. VI a. C."], ["Puerta de Ishtar", "ladrillo vidriado azul"], ["hoy en Berlín", "Museo de Pérgamo"]],
 steps:[
  'Frente a los templos sumerios, los <b>palacios</b> mesopotámicos eran la gran creación de los <b>acadios</b>, asirios y babilonios para exhibir el <b>poder del rey</b>.',
  'El rey <b>Nabucodonosor II</b> reconstruyó la gran ciudad de <b>Babilonia</b> en el siglo VI a. C., fortificada con doble muralla y ocho monumentales puertas.',
  'La más hermosa era la <b>Puerta de Ishtar</b>: revestida de <b>ladrillo vidriado azul brillante</b> y decorada con relieves de <b>leones</b> y <b>dragones (mushkhushu)</b> amarillos y blancos.',
  'En el siglo XX fue excavada por arqueólogos alemanes, desmontada y reconstruida en el <b>Museo de Pérgamo de Berlín</b>.'],
 svg(){

/* =================== MOTOR REPRODUCTOR =================== */
const KEY='ham-t3-anim-v1';
let DONE={};try{DONE=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const saveDone=()=>{try{localStorage.setItem(KEY,JSON.stringify(DONE))}catch(e){}};
const HAS=typeof window.gsap!=='undefined';
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=$('#stage');
const st={i:0,k:-1,tl:null,play:null};
const KBAND=`<rect y="250" width="400" height="50" fill="#fff6e0"/><line x1="0" y1="250.5" x2="400" y2="250.5" stroke="#e0d3be"/><g id="kband"></g>`;
function renderKeys(){const sc=SCENES[st.i],g=document.getElementById('kband');if(!g||!sc.keys)return;const ks=sc.keys[st.k]||[];let size=13,ws=[];
  const W=()=>{ws=ks.map(k=>tw(k,size));return ws.reduce((a,b)=>a+b,0)+8*Math.max(0,ks.length-1)};while(W()>388&&size>9)size-=.5;
  const cols=[MAG,LIT,BLUE,GREEN];let x=200-W()/2;
  g.innerHTML=ks.map((k,i)=>{const cx=x+ws[i]/2;x+=ws[i]+8;return chip('kk',cx,275,k,cols[i%4],size)}).join('');
  if(HAS&&!RM)gsap.from('#kband .kk',{y:12,opacity:0,stagger:.12,duration:.35,ease:'back.out(2)'})}


function renderPick(){
  const groups=[['Arte','Arte · Mesopotamia y Egipto'],['Música','Música · El Clasicismo']];
  $('#pick').innerHTML=groups.map(([b,h])=>`<h2>${h}</h2><div class="chips">${SCENES.map((sc,i)=>sc.b===b?`<button data-i="${i}" class="${DONE[sc.id]?'done':''}" aria-current="${i===st.i}">${i+1}. ${sc.t}</button>`:'').join('')}</div>`).join('');
  $('#pick').querySelectorAll('button').forEach(b=>b.onclick=()=>load(+b.dataset.i,true));
}

function dots(){
  const n=SCENES[st.i].steps.length;
  $('#dots').innerHTML=Array.from({length:n},(_,j)=>`<i class="${j===st.k?'on':j<st.k?'past':''}"></i>`).join('');
}

function caption(){
  const sc=SCENES[st.i],c=$('#cap');
  c.classList.remove('in');void c.offsetWidth;
  c.innerHTML=sc.steps[st.k]||'';c.classList.add('in');dots();renderKeys();
  $('#bBack').disabled=st.k<=0;
  const last=st.k>=sc.steps.length-1;
  $('#bNext').textContent=last?(st.i<SCENES.length-1?'Siguiente ficha →':'Volver a la primera'):'Siguiente →';
  if(last)showQuiz();
}

function load(i,scroll){
  if(st.play)st.play.kill();if(st.tl)st.tl.kill();
  st.i=i;st.k=-1;const sc=SCENES[i];
  $('#kick').textContent=`Ficha ${i+1} de ${SCENES.length} · ${sc.b==='Arte'?'Historia del Arte':'Historia de la Música'}`;
  $('#ttl').textContent=sc.t;stage.setAttribute('aria-label',sc.t);
  $('#quiz').hidden=true;$('#quiz').innerHTML='';
  renderPick();
  if(!HAS){
    $('#stagebox').hidden=true;
    $('#cap').innerHTML=`<span class="nogsap" style="display:block">No se han podido cargar las animaciones (quizá no hay conexión). Aquí tienes el texto de la ficha:</span>`;
    $('#cap').insertAdjacentHTML('beforeend',`<ol class="steps-list">${sc.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`);
    $('#dots').innerHTML='';
    ['bBack','bAgain'].forEach(id=>$('#'+id).hidden=true);
    st.k=sc.steps.length-1;$('#bNext').textContent=i<SCENES.length-1?'Siguiente ficha →':'Volver a la primera';
    showQuiz();return;
  }
  stage.setAttribute('viewBox',sc.keys?'0 0 400 300':'0 0 400 250');stage.innerHTML=sc.svg()+(sc.keys?KBAND:'');
  const tl=gsap.timeline({paused:true});
  let n=0;sc.anim(tl,()=>tl.addLabel('e'+(n++)));
  if(n!==sc.steps.length)console.warn('Pasos y etiquetas no cuadran en',sc.id,n,sc.steps.length);
  st.tl=tl;tl.progress(0).pause();
  if(scroll)$('#sheet').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});
  next();
}

function playStep(k){
  const tl=st.tl,from=k>0?tl.labels['e'+(k-1)]:0,to=tl.labels['e'+k];
  if(st.play)st.play.kill();
  if(RM){tl.pause();tl.seek(to);return}
  tl.pause();tl.seek(from);st.play=tl.tweenFromTo(from,to);
}

function next(){
  const sc=SCENES[st.i];
  if(st.k>=sc.steps.length-1){load(st.i<SCENES.length-1?st.i+1:0,true);return}
  if(st.k>=0&&st.play&&st.play.isActive()){st.play.kill();st.tl.seek(st.tl.labels['e'+st.k])}
  st.k++;caption();playStep(st.k);
}

function back(){
  if(st.k<=0)return;if(st.play)st.play.kill();
  st.k--;st.tl.pause();st.tl.seek(st.tl.labels['e'+st.k]);caption();$('#quiz').hidden=true;
}

function again(){if(st.k<0)return;playStep(st.k);}

$('#bNext').onclick=next;$('#bBack').onclick=back;$('#bAgain').onclick=again;
document.addEventListener('keydown',e=>{
  if(e.target.closest('button.opt'))return;
  if(e.key==='ArrowRight'){next()}else if(e.key==='ArrowLeft'){back()}
});

/* =================== COMPRUEBA =================== */
function showQuiz(){
  const sc=SCENES[st.i],q=$('#quiz');if(!q.hidden&&q.dataset.id===sc.id)return;
  q.dataset.id=sc.id;q.hidden=false;let right=0,answered=0;
  q.innerHTML=`<h3>Comprueba lo que has visto</h3>`+sc.qs.map((x,j)=>`
    <div class="qq" data-j="${j}">
      <p class="q">${j+1}. ${x.q}</p>
      <div class="opts">${shuffle([x.ok,...x.no]).map(o=>`<button class="opt" data-ok="${o===x.ok}">${o}</button>`).join('')}</div>
      <p class="exp" hidden></p>
    </div>
  `).join('')+`<p class="exp" id="qend" hidden></p>`;
  
  q.querySelectorAll('.qq').forEach(box=>{
    const x=sc.qs[+box.dataset.j];
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.ok==='true';
      box.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.dataset.ok==='true')o.classList.add('right')});
      if(!ok)b.classList.add('wrong');
      const ex=box.querySelector('.exp');ex.hidden=false;ex.className='exp '+(ok?'b':'mm');
      ex.innerHTML=(ok?'<b>¡Bien!</b> ':'<b>Casi.</b> ')+x.exp;
      answered++;if(ok)right++;
      if(answered===sc.qs.length){
        const end=$('#qend');end.hidden=false;
        if(right===sc.qs.length){
          DONE[sc.id]=1;saveDone();renderPick();
          end.className='exp b';end.innerHTML=`<span class="stamp">¡Ficha superada!</span>`;
        } else {
          end.className='exp mm';end.innerHTML='Repasa la ficha con «← Atrás» o vuelve a verla desde el principio, y prueba otra vez.';
        }
      }
    });
  });
}

renderPick();load(0,false);
</script>
