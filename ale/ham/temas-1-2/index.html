<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arte y Música: Temas 1 y 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
/* Layout: misma familia que el repaso de Matemáticas (hoja cuadriculada, rotulador magenta); las ilustraciones van en paneles de roca o de pergamino */
:root{
  --bg:#eaeff7; --paper:#fdfdfb; --grid:#e2e9f4; --ink:#1b2a4a; --muted:#56637d; --line:#cfd8e7;
  --marker:#c0127e; --marker-soft:#fbe4f1; --ok:#17734a; --ok-soft:#ddf2e6; --btn:#1b2a4a; --btn-fg:#fdfdfb; --chip:#ffffff;
  --parch:#f6efe0; --parch-line:#e2d5b8; --voice2:#c0127e;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1524; --paper:#151f36; --grid:#1d2a46; --ink:#e4eaf6; --muted:#9ba8c3; --line:#2a3856;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#e4eaf6; --btn-fg:#0e1524; --chip:#18233d;
  --parch:#22283a; --parch-line:#3a4258; --voice2:#ff5fb9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1524; --paper:#151f36; --grid:#1d2a46; --ink:#e4eaf6; --muted:#9ba8c3; --line:#2a3856;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#e4eaf6; --btn-fg:#0e1524; --chip:#18233d;
  --parch:#22283a; --parch-line:#3a4258; --voice2:#ff5fb9; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.back{font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:700}
.back:hover{text-decoration:underline}
header h1{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
header h1 span{color:var(--marker);font-family:var(--f-hand);font-size:1.15em;font-weight:700;margin-left:.15em}
header p{margin:.4em 0 0;color:var(--muted);max-width:60ch}
.tabs{display:flex;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 .95rem var(--f-body);padding:10px 6px;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:400 .9rem var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
button:focus-visible,select:focus-visible,.opt:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.sheet{position:relative;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:6px;padding:20px 18px 22px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(20,30,60,.45);display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-right:60px}
.q{font-size:1.15rem;line-height:1.55;margin:0;font-weight:700}
.ill{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.ill svg{width:100%;max-width:360px;height:auto;display:block;border-radius:10px}
.ill.small svg{max-width:200px}
.ill figcaption{font-size:.88rem;color:var(--muted);text-align:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 1.02rem var(--f-body);padding:10px 14px;border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.opt.wrong{border-color:var(--marker);background:var(--marker-soft)}
.opt:disabled{cursor:default}
.vf{flex-direction:row}
.vf .opt{flex:1;text-align:center;font-weight:700}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;background:var(--chip);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.row.right{border-color:var(--ok)}
.row.wrong{border-color:var(--marker)}
.row span{min-width:0}
.row small{display:block;color:var(--marker);font-weight:700;grid-column:1/-1}
.row.right small{color:var(--ok)}
select{font:400 1rem var(--f-body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.primary{background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;font:700 1rem var(--f-body);padding:12px 22px;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:700 1rem var(--f-body);padding:11px 18px;cursor:pointer}
.need{color:var(--marker);font-weight:700;margin:0}
.stamp{position:absolute;top:10px;right:14px;font-family:var(--f-hand);font-size:3.4rem;line-height:1;transform:rotate(-8deg);pointer-events:none}
.stamp.b{color:var(--ok)} .stamp.mm{color:var(--marker)}
.verdict{font-weight:700;font-size:1.05rem;margin:0}
.verdict.b{color:var(--ok)} .verdict.mm{color:var(--marker)}
.exp{border-top:2px solid var(--ink);padding-top:10px;margin:0}
/* Estudiar */
.study{display:flex;flex-direction:column;gap:18px}
.block-title{font:800 1.25rem var(--f-display);margin:8px 0 0}
.card h2{font:800 1.3rem var(--f-display);margin:0;text-wrap:balance}
.card .kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.card li::marker{color:var(--marker)}
.figs{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.figs .ill{flex:1 1 200px;min-width:0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:420px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;background:var(--paper)}
.tbl th{background:var(--chip);font-weight:700}
.practice-link{align-self:flex-start}
/* Progreso */
.progress{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:16px}
.progress h2,.summary h2{font:800 1.15rem var(--f-display);margin:0 0 10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px 52px;gap:10px;align-items:center;font-size:.92rem;padding:5px 0}
.bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.low{background:var(--marker)}
.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:.9rem;color:var(--muted)}
.rbtn{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;font:700 .9rem var(--f-body);padding:7px 12px;cursor:pointer;margin-left:6px}
.rbtn:disabled{opacity:.45;cursor:default}
.rbtn.danger{background:var(--marker);border-color:var(--marker);color:var(--paper)}
.rconf{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px;color:var(--ink);font-weight:700}
.grade{font-family:var(--f-hand);color:var(--marker);font-size:4.4rem;line-height:1;border:3px solid var(--marker);border-radius:50%;width:140px;height:110px;display:grid;place-items:center;transform:rotate(-6deg);margin:6px 0 10px}
.qlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.qlist li{display:flex;gap:10px;align-items:baseline}
.qlist b{font-family:var(--f-hand);font-size:1.5rem;width:1.2em;flex:none}
/* textos dentro de los dibujos */
.ink{fill:var(--ink)} .inks{stroke:var(--ink)} .mut{fill:var(--muted)} .v2{fill:var(--voice2)} .v2s{stroke:var(--voice2)} .parch{fill:var(--parch)} .parchs{stroke:var(--parch-line)}
svg text{font-family:var(--f-body)}
@media (max-width:420px){header h1{font-size:1.65rem}.prow{grid-template-columns:minmax(0,1fr) 70px 46px}.stamp{font-size:2.8rem}.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.stamp{animation:pop .25s ease-out}@keyframes pop{from{transform:rotate(-8deg) scale(1.6);opacity:0}}}
</style>
</head>

<div class="wrap">

 tabla:{h:['','Cantábrica','Levantina'],r:[['Época','Paleolítico Superior','Neolítico'],['Lugar','Fondo de cuevas','Aire libre y abrigos'],['Temas','Animales aislados','Escenas con personas'],['Estilo','Realista, con volumen','Esquemático'],['Color','Polícroma','Monócroma']]}},
{b:'m1',t:'La música en la Edad Media y el canto gregoriano',figs:[['tetragrama','Notación gregoriana: cuatro líneas y notas cuadradas (dibujo)']],p:[
 'La música religiosa es <b>austera y puramente vocal</b>. Se adoptan himnos con texto litúrgico en forma de estrofa.',
 'El <b>canto gregoriano</b> es <b>canto llano</b>, <b>sin acompañamiento instrumental</b> y <b>monódico</b> (una sola melodía).',
 'La música está <b>supeditada al texto</b>: sigue sus acentos, frases y expresividad.',
 'El nombre viene de una <b>falsa atribución al Papa Gregorio I Magno</b> (535-604). No es obra de una persona: fue un proceso de muchas generaciones que Gregorio I impulsó.',
 'El papado recopiló las melodías en un libro, el <b>Antifonario</b>, y formó cantores en cada iglesia: la <b>Schola Cantorum</b>.']},
{b:'m1',t:'Tropos y secuencias',p:[
 'Un <b>melisma</b> es un grupo de varias notas cantadas sobre una misma sílaba.',
 '<b>Tropo</b>: consiste en <b>añadir palabras</b> a los melismas gregorianos.',
 '<b>Secuencia</b>: composición en <b>prosa rítmica</b> que se añadía como melisma <b>al final del Aleluya</b>. Ejemplo: <i>Victimae paschali laudes</i>.']},
{b:'m1',t:'El Camino de Santiago',figs:[['vieira','La concha de vieira y la estrella (dibujo)',true]],p:[
 'Según la leyenda, en el <b>siglo IX</b> unos pastores vieron una estrella fija sobre un campo y allí encontraron la <b>tumba del apóstol Santiago</b>.',
 'En el siglo X terminan las invasiones de vikingos, magiares y sarracenos y llegan <b>peregrinos de toda Europa</b>, que traen el latín, el <b>arte románico</b> y la <b>música románica</b>.',
 'El canto al apóstol se convierte en uno de los temas más usados. El Camino vive su mayor auge entre los <b>siglos XI y XV</b>.']},
{b:'m1',t:'Juglares y trovadores',figs:[['laud','Laúd'],['pandero','Pandero'],['gaita','Gaita'],['arpa','Arpa']],p:[
 '<b>Juglares</b>: artistas ambulantes que iban de aldea en aldea y de castillo en castillo. Mitad poetas, mitad saltimbanquis: declamación, malabares, música y sátira.',
 'Transmiten la música popular <b>no litúrgica</b>, cantan en <b>lengua vulgar</b> (poesía, canciones al vino, a la mujer o contra los eclesiásticos) y usan instrumentos <b>prohibidos por la Iglesia</b>.',
 '<b>Trovadores</b>: de <b>clase social más elevada</b>; se consideraban superiores a los juglares. <b>Componían</b> las piezas que interpretaban: canciones heroicas, de amor, de política, morales, fúnebres…',
 'Los trovadores alcanzan su apogeo en la <b>segunda mitad del siglo XII</b>.']},
{b:'m1',t:'Alfonso X y las Cantigas de Santa María',figs:[['codice','Un códice medieval con música (dibujo)']],p:[
 'Hijo de <b>Fernando III «el Santo»</b>, rey de Castilla y León. Muy culto y avanzado para su época.',
 'Los nobles apoyaron a su hijo <b>Sancho IV «el Bravo»</b>. <b>Sevilla</b> fue la única ciudad que siguió fiel a Alfonso; está enterrado en su catedral.',
 'Impulsó la <b>Escuela de Traductores de Toledo</b> y escribió una historia de España, un tratado de astronomía y las <b>Cantigas de Santa María</b>.',
 'Las Cantigas (mediados del <b>siglo XIII</b>) son un cancionero religioso de <b>427 composiciones</b> en honor a la Virgen, en <b>galaico-portugués</b>. La mayoría cuentan <b>milagros</b> de la Virgen.',
 'No las escribió todas el rey: al menos diez son suyas con seguridad (quizá un centenar); el resto, de los colaboradores de su corte.']},
{b:'m1',t:'La polifonía',figs:[['monodia','Monodia'],['polifonia','Polifonía']],p:[
 'La <b>polifonía</b> es el arte de <b>combinar sonidos de forma simultánea</b>. Se desarrolla desde el <b>siglo IX</b> y culmina en el <b>siglo XVI</b>.',
 '<b>Ars Antiqua</b>: la música de los <b>siglos XII y XIII</b>. Mejora la notación y la técnica, lo que facilita la polifonía.',
 '<b>Ars Nova</b>: la música del <b>siglo XIV</b>. Más libertad para el compositor, ritmos y movimientos de voces más complejos; preocupación por la medida y el ritmo.',
 'En la Iglesia solo se admitía el <b>órgano</b>; después entran la viola y la flauta. Juglares y trovadores usan <b>laúdes, arpas, gaitas, panderos y tamboriles</b>.']},
{b:'a2',t:'Arte mobiliar',figs:[['venus','Venus paleolítica (dibujo)',true],['baston','Bastón de mando (dibujo)']],p:[
 'Objetos que <b>se pueden mover</b> de un sitio a otro.',
 'Hechos de <b>piedra, hueso o marfil</b>, con relieves y grabados, a veces pintados.',
 'Destacan plaquetas con animales recortados, <b>bastones de mando</b> (instrumentos de caza o símbolos de autoridad), armas como los <b>propulsores</b> y colgantes.',
 '<b>Venus paleolíticas</b>: estatuillas de mujeres con los atributos femeninos muy marcados, ligadas al <b>culto a la fertilidad y la maternidad</b>. La más famosa es la <b>Venus de Willendorf</b>.']},
{b:'a2',t:'Arquitectura megalítica: el menhir',figs:[['menhir','Menhir'],['alineamiento','Alineamiento']],p:[
 'La arquitectura nace en el <b>Neolítico</b>, cuando el ser humano se hace <b>sedentario</b>, y dura hasta la <b>Edad del Bronce</b>.',
 '<b>Megalito</b> viene de <i>megas</i> (grande) y <i>lithos</i> (piedra): construcciones con grandes bloques de piedra. Función <b>religiosa y funeraria</b>.',
 '<b>Menhir</b> («piedra larga»): una piedra clavada en vertical. Es el elemento fundamental del megalitismo. Quizá servía para fijar las almas de los muertos, rendir culto al sol o marcar el territorio.',
 'Varios menhires en <b>hilera</b> forman un <b>alineamiento</b>.']},
{b:'a2',t:'Crómlech y dolmen',figs:[['cromlech','Crómlech'],['dolmen','Dolmen'],['corredor','Dolmen de corredor, visto desde arriba']],p:[
 '<b>Crómlech</b> («corona de piedras»): menhires colocados <b>en círculo</b>. Quizá un santuario para cultos agrarios o solares. El más conocido: <b>Stonehenge</b> (Gran Bretaña).',
 '<b>Dolmen</b> («tablero de piedra»): piedras verticales cubiertas por otras <b>horizontales</b>. Se usaba como <b>enterramiento colectivo</b>.',
 'Si tiene un pasillo que lleva a una cámara es un <b>dolmen de corredor</b> o de galería.',
 'En <b>Antequera (Málaga)</b>: el <b>dolmen de El Romeral</b> (de corredor: pasillo y cámara sepulcral) y el <b>dolmen de Menga</b> (de galería: pasillo adintelado).']},
{b:'a2',t:'Megalitos de las Islas Baleares',figs:[['talayot','Talayot'],['naveta','Naveta'],['taula','Taula']],p:[
 'Se construyen en la <b>Edad del Bronce</b>. Es una arquitectura <b>ciclópea</b>: grandes bloques de piedra.',
 '<b>Talayot</b>: torre circular, cuadrada o escalonada. Se pensaba que era solo defensiva; quizá también ritual y almacén para guardar y repartir la carne.',
 '<b>Naveta</b>: construcción alargada con forma de <b>barco invertido</b>. Sirvió de <b>vivienda</b> y de <b>enterramiento colectivo</b>.',
 '<b>Taula</b>: dos bloques, uno <b>vertical</b> que sostiene otro <b>horizontal</b>, como una mesa. Ritual: cerca se han hallado restos de hogueras y ofrendas de animales.']},
{b:'m2',t:'Características del Barroco musical',figs:[['acordes','Composición vertical: acordes'],['cronologia','Los compositores del tema en el tiempo']],p:[
 'Va de <b>1600 a 1750</b>, año en que muere <b>Johann Sebastian Bach</b>.',
 'La música <b>profana</b> prevalece sobre la religiosa.',
 'Composición <b>vertical</b>, a través de <b>acordes</b>. Mucha <b>ornamentación</b>, como en las otras artes.',
 '<b>Ritmos muy marcados</b>, mecánicos. La música <b>instrumental y la vocal</b> tienen la misma importancia.',
 'Formas <b>instrumentales</b>: sonata, suite, concierto grosso, obertura, fuga. Formas <b>vocales</b>: ópera, oratorio, cantata, pasión.']},
{b:'m2',t:'Italia: Albinoni y Vivaldi',figs:[['estaciones','Las cuatro estaciones'],['violin','Violín',true]],p:[
 'En Italia surgen las raíces del nuevo estilo. La <b>escuela veneciana</b> hace una música fastuosa y colorista.',
 '<b>Tommaso Albinoni</b>: nació en <b>Venecia</b>. Maestro de canto, influyó en Bach. Era un <b>dilettante</b> (componía por componer). Ópera <i>Zenobia</i>; hoy se le recuerda por su música instrumental, como el <i>Adagio</i>.',
 '<b>Antonio Vivaldi</b>: nació en <b>Venecia (1678)</b> y murió en <b>Viena (1741)</b>. Hijo de violinista. Le llamaban el <b>«Padre Rosso»</b> (cura rojo) por el color de su pelo y por ser sacerdote.',
 'Obra más popular: <b>Las cuatro estaciones</b>, cuatro <b>conciertos</b> que describen cada estación. También óperas (<i>Orlando</i>, <i>La olimpiada</i>) y conciertos de flauta y mandolina.']},
{b:'m2',t:'Inglaterra: Haendel',p:[
 'Inglaterra iba algo atrasada en música. Su músico más notable fue de origen <b>alemán</b>: <b>Georg Friedrich Haendel</b>.',
 'Nació en <b>Halle (Alemania) en 1685</b>. Su padre quería que estudiara Derecho, pero de niño practicaba en secreto con un clavicordio en la buhardilla.',
 'Se quedó a vivir en <b>Inglaterra</b> bajo la protección del rey <b>Jorge I</b> y se nacionalizó inglés. Al final de su vida se quedó ciego.',
 'Obras: la ópera <i>Julio César</i>; las suites <b>Música acuática</b> (para un paseo del rey en barco por el <b>Támesis</b>) y <b>Música para los reales fuegos de artificio</b>; el oratorio <b>El Mesías</b>, escrito en <b>cuatro semanas</b>, con <b>tres partes</b>.']},
{b:'m2',t:'Alemania: Pachelbel y Bach',figs:[['organo','Órgano',true],['clave','Clave (clavecín)']],p:[
 'Los alemanes llevan las formas italianas a su <b>máxima perfección</b>; de aquí saldrán las formas clásicas.',
 '<b>Johann Pachelbel</b>: nació y murió en <b>Núremberg</b> (1653-1706). Impulsó el estilo de órgano y clave. Su obra más popular: el <b>Canon</b>.',
 '<b>Johann Sebastian Bach</b>: nació en <b>Eisenach</b> y murió en <b>Leipzig</b> (1750). Familia pobre con gran tradición musical. Huérfano a los <b>nueve años</b>, lo educó su hermano mayor.',
 'Se casó dos veces (María Bárbara y Ana Magdalena) y tuvo <b>20 hijos</b>. Fue organista de la corte y profesor muy exigente.',
 'Obras: <b>La Pasión según san Mateo</b>, los seis <b>Conciertos de Brandemburgo</b> y mucha música para <b>órgano</b>, como la <b>Tocata y fuga</b>.']},
{b:'m2',t:'España: Gaspar Sanz',figs:[['guitarra','Guitarra barroca (dibujo)',true]],p:[
 '<b>Guitarrista</b> y compositor nacido en <b>Calanda (Teruel)</b>. Estudió Teología en Salamanca y estuvo en Nápoles.',
 'Fue profesor de guitarra de don Juan de Austria, hijo de Felipe IV.',
 'Obra principal: <b>Instrucción de música sobre la guitarra española</b>, con consejos técnicos y canciones y danzas españolas.',
 'Con ella sentó las <b>bases de la técnica de la guitarra clásica moderna</b>.']},

{b:'m2',t:'test',q:'¿Cuántos hijos tuvo Bach?',ok:'20',no:['2','9','12'],exp:'Tuvo 20 hijos, algunos músicos.'},
{b:'m2',t:'test',img:'organo',q:'Bach escribió mucha música para este instrumento, como la Tocata y fuga. ¿Cuál es?',ok:'El órgano',no:['El laúd','La guitarra','La gaita'],exp:'El órgano.'},
{b:'m2',t:'test',img:'clave',q:'¿Qué instrumento de teclado es este, muy usado en el Barroco?',ok:'El clave (clavecín)',no:['El órgano','El arpa','El pandero'],exp:'El clave o clavecín.'},
{b:'m2',t:'test',q:'¿Qué instrumento tocaba Gaspar Sanz?',ok:'La guitarra',no:['El violín','El órgano','La gaita'],exp:'Era guitarrista (y también organista).'},
{b:'m2',t:'test',q:'¿Dónde nació Gaspar Sanz?',ok:'En Calanda (Teruel)',no:['En Sevilla','En Toledo','En Nápoles'],exp:'En Calanda, Teruel.'},
{b:'m2',t:'test',img:'guitarra',q:'¿Qué compositor barroco español sentó las bases de la técnica de este instrumento?',ok:'Gaspar Sanz',no:['Alfonso X','Vivaldi','Pachelbel'],exp:'Gaspar Sanz, con su Instrucción de música sobre la guitarra española.'},
];
QS.forEach((q,i)=>q.id=q.b+i);

/* =================== ESTADO =================== */
const KEY='ham-t1t2-v1';
let S={q:{},b:{}};try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.q&&r.b)S=r}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const st={mode:'study',block:'all',cur:null,answered:false,recent:[],exam:null,confirm:false,sel:{}};

function pool(){return QS.filter(q=>st.block==='all'||q.b===st.block)}
function weight(q){const s=S.q[q.id];if(!s)return 3;return Math.max(.4,1+2*(s.n-s.ok)-.6*s.ok)}
function nextQ(){const p=pool().filter(q=>!st.recent.includes(q.id));const list=p.length?p:pool();let r=Math.random()*list.reduce((a,q)=>a+weight(q),0);for(const q of list){r-=weight(q);if(r<=0)return q}return list[list.length-1]}

/* =================== RENDER =================== */
function renderChips(){const opts=[['all','Todo'],...Object.entries(SHORT).map(([k,v])=>[k,(k[1]==='1'?'T1 · ':'T2 · ')+v])];
 $('#chips').innerHTML=opts.map(([k,v])=>`<button type="button" data-k="${k}" aria-pressed="${st.block===k}">${v}</button>`).join('');
 $('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.block=b.dataset.k;renderChips();go()})}

function renderStudy(){const bl=st.block==='all'?Object.keys(BLOCKS):[st.block];
 $('#main').innerHTML=`<div class="study">${bl.map(b=>`<h2 class="block-title">${BLOCKS[b]}</h2>`+FICHAS.filter(f=>f.b===b).map(f=>`<article class="sheet card"><span class="kicker">${BLOCKS[f.b]}</span><h2>${f.t}</h2>${f.figs?`<div class="figs">${f.figs.map(g=>fig(g[0],g[1],g[2])).join('')}</div>`:''}<ul>${f.p.map(x=>`<li>${x}</li>`).join('')}</ul>${f.tabla?`<div class="tbl"><table><thead><tr>${f.tabla.h.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${f.tabla.r.map(r=>`<tr>${r.map((c,i)=>i?`<td>${c}</td>`:`<th>${c}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}</article>`).join('')).join('')}
 <button class="primary practice-link" id="toPractice" type="button">Ponerme a prueba con estas preguntas</button></div>`;
 $('#toPractice').onclick=()=>setMode('practice')}

function prepare(q){const p={q};if(q.t==='test')p.opts=shuffle([q.ok,...q.no]);
 if(q.t==='vf')p.opts=['Verdadero','Falso'];
 if(q.t==='rel'){p.pairs=shuffle(q.pairs).slice(0,q.n||q.pairs.length);p.right=shuffle([...new Set(p.pairs.map(x=>x[1]))])}
 if(q.t==='cla')p.items=shuffle(q.items).slice(0,q.n||q.items.length);return p}

function renderQ(){const P=st.cur,q=P.q;st.answered=false;st.sel={};
 const meta=st.mode==='exam'?`<span>Pregunta ${st.exam.idx+1} de ${st.exam.list.length}</span>`:'';
 let body='';
 if(q.t==='test'||q.t==='vf')body=`<div class="opts${q.t==='vf'?' vf':''}" id="opts">${P.opts.map((o,i)=>`<button type="button" class="opt" data-i="${i}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>`;
 if(q.t==='rel')body=`<div class="rows">${P.pairs.map((p,i)=>`<div class="row" id="r${i}"><span><b>${esc(p[0])}</b></span><select id="s${i}" aria-label="${esc(p[0])}"><option value="">Elige…</option>${P.right.map(r=>`<option>${esc(r)}</option>`).join('')}</select></div>`).join('')}</div>`;
 if(q.t==='cla')body=`<div class="rows">${P.items.map((it,i)=>`<div class="row" id="r${i}"><span>${esc(it[0])}</span><select id="s${i}" aria-label="${esc(it[0])}"><option value="">Elige…</option>${q.cats.map((c,k)=>`<option value="${k}">${esc(c)}</option>`).join('')}</select></div>`).join('')}</div>`;
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>${BLOCKS[q.b]}</span>${meta}</div>
 ${q.img?fig(q.img,''):''}<p class="q">${q.t==='vf'?'¿Verdadero o falso? ':''}${esc(q.q)}</p>${body}
 <p class="need" id="need" hidden>Responde antes de comprobar.</p>
 <div class="actions" id="acts"><button class="primary" id="check" type="button">Comprobar</button></div>
 <div class="stamp" id="stamp" hidden></div><div id="res" hidden></div></div>`;
 const o=$('#opts');if(o)o.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||st.answered)return;st.sel.i=+b.dataset.i;o.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))});
 $('#check').onclick=check}

function check(){if(st.answered)return;const P=st.cur,q=P.q;let score=0,done=false;
 if(q.t==='test'||q.t==='vf'){if(st.sel.i===undefined){$('#need').hidden=false;return}
  const okIdx=q.t==='test'?P.opts.indexOf(q.ok):(q.ok?0:1);score=st.sel.i===okIdx?1:0;
  document.querySelectorAll('#opts .opt').forEach((b,i)=>{b.disabled=true;if(i===okIdx)b.classList.add('right');else if(i===st.sel.i)b.classList.add('wrong')});done=true}
 else{const n=q.t==='rel'?P.pairs.length:P.items.length;const vals=Array.from({length:n},(_,i)=>$('#s'+i).value);if(vals.some(v=>v==='')){$('#need').hidden=false;$('#need').textContent='Completa todas las filas antes de comprobar.';return}
  let good=0;vals.forEach((v,i)=>{const right=q.t==='rel'?P.pairs[i][1]:q.cats[P.items[i][1]];const ok=q.t==='rel'?v===right:+v===P.items[i][1];if(ok)good++;const r=$('#r'+i);r.classList.add(ok?'right':'wrong');r.insertAdjacentHTML('beforeend',`<small>${ok?'Bien':'Era: '+esc(right)}</small>`);$('#s'+i).disabled=true});
  score=good/n;done=true}
 if(!done)return;st.answered=true;$('#need').hidden=true;const all=score===1;
 const sp=$('#stamp');sp.hidden=false;sp.className='stamp '+(all?'b':'mm');sp.textContent=all?'B':'M';
 if(st.mode==='practice'){const s=S.q[q.id]||(S.q[q.id]={ok:0,n:0});s.n++;if(all)s.ok++;const b=S.b[q.b]||(S.b[q.b]={ok:0,n:0});b.n++;if(all)b.ok++;save();renderProgress();st.recent.push(q.id);if(st.recent.length>12)st.recent.shift()}
 else st.exam.res.push({b:q.b,score,q:q.q});
 const res=$('#res');res.hidden=false;res.innerHTML=`<p class="verdict ${all?'b':'mm'}">${all?'¡Bien!':score>0?'Casi: revisa las filas marcadas.':'No es correcto.'}</p><p class="exp">${q.exp}</p>`;
 const last=st.mode==='exam'&&st.exam.idx===st.exam.list.length-1;
 $('#acts').innerHTML=`<button class="primary" id="next" type="button">${last?'Ver nota':'Siguiente'}</button>`;$('#next').onclick=advance;$('#next').focus({preventScroll:true})}

function advance(){if(st.mode==='exam'){st.exam.idx++;if(st.exam.idx>=st.exam.list.length)return renderSummary();st.cur=prepare(st.exam.list[st.exam.idx])}else st.cur=prepare(nextQ());renderQ();$('#main').scrollIntoView({block:'nearest'})}

function startExam(){const p=shuffle(pool());let list;if(st.block==='all'){list=[];Object.keys(BLOCKS).forEach(b=>list.push(...shuffle(QS.filter(q=>q.b===b)).slice(0,3)));list=shuffle(list).slice(0,12)}else list=p.slice(0,10);
 st.exam={list,idx:0,res:[]};st.cur=prepare(list[0]);renderQ()}

function renderSummary(){const r=st.exam.res;const nota=Math.round(r.reduce((a,x)=>a+x.score,0)/r.length*100)/10;
 $('#main').innerHTML=`<div class="sheet summary"><div class="meta"><span>Prueba terminada</span></div><h2>Tu nota</h2><div class="grade">${nota.toLocaleString('es-ES')}</div>
 <ul class="qlist">${r.map(x=>`<li><b style="color:var(${x.score===1?'--ok':'--marker'})">${x.score===1?'B':'M'}</b><span>${esc(x.q)}</span></li>`).join('')}</ul>
 <p>${nota>=5?'¡Aprobado! Cada prueba sale con preguntas distintas.':'Repasa las fichas de lo que está marcado con M y vuelve a intentarlo.'}</p>
 <div class="actions"><button class="primary" id="again" type="button">Otra prueba</button><button class="ghost" id="toS" type="button">Ir a las fichas</button></div></div>`;
 $('#again').onclick=startExam;$('#toS').onclick=()=>setMode('study')}

function renderProgress(){const tot=Object.values(S.b).reduce((a,x)=>a+x.n,0);
 $('#progress').innerHTML=`<h2>Tu progreso</h2>${Object.keys(BLOCKS).map(k=>{const s=S.b[k]||{ok:0,n:0};const p=s.n?Math.round(s.ok/s.n*100):0;return`<div class="prow"><span>${BLOCKS[k]}</span><div class="bar"><i class="${s.n&&p<60?'low':''}" style="width:${p}%"></i></div><span class="num">${s.ok}/${s.n}</span></div>`}).join('')}
 <div class="pfoot"><span>${tot?`${tot} preguntas respondidas. Las que fallas vuelven a salir más a menudo.`:'Todavía no has respondido preguntas en este dispositivo.'}</span>${st.confirm?`<span class="rconf">¿Seguro? <button class="rbtn danger" id="rYes" type="button">Sí, borrar</button><button class="rbtn" id="rNo" type="button">Cancelar</button></span>`:`<button class="rbtn" id="rst" type="button"${tot?'':' disabled'}>Borrar progreso</button>`}</div>`;
 if($('#rst'))$('#rst').onclick=()=>{st.confirm=true;renderProgress()};
 if($('#rNo'))$('#rNo').onclick=()=>{st.confirm=false;renderProgress()};
 if($('#rYes'))$('#rYes').onclick=()=>{S={q:{},b:{}};save();st.confirm=false;renderProgress()}}

function setMode(m){st.mode=m;['tStudy','tPractice','tExam'].forEach((id,i)=>$('#'+id).setAttribute('aria-pressed',['study','practice','exam'][i]===m));go();window.scrollTo({top:0})}
function go(){if(st.mode==='study')renderStudy();else if(st.mode==='practice'){st.cur=prepare(nextQ());renderQ()}else startExam()}
$('#tStudy').onclick=()=>setMode('study');$('#tPractice').onclick=()=>setMode('practice');$('#tExam').onclick=()=>setMode('exam');
renderChips();renderProgress();go();
</script>

</body>
</html>
