<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas de Geografía</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
/* Layout: atlas escolar. Misma familia que las otras apps; el mapa físico de España (cordilleras, ríos, red de coordenadas) es el tablero de la mayoría de juegos */
:root{
  --bg:#eaeff7; --paper:#fdfdfb; --grid:#e2e9f4; --ink:#1b2a4a; --muted:#56637d; --line:#cfd8e7;
  --marker:#c0127e; --marker-soft:#fbe4f1; --ok:#17734a; --ok-soft:#ddf2e6; --btn:#1b2a4a; --btn-fg:#fdfdfb; --chip:#ffffff;
  --star:#d9a400; --geo:#2d6a8f;
  --sea:#d6e8f4; --land:#f1e9d4; --landline:#ffffff; --mt:#a0522d; --rv:#1e6fd9; --grat:#7d93a8; --dim:#e2e6ec;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1524; --paper:#151f36; --grid:#1d2a46; --ink:#e4eaf6; --muted:#9ba8c3; --line:#2a3856;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#e4eaf6; --btn-fg:#0e1524; --chip:#18233d;
  --star:#ffd23f; --geo:#7cc0e6; --sea:#13233b; --land:#2c3447; --landline:#13233b; --mt:#d08a5c; --rv:#5aa8ff; --grat:#5a6b85; --dim:#222c40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1524; --paper:#151f36; --grid:#1d2a46; --ink:#e4eaf6; --muted:#9ba8c3; --line:#2a3856;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#e4eaf6; --btn-fg:#0e1524; --chip:#18233d;
  --star:#ffd23f; --geo:#7cc0e6; --sea:#13233b; --land:#2c3447; --landline:#13233b; --mt:#d08a5c; --rv:#5aa8ff; --grat:#5a6b85; --dim:#222c40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.back{font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:700}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.1;margin:0;letter-spacing:-.01em}
header h1 span{color:var(--marker);font-family:var(--f-hand);font-size:1.15em;margin-left:.15em}
header p{margin:.35em 0 0;color:var(--muted);max-width:56ch}
.score{display:flex;align-items:center;gap:6px;font:800 1.4rem var(--f-display);font-variant-numeric:tabular-nums}.score svg{width:28px;height:28px}
.tabs{display:flex;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 .95rem var(--f-body);padding:10px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:400 .9rem var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.sheet{position:relative;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:6px;padding:20px 18px 22px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(20,30,60,.45);display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-right:56px}
h2{font:800 1.35rem var(--f-display);margin:0;text-wrap:balance}
h3{font:800 1.05rem var(--f-display);margin:0}
.primary{background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;font:700 1rem var(--f-body);padding:12px 20px;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:700 1rem var(--f-body);padding:11px 16px;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:.9rem;color:var(--muted);margin:0}
.theme-head{display:flex;align-items:baseline;gap:10px;margin:6px 0 -4px}.theme-head h2{font-size:1.2rem;color:var(--geo)}.theme-head span{font-size:.85rem;color:var(--muted);font-weight:700}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.path li{position:relative;padding-left:58px;padding-block:6px}
.path li::before{content:"";position:absolute;left:21px;top:0;bottom:0;border-left:3px dotted var(--line)}
.path li:first-child::before{top:50%}.path li:last-child::before{bottom:50%}
.stop{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.stop:hover{border-color:var(--muted)}.stop b{font:800 1.05rem var(--f-display);display:block}.stop small{color:var(--muted);font-size:.88rem;display:block}
.dot{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 .95rem var(--f-display);background:var(--paper);border:3px solid var(--geo);color:var(--geo)}
.dot.done{background:var(--geo);color:var(--paper)}
.stars{display:flex;gap:2px;flex:none}.stars svg{width:20px;height:20px}
.st-on{fill:var(--star)}.st-off{fill:none;stroke:var(--line);stroke-width:2}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:64ch}.card li::marker{color:var(--marker)}
.idea{margin:0;background:var(--paper);border:2px solid var(--geo);border-radius:12px;padding:12px 14px;font-size:1.08rem;line-height:1.45}
.idea span{display:block;font:700 1.35rem var(--f-hand);color:var(--geo);line-height:1;margin-bottom:4px}
.blk{display:flex;flex-direction:column;gap:8px}
.bh{font:800 1rem var(--f-display);margin:2px 0 0;color:var(--ink)}
.bxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.bx{background:var(--chip);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:3px;font-size:.96rem;line-height:1.4}
.bx>b{font:800 1.02rem var(--f-display);color:var(--ink)}
.nums{display:flex;flex-wrap:wrap;gap:8px}.num{flex:1 1 150px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}
.num b{font:800 1.5rem var(--f-display);color:var(--geo);font-variant-numeric:tabular-nums}.num span{font-size:.9rem;color:var(--muted)}
.ej{border:2px dashed var(--marker);border-radius:12px;padding:10px 14px;background:var(--marker-soft)}
.ejl{font:700 1.35rem var(--f-hand);color:var(--marker);line-height:1}.ej p{margin:4px 0 0}.ej small{color:var(--muted);display:block;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{background:var(--chip);border:1.5px solid var(--geo);border-radius:999px;padding:4px 12px;font-size:.92rem;font-weight:700}
.bars{display:flex;flex-direction:column;gap:7px}.br{display:grid;grid-template-columns:8.5em 1fr;column-gap:10px;align-items:center}
.bn{font-weight:700;font-size:.95rem}.bt{height:14px;background:var(--grid);border-radius:7px;overflow:hidden}.bt i{display:block;height:100%;border-radius:7px}
.br small{grid-column:2;color:var(--muted);font-size:.82rem}
.truco{background:var(--marker-soft);border-radius:10px;padding:10px 12px;margin:0}.truco>b:first-child{font-family:var(--f-hand);font-size:1.4rem;color:var(--marker);margin-right:6px}
.ill{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.ill svg{width:100%;max-width:440px;height:auto;display:block;border-radius:12px}
.ill .map{width:100%}
.ill figcaption{font-size:.86rem;color:var(--muted);text-align:center}
.figs{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}.figs .ill{flex:1 1 240px}
.tbl{overflow-x:auto}.tbl table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:420px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;background:var(--paper)}.tbl th{background:var(--chip)}
.q{font-size:1.12rem;font-weight:700;margin:0;line-height:1.45}
.prompt{font:800 1.22rem var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.prompt small{display:block;font:400 .95rem var(--f-body);color:var(--muted);margin-top:2px}
.opts{display:flex;flex-direction:column;gap:8px}.opts.two{flex-direction:row}.opts.two .opt{flex:1;text-align:center;font-weight:700}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}.opts.three{display:grid;grid-template-columns:repeat(3,1fr)}.opts.three .opt{text-align:center;font-weight:700}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 1rem var(--f-body);padding:10px 14px;border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--muted)}.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}.opt.wrong{border-color:var(--marker);background:var(--marker-soft)}.opt:disabled{cursor:default}
.exp{border-top:2px solid var(--ink);padding-top:10px;margin:0}
.verdict{font-weight:700;margin:0}.verdict.b{color:var(--ok)}.verdict.mm{color:var(--marker)}
.stamp{position:absolute;top:10px;right:14px;font-family:var(--f-hand);font-size:3.4rem;line-height:1;transform:rotate(-8deg);pointer-events:none}.stamp.b{color:var(--ok)}.stamp.mm{color:var(--marker)}
.pbar{display:flex;gap:5px}.pbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}.pbar i.okk{background:var(--ok)}.pbar i.ko{background:var(--marker)}.pbar i.on{background:var(--ink)}
.bigstars{display:flex;gap:8px;justify-content:center}.bigstars svg{width:56px;height:56px}
@media (prefers-reduced-motion:no-preference){.bigstars svg.anim{animation:pop .45s ease-out both}.bigstars svg:nth-child(2){animation-delay:.15s}.bigstars svg:nth-child(3){animation-delay:.3s}}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}}
.grade{font-family:var(--f-hand);color:var(--marker);font-size:4.4rem;line-height:1;border:3px solid var(--marker);border-radius:50%;width:140px;height:110px;display:grid;place-items:center;transform:rotate(-6deg);margin:6px 0 10px}
.fb{min-height:1.5em;margin:0;font-weight:700}.fb.okk{color:var(--ok)}.fb.ko{color:var(--marker)}
.end{border-top:2px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:8px}.end p{margin:0}
/* Mapa físico */
.map{border-radius:12px;overflow:hidden;background:var(--sea);touch-action:manipulation}
.map svg{display:block;width:100%;height:auto}
.pv{fill:var(--land);stroke:var(--landline);stroke-width:.6}
.pv.hl{fill:var(--marker)}.pv.ok{fill:#3aa86a}.pv.ko{fill:#e05a8e}
.tap .pv{cursor:pointer}
.gr{fill:none;stroke:var(--grat);stroke-width:.5;opacity:.8;pointer-events:none}
.gr.key{stroke-width:1.2;opacity:1}
.mt{fill:none;stroke:var(--mt);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
.rv{fill:none;stroke:var(--rv);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hitl{fill:none;stroke:transparent;stroke-width:18;stroke-linecap:round;cursor:pointer}
.mt.ok,.rv.ok{stroke:#2f9e5c;opacity:1}.mt.ko,.rv.ko{stroke:#e05a8e;opacity:1}.mt.hl,.rv.hl{stroke:var(--marker);opacity:1}
.rv.ok,.rv.ko,.rv.hl{stroke-width:4.5}
.pk{fill:var(--ink)}.pk.ok{fill:#2f9e5c}.pk.ko{fill:#e05a8e}.pk.hl{fill:var(--marker)}
.city{fill:var(--marker);stroke:var(--paper);stroke-width:2}
.park{fill:#2f9e5c;stroke:var(--paper);stroke-width:1.5}
.ml{font:700 10.5px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.ml.rvl{fill:var(--rv);font-style:italic}.ml.mtl{fill:var(--mt)}.ml.zl{font-style:italic;font-weight:400}.ml.gl{font-weight:400;font-size:8px;fill:var(--muted)}
@media (prefers-reduced-motion:no-preference){.flash{animation:fl .5s ease-in-out 3}@keyframes fl{50%{opacity:.25}}}
/* Dibujos tocables */
.scope{border-radius:14px;overflow:hidden;display:flex;justify-content:center}
.scope svg{width:100%;max-width:440px;height:auto;display:block}
.tap [data-k]{cursor:pointer}
.hit-ok{fill:var(--ok)!important}.hit-ko{fill:var(--marker)!important}
.lbl{font:700 11px var(--f-body);fill:#14213a;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
/* Juegos */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.gcard:hover{border-color:var(--muted)}.gcard .ico{font:800 1.5rem var(--f-hand);color:var(--marker);line-height:1}
.gcard b{font:800 1.08rem var(--f-display)}.gcard small{color:var(--muted)}.gcard .best{font-size:.82rem;color:var(--ok);font-weight:700}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.timer{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}.timer i{display:block;height:100%;background:var(--marker);transition:width .2s linear}
.bigq{font:800 1.45rem var(--f-display);text-align:center;min-height:3em;display:grid;place-items:center;margin:0;text-wrap:balance;border-radius:10px}
.flash-ok{animation:fok .4s}.flash-ko{animation:fko .4s}@keyframes fok{from{background:var(--ok-soft)}}@keyframes fko{from{background:var(--marker-soft)}}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{font:400 1.2rem var(--f-body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:11em;max-width:100%;font-variant-numeric:tabular-nums}
.numrow .unit{font-weight:700;color:var(--muted)}.numrow input.ok{border-color:var(--ok)}.numrow input.ko{border-color:var(--marker)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.ev{border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 1rem var(--f-body);padding:9px 12px;border-radius:10px;cursor:pointer}
.ev.shake{border-color:var(--marker);animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.ladder li{background:var(--ok-soft);border-radius:8px;padding:6px 10px;font-weight:700}.ladder li small{font-weight:400;color:var(--muted);margin-left:6px}
/* Progreso */
.progress{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:16px}.progress h2{font-size:1.15rem;margin:0 0 10px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:.85rem;font-weight:700;color:var(--muted)}.badge.got{color:var(--ink);border-color:var(--star)}.badge svg{width:22px;height:22px}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.9rem;color:var(--muted)}
.rbtn{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;font:700 .9rem var(--f-body);padding:7px 12px;cursor:pointer;margin-left:6px}
.rbtn:disabled{opacity:.45;cursor:default}.rbtn.danger{background:var(--marker);border-color:var(--marker);color:var(--paper)}
.rconf{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px;color:var(--ink);font-weight:700}
.qlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}.qlist li{display:flex;gap:10px;align-items:baseline}.qlist b{font-family:var(--f-hand);font-size:1.5rem;width:1.2em;flex:none}
svg text{font-family:var(--f-body)}
@media (max-width:460px){header h1{font-size:1.65rem}.opts.grid,.opts.three{grid-template-columns:1fr}.stamp{font-size:2.8rem}}
</style>

<div class="wrap">
  <a class="back" href="../../../#ale/mapas-geografia">← Mapas y Geografía de Ale</a>
  <header>
    <div><h1>Atlas de Geografía <span>Ale</span></h1>
    <p>Mapas y Geografía, temas 1 y 2: coordenadas, proyecciones y escalas; relieve, ríos, costas, climas y paisajes de España.</p></div>
    <div class="score" id="score" aria-label="Estrellas"></div>
  </header>
  <div class="tabs" role="group" aria-label="Sección">
    <button id="tEst" aria-pressed="true">Estudiar</button>
    <button id="tJue" aria-pressed="false">Juegos</button>
    <button id="tPru" aria-pressed="false">Prueba</button>
  </div>
  <main id="main"></main>
  <section class="progress" id="progress"></section>

function physMap(o){let s='';const vb=o.peninsula?[128,0,500,380]:MAP.vb;
 for(const[id,v] of Object.entries(MAP.prov)){if(id==='51'||id==='52')continue;s+=`<path class="pv ${o.cls?o.cls('p',id)||'':''}" data-t="p" data-k="${id}" d="${v.d}"/>`}
 if(!o.peninsula)s+=`<path d="${MAP.inset}" fill="none" stroke="var(--muted)" stroke-width="1" pointer-events="none"/>`;
 if(o.grat){GEO.grat.lat.forEach(([la,d,f])=>{s+=`<path class="gr ${la===40?'key':''}" d="${d}"/>`;if(f)s+=`<text class="ml gl" x="${f[0]+2}" y="${f[1]-2}">${la}º N</text>`});
  GEO.grat.lon.forEach(([lo,d,f])=>{s+=`<path class="gr ${lo===0?'key':''}" d="${d}"/>`;if(f)s+=`<text class="ml gl" x="${f[0]+2}" y="${f[1]-3}">${Math.abs(lo)}º ${lo<0?'O':lo>0?'E':''}</text>`})}
 if(o.montes)for(const[k,m] of Object.entries(GEO.montes)){s+=`<path class="mt ${o.cls?o.cls('m',k)||'':''}" data-t="m" data-k="${k}" d="${m.d}"/>`;if(o.tap==='m')s+=`<path class="hitl" data-t="m" data-k="${k}" d="${m.d}"/>`}
 if(o.zonas)for(const z of Object.values(GEO.zonas))s+=`<text class="ml zl" x="${z.c[0]}" y="${z.c[1]}" text-anchor="middle">${z.n}</text>`;
 if(o.rios)for(const[k,r] of Object.entries(GEO.rios)){s+=`<path class="rv ${o.cls?o.cls('r',k)||'':''}" data-t="r" data-k="${k}" d="${r.d}"/>`;if(o.tap==='r')s+=`<path class="hitl" data-t="r" data-k="${k}" d="${r.d}"/>`}
 if(o.montes==='lab')for(const m of Object.values(GEO.montes))s+=`<text class="ml mtl" x="${m.lab[0]}" y="${m.lab[1]-6}" text-anchor="middle">${m.n}</text>`;
 if(o.rios==='lab')for(const r of Object.values(GEO.rios))s+=`<text class="ml rvl" x="${r.lab[0]}" y="${r.lab[1]+11}" text-anchor="middle">${r.n}</text>`;
 if(o.picos)for(const[k,p] of Object.entries(GEO.picos)){s+=`<path class="pk ${o.cls?o.cls('k',k)||'':''}" data-t="k" data-k="${k}" d="M${p.c[0]} ${p.c[1]-8} l7 12 h-14 z"/>`;if(o.tap==='k')s+=`<circle class="hitl" style="fill:transparent" data-t="k" data-k="${k}" cx="${p.c[0]}" cy="${p.c[1]}" r="14"/>`;if(o.picos==='lab')s+=`<text class="ml" x="${p.c[0]+9}" y="${p.c[1]+10}">${p.n.split(' (')[0]}</text>`}
 if(o.parques)for(const p of Object.values(GEO.parques)){s+=`<circle class="park" cx="${p.c[0]}" cy="${p.c[1]}" r="5"/>`;if(o.parques==='lab')s+=`<text class="ml" x="${p.c[0]+7}" y="${p.c[1]+3}">${p.n}</text>`}
 if(o.city){const c=GEO.ciud[o.city];s+=`<circle class="city" cx="${c.c[0]}" cy="${c.c[1]}" r="5"/>`;if(o.cityLabel)s+=`<text class="ml" x="${c.c[0]+7}" y="${c.c[1]-5}">${c.n}</text>`}
 return`<div class="map ${o.tap?'tap':''}" id="${o.id||'pmap'}"><svg viewBox="${vb.join(' ')}" role="img" aria-label="${esc(o.aria||'Mapa físico de España')}">${s}</svg></div>`}
function wireMap(id,type,fn){const m=document.getElementById(id);m.addEventListener('click',e=>{const t=e.target.closest(`[data-t="${type}"]`);if(t)fn(t.dataset.k)})}
function mark(id,type,k,cls){document.querySelectorAll(`#${id} [data-t="${type}"][data-k="${k}"]:not(.hitl)`).forEach(el=>{el.classList.remove('ok','ko','hl','flash');if(cls)cls.split(' ').forEach(c=>el.classList.add(c))})}
function label(id,x,y,t,cls=''){document.querySelector(`#${id} svg`).insertAdjacentHTML('beforeend',`<text class="ml ${cls}" x="${x}" y="${y}" text-anchor="middle">${esc(t)}</text>`)}

function blocksHTML(s){return s.b.map(B=>{const h=B.h?`<h3 class="bh">${B.h}</h3>`:'';
 if(B.k==='cards')return`<section class="blk">${h}<div class="bxs">${B.it.map(([t,d,c])=>`<div class="bx" style="--c:${c}"><b>${t}</b><span>${d}</span></div>`).join('')}</div></section>`;
 if(B.k==='nums')return`<section class="blk">${h}<div class="nums">${B.it.map(([n,d])=>`<div class="num"><b>${n}</b><span>${d}</span></div>`).join('')}</div></section>`;
 if(B.k==='ej')return`<section class="ej"><span class="ejl">${B.h}</span><p>${B.t}</p></section>`;
 if(B.k==='chips')return`<section class="blk">${h}<div class="tags">${B.it.map(x=>`<span>${x}</span>`).join('')}</div></section>`;
 if(B.k==='bars'){const mx=Math.max(...B.it.map(x=>x[1]));return`<section class="blk">${h}<div class="bars">${B.it.map(([n,v,l,c])=>`<div class="br"><span class="bn">${n}</span><span class="bt"><i style="width:${v/mx*100}%;background:${c}"></i></span><small>${l}</small></div>`).join('')}</div></section>`}
 return''}).join('')}

function weight(q){const s=S.q[q.id];if(!s)return 3;return Math.max(.4,1+2*(s.n-s.ok)-.6*s.ok)}
function wpick(list,n){const out=[],pool=[...list];while(out.length<n&&pool.length){let r=Math.random()*pool.reduce((a,q)=>a+weight(q),0);let k=0;for(;k<pool.length;k++){r-=weight(pool[k]);if(r<=0)break}out.push(pool.splice(Math.min(k,pool.length-1),1)[0])}return out}
function setBest(id,v,lower){const p=S.games[id];if(p==null||(lower?v<p:v>p)){S.games[id]=v;save();renderProgress();return true}return false}

let V=null;

function drawQ(){const q=V.list[V.idx];const opts=q.t==='test'?shuffle([q.ok,...q.no]):['Verdadero','Falso'];V.opts=opts;V.ans=false;
 $('#main').innerHTML=`<div class="sheet"><div class="meta"><span>${V.kind==='reto'?stOf(V.id).n:'Prueba · '+stOf(q.st).n}</span><span>${V.idx+1} / ${V.list.length}</span></div>
 <div class="pbar">${V.list.map((_,i)=>`<i class="${i<V.res.length?(V.res[i]?'okk':'ko'):i===V.idx?'on':''}"></i>`).join('')}</div>
 <p class="q">${q.t==='vf'?'¿Verdadero o falso? ':''}${esc(q.q)}</p><div class="opts ${q.t==='vf'?'two':''}" id="opts">${opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="after"></div><div class="stamp" id="stamp" hidden></div></div>`;
 $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerQ(+b.dataset.i))}
function answerQ(i){if(V.ans)return;V.ans=true;const q=V.list[V.idx];const okIdx=q.t==='test'?V.opts.indexOf(q.ok):(q.ok?0:1);const ok=i===okIdx;
 $('#opts').querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===okIdx)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
 V.res.push(ok);const s=S.q[q.id]||(S.q[q.id]={ok:0,n:0});s.n++;if(ok)s.ok++;save();const sp=$('#stamp');sp.hidden=false;sp.className='stamp '+(ok?'b':'mm');sp.textContent=ok?'B':'M';
 const last=V.idx===V.list.length-1;$('#after').innerHTML=`<p class="verdict ${ok?'b':'mm'}">${ok?pick(['¡Bien!','¡Exacto!','¡Muy bien!']):'No es correcto.'}</p><p class="exp">${q.exp}</p><div class="actions" style="margin-top:12px"><button class="primary" id="nx" type="button">${last?'Ver resultado':'Siguiente'}</button></div>`;
 $('#nx').onclick=()=>{if(last)finishQuiz();else{V.idx++;drawQ()}};$('#nx').focus({preventScroll:true})}
function finishQuiz(){const n=V.res.filter(Boolean).length;
 if(V.kind==='reto'){const stars=n>=5?3:n===4?2:n===3?1:0;const prev=S.stars[V.id]||0;if(stars>prev){S.stars[V.id]=stars;save();renderScore();renderProgress()}const s=stOf(V.id);const next=ST[ST.indexOf(s)+1];
  $('#main').innerHTML=`<div class="sheet" style="align-items:center;text-align:center"><div class="meta" style="align-self:stretch"><span>${s.n}</span></div><h2>${n} de 5 aciertos</h2><div class="bigstars">${[1,2,3].map(k=>star(k<=stars,k<=stars?'anim':'')).join('')}</div>
  <p>${stars===3?'¡Ficha completada con todas las estrellas!':stars?`Has ganado ${stars} ${stars===1?'estrella':'estrellas'}.${stars>prev?' ¡Nuevo récord!':''} Repite para conseguir las 3.`:'Repasa la ficha y vuelve a intentarlo: las que fallas saldrán más.'}</p>
  <div class="actions" style="justify-content:center"><button class="primary" id="again" type="button">Repetir el reto</button><button class="ghost" id="ficha" type="button">Ver la ficha</button>${next?`<button class="ghost" id="next" type="button">Siguiente ficha</button>`:''}</div></div>`;

 else{const nota=Math.round(n/V.list.length*100)/10;setBest('prueba',nota,false);

const pbar=(n,res,k)=>`<div class="pbar">${Array.from({length:n},(_,i)=>`<i class="${i<res.length?(res[i]?'okk':'ko'):i===k?'on':''}"></i>`).join('')}</div>`;

/* Motor de rondas: cada ronda {q, kind:'tap'|'choose', type, ans, draw(), opts, exp} */
function runRounds(id,title,rounds,again,tip){let k=0,good=0;const res=[];
 $('#main').innerHTML=shell(title);wireBack();
 const next=()=>{$('#nxw').innerHTML='';if(k>=rounds.length){const better=setBest(id,good,false);$('#board').innerHTML='';$('#opts').innerHTML='';$('#q').textContent='';$('#pb').innerHTML=pbar(rounds.length,res,99);endG(`${good} de ${rounds.length}`,`${better?'¡Nueva mejor marca! ':''}${tip}`,again);return}
  const r=rounds[k];$('#pb').innerHTML=pbar(rounds.length,res,k);$('#q').innerHTML=r.q;$('#fb').textContent='';$('#fb').className='fb';$('#board').innerHTML=r.draw();$('#opts').innerHTML='';let tries=0,done=false;
  const finish=win=>{done=true;if(win)good++;res.push(win);$('#fb').className='fb '+(win?'okk':'ko');$('#fb').innerHTML=(win?'¡Bien! ':'')+(r.exp||'');r.after&&r.after();
   $('#nxw').innerHTML=`<div class="actions"><button class="primary" id="nx" type="button">${k===rounds.length-1?'Ver resultado':'Siguiente'}</button></div>`;$('#nx').onclick=()=>{k++;next()};$('#nx').focus({preventScroll:true})};
  if(r.kind==='tap'){wireMap('board-map',r.type,kk=>{if(done)return;tries++;if(r.ans.includes(kk)){mark('board-map',r.type,kk,'ok');finish(tries===1)}else{mark('board-map',r.type,kk,'ko');$('#fb').className='fb ko';$('#fb').textContent=`Eso es: ${r.nameOf(kk)}.${tries<2?' Prueba otra vez.':''}`;setTimeout(()=>mark('board-map',r.type,kk,''),900);if(tries>=2){r.ans.forEach(a=>mark('board-map',r.type,a,'hl flash'));finish(false)}}})}
  else{$('#opts').innerHTML=`<div class="opts ${r.cols||'grid'}">${r.opts.map(o=>`<button class="opt" type="button">${esc(o)}</button>`).join('')}</div>`;
   $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;tries++;const ok=b.textContent===r.ans;if(ok){b.classList.add('right');$('#opts').querySelectorAll('.opt').forEach(x=>x.disabled=true);finish(tries===1)}else{b.classList.add('wrong');b.disabled=true;if(r.tip)$('#fb').textContent=r.tip(b.textContent);$('#fb').className='fb ko';if(tries>=2){$('#opts').querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===r.ans)x.classList.add('right')});finish(false)}}})}};
 next()}

 const ps=shuffle(pk).slice(0,3).map(k=>{const p=GEO.picos[k];return{kind:'tap',type:'k',ans:[k],q:`¿Dónde está <b>${p.n}</b>?<small>Toca el triángulo</small>`,draw:()=>mapIn({montes:true,picos:true,tap:'k'}),nameOf:x=>GEO.picos[x].n,exp:`${p.n}: ${p.h}.`}});

function coordTxt(la,lo){const a=Math.floor(la),b=Math.floor(Math.abs(lo));return`${a}º-${a+1}º N y ${b}º-${b+1}º ${lo<0?'O':'E'}`}

 const rounds=ks.map((k,i)=>{const c=GEO.ciud[k];const right=coordTxt(c.la,c.lo);const a=Math.floor(c.la),b=Math.floor(Math.abs(c.lo));const E=c.lo<0?'O':'E',W=c.lo<0?'E':'O';
