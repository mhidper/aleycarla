<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viaje por España</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
/* Layout: cuaderno de viaje. Misma familia que las otras apps; el mapa de España es la pieza central de cada juego y los sellos del pasaporte son la recompensa */
:root{
  --bg:#eaeff7; --paper:#fdfdfb; --grid:#e2e9f4; --ink:#1b2a4a; --muted:#56637d; --line:#cfd8e7;
  --marker:#c0127e; --marker-soft:#fbe4f1; --ok:#17734a; --ok-soft:#ddf2e6; --btn:#1b2a4a; --btn-fg:#fdfdfb; --chip:#ffffff;
  --sea:#d6e8f4; --ls:48%; --ll:83%; --mapline:#ffffff; --okfill:#3aa86a; --kofill:#e05a8e; --hlfill:#c0127e; --dim:#e9edf2;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1524; --paper:#151f36; --grid:#1d2a46; --ink:#e4eaf6; --muted:#9ba8c3; --line:#2a3856;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#e4eaf6; --btn-fg:#0e1524; --chip:#18233d;
  --sea:#13233b; --ls:30%; --ll:36%; --mapline:#0e1524; --okfill:#3aa86a; --kofill:#d0457c; --hlfill:#ff5fb9; --dim:#222c40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1524; --paper:#151f36; --grid:#1d2a46; --ink:#e4eaf6; --muted:#9ba8c3; --line:#2a3856;
  --marker:#ff5fb9; --marker-soft:#3a1a33; --ok:#4fc68c; --ok-soft:#17332a; --btn:#e4eaf6; --btn-fg:#0e1524; --chip:#18233d;
  --sea:#13233b; --ls:30%; --ll:36%; --mapline:#0e1524; --okfill:#3aa86a; --kofill:#d0457c; --hlfill:#ff5fb9; --dim:#222c40; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.back{font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:700}
header h1{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.1;margin:0;letter-spacing:-.01em}
header h1 span{color:var(--marker);font-family:var(--f-hand);font-size:1.15em;margin-left:.15em}
header p{margin:.35em 0 0;color:var(--muted);max-width:58ch}
.tabs{display:flex;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 .95rem var(--f-body);padding:10px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:400 .9rem var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.chips button.off{color:var(--muted);border-style:dashed}
button:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.sheet{position:relative;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:6px;padding:20px 18px 22px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(20,30,60,.45);display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-right:56px}
h2{font:800 1.35rem var(--f-display);margin:0;text-wrap:balance}
h3{font:800 1.02rem var(--f-display);margin:0}
.primary{background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;font:700 1rem var(--f-body);padding:12px 20px;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:700 1rem var(--f-body);padding:11px 16px;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:.9rem;color:var(--muted);margin:0}
/* Mapa */
.map{position:relative;border-radius:12px;overflow:hidden;background:var(--sea);touch-action:manipulation}
.map svg{display:block;width:100%;height:auto}
.rg{fill:hsl(var(--h) var(--ls) var(--ll));stroke:var(--mapline);stroke-width:.7;stroke-linejoin:round;transition:fill .2s}
.tap .rg,.tap .hit{cursor:pointer}
.tap .rg:hover{filter:brightness(.94)}
.rg.dim{fill:var(--dim)}
.rg.hl{fill:var(--hlfill)}.rg.ok{fill:var(--okfill)}.rg.ko{fill:var(--kofill)}
.rg.sel{fill:hsl(var(--h) 70% 55%)}
.dot{fill:hsl(var(--h) var(--ls) 60%);stroke:var(--ink);stroke-width:1}
.dot.hl{fill:var(--hlfill)}.dot.ok{fill:var(--okfill)}.dot.ko{fill:var(--kofill)}
.hit{fill:transparent}
.ccb{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round;pointer-events:none;opacity:.75}
.inset{fill:none;stroke:var(--muted);stroke-width:1;pointer-events:none}
.lbl{font:700 9.5px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.lbl.big{font-size:12px}
.pin{fill:var(--ink);stroke:var(--paper);stroke-width:1.5;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.rg.flash{animation:fl .5s ease-in-out 3}@keyframes fl{50%{fill:var(--hlfill)}}}
/* Ficha */
.ficha dl{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:8px 14px;margin:0}
.ficha dt{font-weight:700;color:var(--muted);font-size:.9rem}
.ficha dd{margin:0}
.provs{display:flex;flex-direction:column;gap:10px}
.prov{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--chip)}
.prov h3 small{font:400 .88rem var(--f-body);color:var(--muted);margin-left:6px}
.prov p{margin:4px 0 0}
.towns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.towns span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.88rem}
.towns b{font-weight:700}
.tag{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--marker)}
.missing{background:var(--marker-soft);border-radius:10px;padding:10px 12px;margin:0}
/* Juegos */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.gcard:hover{border-color:var(--muted)}
.gcard .ico{font:800 1.6rem var(--f-hand);color:var(--marker);line-height:1}
.gcard b{font:800 1.08rem var(--f-display)}
.gcard small{color:var(--muted)}
.gcard .best{font-size:.82rem;color:var(--ok);font-weight:700}
.prompt{font:800 1.25rem var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.prompt small{display:block;font:400 .95rem var(--f-body);color:var(--muted);margin-top:2px}
.fb{min-height:1.5em;margin:0;font-weight:700}
.fb.okk{color:var(--ok)}.fb.ko{color:var(--marker)}
.hud{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.pbar{display:flex;gap:4px}.pbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}.pbar i.okk{background:var(--ok)}.pbar i.ko{background:var(--marker)}.pbar i.on{background:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:400 1rem var(--f-body);padding:10px 12px;border-radius:10px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}.opt.wrong{border-color:var(--marker);background:var(--marker-soft)}.opt:disabled{cursor:default}
.stamp{position:absolute;top:10px;right:14px;font-family:var(--f-hand);font-size:3.2rem;line-height:1;transform:rotate(-8deg);pointer-events:none}
.stamp.b{color:var(--ok)}.stamp.mm{color:var(--marker)}
.grade{font-family:var(--f-hand);color:var(--marker);font-size:4.4rem;line-height:1;border:3px solid var(--marker);border-radius:50%;width:140px;height:110px;display:grid;place-items:center;transform:rotate(-6deg);margin:6px 0 10px}
.end{border-top:2px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.end p{margin:0}
/* Pasaporte */
.passport{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.passport h2{font-size:1.15rem}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.st{aspect-ratio:1;border-radius:50%;border:2.5px dashed var(--line);display:grid;place-items:center;text-align:center;padding:8px;font-size:.72rem;font-weight:700;color:var(--muted);line-height:1.15;position:relative}
.st b{display:block;font:800 1.15rem var(--f-hand);line-height:1}
.st.got{border:3px double hsl(var(--h) 55% 40%);color:hsl(var(--h) 55% 32%);background:hsl(var(--h) 60% 94%);transform:rotate(var(--r))}
:root[data-theme="dark"] .st.got{color:hsl(var(--h) 60% 80%);background:hsl(var(--h) 30% 18%);border-color:hsl(var(--h) 50% 60%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st.got{color:hsl(var(--h) 60% 80%);background:hsl(var(--h) 30% 18%);border-color:hsl(var(--h) 50% 60%)}}
.st small{display:block;font-weight:400;font-size:.68rem;margin-top:2px}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.rbtn{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;font:700 .9rem var(--f-body);padding:7px 12px;cursor:pointer;margin-left:6px}
.rbtn:disabled{opacity:.45;cursor:default}.rbtn.danger{background:var(--marker);border-color:var(--marker);color:var(--paper)}
.rconf{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px;color:var(--ink);font-weight:700}
.qlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}.qlist li{display:flex;gap:10px;align-items:baseline}.qlist b{font-family:var(--f-hand);font-size:1.5rem;width:1.2em;flex:none}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-fg);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:5;max-width:calc(100% - 32px);text-align:center}
@media (max-width:460px){header h1{font-size:1.65rem}.opts{grid-template-columns:1fr}.ficha dl{grid-template-columns:1fr;gap:2px}.ficha dd{margin-bottom:8px}.stamp{font-size:2.6rem}}
</style>
</head>

/* opts: level 'prov'|'ccaa', cls(id)->clase extra, labels [[id,texto]], only: lista de ids visibles en color (resto atenuado), tap:fn(id) */
function mapHTML(o){const L=o.level||'prov';let s='';
 const regs=L==='prov'?Object.keys(MAP.prov):Object.keys(MAP.ccaa);
 for(const id of regs){if(L==='prov'?(id==='51'||id==='52'):(id==='18'||id==='19'))continue;const d=L==='prov'?MAP.prov[id].d:MAP.ccaa[id].d;const cc=L==='prov'?ccOf(id):id;
  const dim=o.only&&!o.only.includes(id)?' dim':'';s+=`<path class="rg${dim} ${o.cls?o.cls(id)||'':''}" data-id="${id}" style="--h:${HUE[cc]}" d="${d}"><title>${o.titles?esc(L==='prov'?pName(id):cName(id)):''}</title></path>`}
 if(L==='prov')s+=`<path class="ccb" d="${Object.keys(MAP.ccaa).map(k=>MAP.ccaa[k].d).join('')}"/>`;
 s+=`<path class="inset" d="${MAP.inset}"/>`;
 /* Ceuta y Melilla como puntos; zonas pequeñas con área de toque extra */
 [['51','18'],['52','19']].forEach(([p,c])=>{const id=L==='prov'?p:c;const xy=MAP.prov[p].c;const dim=o.only&&!o.only.includes(id)?' dim':'';s+=`<circle class="rg dot${dim} ${o.cls?o.cls(id)||'':''}" data-id="${id}" style="--h:${HUE[c]}" cx="${xy[0]}" cy="${xy[1]}" r="5"/>`});
 if(o.tap){const small=L==='prov'?Object.keys(MAP.prov).filter(k=>MAP.prov[k].a<450||['07','51','52'].includes(k)):['17','04','18','19','05'];
  small.forEach(id=>{const c=L==='prov'?MAP.prov[id].c:(id==='18'?MAP.prov['51'].c:id==='19'?MAP.prov['52'].c:MAP.ccaa[id].c);s+=`<circle class="hit" data-id="${id}" cx="${c[0]}" cy="${c[1]}" r="${id==='04'||id==='07'?16:id==='05'?12:8}"/>`})}
 (o.labels||[]).forEach(([id,t,big])=>{const c=L==='prov'?MAP.prov[id].c:(id==='18'?MAP.prov['51'].c:id==='19'?MAP.prov['52'].c:MAP.ccaa[id].c);const up=L==='prov'?(id==='51'||id==='52'):(id==='18'||id==='19');s+=`<text class="lbl${big?' big':''}" x="${c[0]}" y="${c[1]+(up?-9:3)}">${esc(t)}</text>`});
 return`<div class="map ${o.tap?'tap':''}" id="${o.id||'map'}"><svg viewBox="${MAP.vb.join(' ')}" role="img" aria-label="${esc(o.aria||'Mapa de España')}">${s}</svg></div>`}
function wireMap(id,fn){const m=document.getElementById(id);if(!m)return;m.addEventListener('click',e=>{const t=e.target.closest('[data-id]');if(t)fn(t.dataset.id,t)})}
function setCls(mapId,id,cls){document.querySelectorAll(`#${mapId} .rg[data-id="${id}"]`).forEach(el=>{el.classList.remove('ok','ko','hl','flash','sel');if(cls)cls.split(' ').forEach(c=>el.classList.add(c))})}

  if(mode==='ccaa')R=shuffle(Object.keys(CC).filter(c=>!st.onlyNotes||inNotes(c))).slice(0,10).map(c=>({level:'ccaa',ans:[c],q:`¿Dónde está <b>${cName(c)}</b>?`,cc:c,name:cName(c)}));

  else{const ps=shuffle(Object.keys(PROV).filter(p=>(!st.onlyNotes||inNotes(ccOf(p)))&&PROV[p][1]!==pName(p)).concat(shuffle(Object.keys(PROV).filter(p=>(!st.onlyNotes||inNotes(ccOf(p)))&&PROV[p][1]===pName(p))).slice(0,4)));R=shuffle(ps.slice(0,10)).map(p=>({level:'prov',ans:[p],q:`¿En qué provincia está la ciudad de <b>${PROV[p][1]}</b>?`,cc:ccOf(p),name:pName(p)}))}}
 if(id==='que'){const lvl=opt.mode||(C?'prov':(Math.random()<.5?'ccaa':'prov'));const items=C?(provsOf(C).length>1?provsOf(C):[C]):(lvl==='ccaa'?Object.keys(CC).filter(c=>!st.onlyNotes||inNotes(c)):Object.keys(PROV).filter(p=>!st.onlyNotes||inNotes(ccOf(p))));
  const L=C&&provsOf(C).length===1?'ccaa':(C?'prov':lvl);let it=shuffle(items);while(it.length<10)it=it.concat(shuffle(items));
  R=it.slice(0,10).map(x=>{const isP=L==='prov';const nm=isP?pName(x):cName(x);const cap=isP?PROV[x][1]:CC[x][1];const sib=isP?Object.keys(PROV).filter(p=>p!==x&&(C?true:ccOf(p)===ccOf(x)||Math.random()<.1)):Object.keys(CC).filter(c=>c!==x);
   const near=isP?shuffle(Object.keys(PROV).filter(p=>p!==x&&ccOf(p)===ccOf(x))).concat(shuffle(Object.keys(PROV).filter(p=>p!==x&&ccOf(p)!==ccOf(x)))):shuffle(Object.keys(CC).filter(c=>c!==x));
   const opts=shuffle([nm,...near.slice(0,3).map(y=>isP?pName(y):cName(y))]);const capPool=isP?Object.keys(PROV).filter(p=>p!==x).map(p=>PROV[p][1]):Object.keys(CC).filter(c=>c!==x&&!c.match(/^(05)$/)).map(c=>CC[c][1]);
   return{level:L,show:x,q:`¿Qué ${isP?'provincia':'comunidad'} está iluminada?`,choose:opts,ans:nm,cc:isP?ccOf(x):x,name:nm,cap,capOpts:shuffle([cap,...shuffle([...new Set(capPool)].filter(y=>y!==cap)).slice(0,3)]),zoom:C}})}

  R=shuffle(shuffle(RELQ).slice(0,6).map(([q,c,e])=>({level:'ccaa',ans:[c],q,cc:c,name:cName(c),exp:e})).concat(cos))}

function drawRound(){const r=G.rounds[G.k];const g=GAMES.find(x=>x.id===G.id);

  $('#pre').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.textContent===r.pre.ans;if(first)r.preOk=ok;first=false;if(!ok){b.classList.add('wrong');b.disabled=true;return}b.classList.add('right');$('#pre').querySelectorAll('.opt').forEach(x=>x.disabled=true);setTimeout(()=>{$('#pre').innerHTML='';$('#gmap').style.display='';roundTap(r)},500)});return}

function roundTap(r){$('#prompt').innerHTML=r.q;let tries=0,done=false;
 wireMap('gmap',id=>{if(done)return;tries++;const L=r.level;const ok=r.ans.includes(id);

/* =================== PASAPORTE =================== */
function renderPassport(){const got=Object.keys(CC).filter(c=>(S.pass[c]||0)>=STAMP_AT).length;const any=Object.keys(S.pass).length||Object.keys(S.best).length;
 $('#passport').innerHTML=`<h2>Mi pasaporte: ${got} de ${Object.keys(CC).filter(inNotes).length} sellos</h2><p class="note">Ganas el sello de una comunidad cuando aciertas ${STAMP_AT} preguntas sobre ella en cualquier juego.</p>
 <div class="stamps">${CCLIST.filter(inNotes).map((c,i)=>{const n=S.pass[c]||0;const g=n>=STAMP_AT;return`<div class="st ${g?'got':''}" style="--h:${HUE[c]};--r:${(i%5-2)*4}deg"><span><b>${g?'✓':Math.min(n,STAMP_AT)+'/'+STAMP_AT}</b>${cName(c)}</span></div>`}).join('')}</div>
 <div class="pfoot"><span>${any?'':'Todavía no has empezado el viaje en este dispositivo.'}</span>${st.confirm?`<span class="rconf">¿Seguro? <button class="rbtn danger" id="rYes" type="button">Sí, borrar</button><button class="rbtn" id="rNo" type="button">Cancelar</button></span>`:`<button class="rbtn" id="rst" type="button"${any?'':' disabled'}>Borrar progreso</button>`}</div>`;
 if($('#rst'))$('#rst').onclick=()=>{st.confirm=true;renderPassport()};if($('#rNo'))$('#rNo').onclick=()=>{st.confirm=false;renderPassport()};
 if($('#rYes'))$('#rYes').onclick=()=>{S={best:{},pass:{}};save();st.confirm=false;renderPassport();if(st.tab==='jue')renderJue()}}

function markTabs(){[['tExp','exp'],['tJue','jue'],['tPru','pru']].forEach(([id,k])=>$('#'+id).setAttribute('aria-pressed',k===st.tab))}
function setTab(t){st.tab=t;markTabs();({exp:renderExp,jue:renderJue,pru:renderPru})[t]();window.scrollTo({top:0})}
$('#tExp').onclick=()=>setTab('exp');$('#tJue').onclick=()=>setTab('jue');$('#tPru').onclick=()=>setTab('pru');
renderPassport();setTab('exp');
</script>
