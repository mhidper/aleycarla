<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de Ale y Carla</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap">
<style>
/* Layout: columna central; niñas como dos cuadernos grandes, asignaturas como tapas de cuaderno de colores con etiqueta escrita a mano */
:root{
  --bg:#eaeff7; --paper:#fdfdfb; --grid:#e2e9f4; --ink:#1b2a4a; --muted:#56637d; --line:#cfd8e7; --marker:#c0127e; --chip:#ffffff;
  --cover-l:84%; --cover-s:55%; --label:#fdfdfb;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1524; --paper:#151f36; --grid:#1d2a46; --ink:#e4eaf6; --muted:#9ba8c3; --line:#2a3856; --marker:#ff5fb9; --chip:#18233d;
  --cover-l:26%; --cover-s:35%; --label:#151f36; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--f-display);font-weight:800;font-size:2.3rem;line-height:1.08;margin:0;letter-spacing:-.015em;text-wrap:balance}
h1 .hand{color:var(--marker);font-family:var(--f-hand);font-size:1.15em;font-weight:700}
.lead{color:var(--muted);margin:.35em 0 0;max-width:60ch}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:.92rem;font-weight:700;color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
a:focus-visible{outline:3px solid var(--marker);outline-offset:3px;border-radius:6px}

/* Niñas */
.girls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.girl{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:190px;text-decoration:none;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:6px;padding:20px 20px 18px 34px;box-shadow:0 12px 26px -18px rgba(20,30,60,.5);transition:transform .15s}
.girl::before{content:"";position:absolute;left:12px;top:14px;bottom:14px;width:0;border-left:3px dotted var(--line)}
.girl:hover{transform:translateY(-3px) rotate(-.4deg)}
.girl .initial{position:absolute;top:6px;right:18px;font-family:var(--f-hand);font-size:5rem;line-height:1;color:var(--marker);transform:rotate(-6deg)}
.girl b{font:800 2rem var(--f-display);line-height:1.1}
.girl span{color:var(--muted)}

/* Asignaturas: tapas de cuaderno */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.cover{--h:215;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;min-height:150px;text-decoration:none;color:var(--ink);background:hsl(var(--h) var(--cover-s) var(--cover-l));border-radius:4px 10px 10px 4px;padding:18px 14px;box-shadow:inset 6px 0 0 hsl(var(--h) var(--cover-s) calc(var(--cover-l) - 10%)),0 10px 22px -16px rgba(20,30,60,.55);transition:transform .15s}
.cover:hover{transform:translateY(-3px)}
.label{background:var(--label);border:1.5px solid var(--line);border-radius:6px;padding:8px 12px;text-align:center;width:100%;max-width:190px}
.label b{display:block;font-family:var(--f-hand);font-size:1.6rem;line-height:1.05;font-weight:700}
.label span{font-size:.8rem;color:var(--muted);font-weight:700}
.cover.none{opacity:.72}

/* Apps */
.apps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.apps a{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.apps a:hover b{text-decoration:underline}
.apps b{font:800 1.15rem var(--f-display)}
.apps span{color:var(--muted);font-size:.95rem}
.empty{background:var(--chip);border:1.5px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted)}
@media (max-width:420px){h1{font-size:1.9rem}.girl{min-height:150px}.girl .initial{font-size:4rem}}
@media (prefers-reduced-motion:reduce){.girl,.cover{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="catalogo.js"></script>
<script>
const C = window.CATALOGO;
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nApps = n => n === 0 ? 'Sin apps todavía' : n === 1 ? '1 app' : n + ' apps';

function home(){
  document.title = 'Estudio de Ale y Carla';
  app.innerHTML = `<header><h1>¿Quién va a <span class="hand">estudiar</span>?</h1><p class="lead">Elige tu cuaderno y después la asignatura.</p></header>
  <div class="girls">${Object.entries(C).map(([id, g]) => {
    const total = g.asignaturas.reduce((a, s) => a + s.apps.length, 0);
    return `<a class="girl" href="#${id}"><span class="initial">${esc(g.nombre[0])}</span><b>${esc(g.nombre)}</b><span>${esc(g.curso)} · ${nApps(total)}</span></a>`;
  }).join('')}</div>`;
}

function girl(id){
  const g = C[id]; if (!g) return home();
  document.title = 'Asignaturas de ' + g.nombre;
  app.innerHTML = `<nav class="crumbs"><a href="#">Inicio</a><span>/</span><span>${esc(g.nombre)}</span></nav>
  <header><h1>Asignaturas de <span class="hand">${esc(g.nombre)}</span></h1><p class="lead">${esc(g.curso)}. Elige una asignatura.</p></header>
  <div class="subjects">${g.asignaturas.map(s => `<a class="cover${s.apps.length ? '' : ' none'}" style="--h:${s.tono}" href="#${id}/${s.id}"><div class="label"><b>${esc(s.nombre)}</b><span>${nApps(s.apps.length)}</span></div></a>`).join('')}</div>`;
}

function subject(id, sid){
  const g = C[id]; const s = g && g.asignaturas.find(x => x.id === sid);
  if (!s) return girl(id);
  document.title = s.nombre + ' · ' + g.nombre;
  app.innerHTML = `<nav class="crumbs"><a href="#">Inicio</a><span>/</span><a href="#${id}">${esc(g.nombre)}</a><span>/</span><span>${esc(s.nombre)}</span></nav>
  <header><h1>${esc(s.nombre)}</h1><p class="lead">${esc(g.nombre)} · ${esc(g.curso)}</p></header>
  ${s.apps.length ? `<ul class="apps">${s.apps.map(a => `<li><a href="${esc(a.ruta)}"><b>${esc(a.titulo)}</b><span>${esc(a.descripcion)}</span></a></li>`).join('')}</ul>`
    : `<p class="empty">Todavía no hay apps de ${esc(s.nombre)}. Irán apareciendo aquí.</p>`}`;
}

function route(){
  const [id, sid] = location.hash.replace(/^#/, '').split('/');
  if (!id) home(); else if (!sid) girl(id); else subject(id, sid);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
